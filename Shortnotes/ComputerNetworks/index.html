 `<p>10BASE-T (10&nbsp;Mbps) &rarr; 100BASE-TX Fast Ethernet &rarr; 1000BASE-T Gigabit &rarr; 10/25/40/100/200/400&nbsp;GbE, with 800GbE emerging for AI/ML fabrics. Each jump mostly changed encoding, wiring, and optics &mdash; the frame format has stayed essentially compatible for four decades, which is exactly the payoff of good layering.</p>`),
sec('How a switch learns and forwards',
 flow(['Frame arrives on port P with source MAC A','Switch records "A is reachable via P" in its forwarding table','Switch looks up destination MAC in the table','Found &rarr; forward only out that port ("filtering")','Not found &rarr; flood out every other port ("flooding")'])+
 `<p>This <strong>MAC learning</strong> process is why switches need no configuration to work: the table converges automatically as traffic flows, and entries age out if a MAC goes quiet.</p>`),
sec('Interactive: learning switch',
 '<div id="tool-switchlearn"></div>')
], {tool:'switchlearn'});

reg('vlan','09','VLAN & Layer-2 Design',
'A single physical switch fabric can be sliced into many logically isolated broadcast domains &mdash; without VLANs, every enterprise LAN would be one giant, insecure, non-scaling broadcast domain.',
[
sec('VLANs and tagging',
 `<p>A <strong>VLAN</strong> (Virtual LAN) groups ports into an independent broadcast domain regardless of physical location. An <strong>access port</strong> belongs to exactly one VLAN and carries untagged frames to an end device; a <strong>trunk port</strong> carries traffic for multiple VLANs between switches, tagging each frame per <strong>802.1Q</strong> with a 4-byte VLAN ID field. The <strong>native VLAN</strong> on a trunk is the one exception sent untagged, for backward compatibility. Routing between VLANs (<strong>inter-VLAN routing</strong>) needs a Layer-3 device &mdash; classically a "<strong>router-on-a-stick</strong>" with one trunked interface subdivided into per-VLAN sub-interfaces, or a Layer-3 switch doing the same internally.</p>
 ${hdiag('vlantag','FIG. — 802.1Q TRUNK TAGGING','One physical trunk carries frames for multiple VLANs — each tagged so the far switch knows which broadcast domain it belongs to.')}`),
sec('Loop prevention: Spanning Tree',
 `<p>Redundant Layer-2 links provide resilience but create loops, which are catastrophic at Layer 2 because frames have no TTL &mdash; a loop causes an exponential broadcast storm. <strong>STP</strong> (and faster successors <strong>RSTP</strong>, <strong>MSTP</strong>) elects a <strong>root bridge</strong> via exchanged <strong>BPDUs</strong>, computes the shortest path from every switch to the root, and logically blocks redundant links, transitioning ports through defined states (blocking &rarr; listening &rarr; learning &rarr; forwarding) so a backup path activates automatically if the primary fails.</p>`),
sec('Enterprise pattern',
 `<p>A typical campus design separates VLANs by function &mdash; voice, data, guest Wi-Fi, IoT, management &mdash; each mapped to its own subnet and security policy, trunked between access and distribution switches, with inter-VLAN routing and firewalling concentrated at the distribution/core layer where policy is easiest to enforce and audit.</p>`)
]);

/* ===== GROUP III — NETWORK LAYER ===== */
reg('ipnet','10','IP Networking',
'IP is the Internet\'s narrow waist: one simple, best-effort, connectionless datagram service that every link technology below it, and every application above it, agrees to speak.',
[
sec('Logical addressing and best-effort delivery',
 `<p>Where MAC addresses are flat and link-local, <strong>IP addresses</strong> are hierarchical and globally routable, which is what lets routers forward based on network prefixes instead of a table entry per host on Earth. IP offers <strong>best-effort</strong> delivery: no guarantee of arrival, order, or timing &mdash; reliability, if needed, is built by the transport layer above, exactly as the end-to-end principle prescribes.</p>`),
sec('IPv4 header, field by field',
 '<div id="tool-ipv4hdr"></div>')
], {tool:'ipv4hdr'});

reg('subnetting','11','IPv4 Addressing & Subnetting',
'Subnetting is the single most interview-tested skill in networking: turning one address block into the right number of right-sized, non-overlapping networks.',
[
sec('Structure: network ID, host ID, mask',
 `<p>An IPv4 address is 32 bits, conventionally written as four dotted decimal octets. A <strong>subnet mask</strong> (or <strong>prefix length</strong>, written <code>/n</code> under CIDR) splits those 32 bits into a <strong>network portion</strong> (identifies the subnet) and a <strong>host portion</strong> (identifies a device within it). <strong>Classful addressing</strong> (Class A/B/C, fixed /8, /16, /24 boundaries) was replaced in the 1990s by <strong>classless addressing (CIDR)</strong>, which allows a prefix of any length &mdash; the change that kept the IPv4 address space usable for another two decades.</p>`),
sec('Private ranges & special addresses',
 table(['Block','Purpose'],[
  ['10.0.0.0/8','Private (RFC 1918)'],
  ['172.16.0.0/12','Private (RFC 1918)'],
  ['192.168.0.0/16','Private (RFC 1918)'],
  ['127.0.0.0/8','Loopback'],
  ['169.254.0.0/16','Link-local (APIPA)'],
  ['0.0.0.0/8, 255.255.255.255','"This network", limited broadcast'],
  ['224.0.0.0/4','Multicast'],
 ])),
sec('FLSM, VLSM, and summarization',
 `<p><strong>FLSM</strong> (Fixed-Length Subnet Mask) splits a block into equal-sized subnets &mdash; simple, but wasteful if subnets need very different host counts. <strong>VLSM</strong> (Variable-Length Subnet Mask) allocates a differently sized subnet to each requirement, minimizing waste at the cost of more careful planning. <strong>Route summarization / aggregation</strong> runs the reverse operation at scale: many contiguous smaller networks are advertised upstream as one larger prefix, keeping global routing tables from growing linearly with every enterprise subnet on Earth.</p>`),
sec('Interactive subnet calculator',
 '<div id="tool-subnet"></div>')
], {tool:'subnet'});

reg('nat','12','Network Address Translation (NAT)',
'NAT let the IPv4 Internet keep growing for 20+ years past the point its 4.3 billion addresses should have run out, by letting many private hosts share one public address.',
[
sec('Types of NAT',
 table(['Type','Mapping','Use case'],[
  ['Static NAT','One private IP &harr; one fixed public IP','Publishing a server permanently'],
  ['Dynamic NAT','Private IP &harr; one of a pool of public IPs','Temporary, per-session mapping from a pool'],
  ['PAT / NAPT (overload)','Many private IPs &rarr; one public IP, disambiguated by port','Home/office routers &mdash; the dominant real-world case'],
  ['SNAT','Rewrites the source address','Outbound traffic leaving a private network'],
  ['DNAT','Rewrites the destination address','Inbound port-forwarding to an internal server'],
 ])+
 hdiag('nattranslate','FIG. — NAT/PAT TRANSLATION','The private source address and port are rewritten on the way out; the NAT table remembers the mapping so replies find their way back.')),
sec('Why it exists, and what it breaks',
 `<p>NAT exists purely to conserve scarce public IPv4 addresses; as a side effect it also hides internal topology. Its cost is breaking the assumption that any two Internet hosts can address each other directly: a host behind NAT can't easily receive an unsolicited inbound connection, which is fatal for naive peer-to-peer protocols. <strong>NAT traversal</strong> techniques &mdash; <strong>STUN</strong> (discover your public mapping), <strong>TURN</strong> (relay traffic when direct connection is impossible), and <strong>ICE</strong> (try every candidate path and pick the best) &mdash; exist specifically to route around this, and underpin WebRTC voice/video calling.</p>`)
]);

reg('routeradmin','12B','Inside a Router — The Admin Panel, Explained',
'Every home and small-office router hides its entire job behind one web page. This chapter is a live, interactive replica of that admin panel — the same layout, tabs, and fields you\'d see logging into 192.168.0.1 — with every single field explained: what it means, why it exists, and which earlier NETLAB chapter it actually belongs to.',
[
sec('What a router actually is',
 `<p>Strip away the marketing name and a consumer router is really <strong>five separate functions</strong> running on one box: a <strong>DHCP server</strong> (hands out LAN addresses), a <strong>NAT engine</strong> (translates your private LAN to one public WAN address), a <strong>firewall</strong> (blocks unsolicited inbound traffic by default), a <strong>Wi-Fi access point</strong> (bridges wireless stations onto the wired LAN), and a <strong>router</strong> in the strict sense &mdash; something that forwards packets between your LAN and your ISP\'s network. Every one of those five functions has its own settings page in the admin panel below, and every one of those functions was covered, mechanism by mechanism, somewhere earlier in this platform.</p>`),
sec('Live replica — click around exactly like a real admin panel',
 '<div id="tool-routeradmin"></div>'),
sec('Reading the Status page like a network engineer',
 `<p>The <strong>Internet</strong> card on the Status page is the single most information-dense place on the entire router. Walking through the real example values above:</p>`+
 table(['Field','Value','What it actually means'],[
  ['IP Address','192.168.66.117','The router\'s own WAN-side address — assigned to it by the ISP, just like your laptop\'s LAN address is assigned by this router'],
  ['Default Gateway','192.168.66.25','This router\'s own next hop — usually the ISP\'s access router, one hop further upstream'],
  ['Primary / Secondary DNS','192.168.66.25 / 192.168.66.1','The resolvers this router (and everything behind it, by default) will query — see the DNS chapter for the full resolution chain'],
  ['Connection Type','Dynamic IP','This router is itself a DHCP <em>client</em> to the ISP — the exact DORA handshake covered in the DHCP chapter, just one layer further out'],
 ])+
 `<p>Notice the router runs the DHCP client role <em>upstream</em> (toward the ISP) and the DHCP server role <em>downstream</em> (toward your laptop and phone) at the same time — two completely independent instances of the same protocol, one on each side of the NAT boundary.</p>`),
sec('Basic vs. Advanced tabs — what actually differs',
 `<p>The <strong>Basic</strong> tab exposes only what a typical home user needs to touch: Wi-Fi name/password, guest network, and USB sharing. The <strong>Advanced</strong> tab exposes the same underlying settings plus everything a network engineer would actually reach for: static routes, port forwarding, QoS rules, firewall/ACL configuration, VLAN assignment on supported models, and detailed wireless radio parameters (channel width, transmit power, 802.11 mode). Nothing is functionally different between the tabs — Basic is simply Advanced with most of the dials hidden.</p>`),
sec('Guest Network — segmentation for people who\'ve never heard the word "VLAN"',
 `<p>The two checkboxes <strong>"Allow guests to see each other"</strong> and <strong>"Allow guests to access my local network"</strong> are, functionally, a consumer-friendly VLAN and firewall rule bundled into two tickboxes. Leaving both unchecked puts every guest device into its own isolated broadcast domain with a route only to the Internet — no path to your printer, your NAS, or your other devices. It is the exact same Zero Trust segmentation principle from the Zero Trust Networking chapter, just implemented at home-router scale with a UI instead of a CLI.</p>`),
sec('USB Settings — the router as a tiny NAS',
 `<p>A router with a USB port is quietly running a small file-sharing service (commonly SMB and/or FTP) directly on the router\'s own CPU. Every device on the LAN reaches attached storage through the router\'s own LAN IP address — the same client/server application-layer pattern as any other file-transfer protocol, just running on hardware most people only think of as "the box the Wi-Fi comes from."</p>`),
sec('The four ways to let the outside world reach something inside (NAT Forwarding)',
 table(['Feature','Scope','Trade-off'],[
  ['Port Forwarding (Virtual Servers)','One external port → one internal IP:port, permanent','Narrow and predictable — the standard way to expose a home server'],
  ['Port Triggering','Opens an external port only after matching outbound traffic','Safer than a static forward for games/VoIP with unpredictable inbound ports'],
  ['DMZ','Exposes one entire device to all inbound traffic','Bypasses the firewall completely for that device — last resort only'],
  ['UPnP','Lets applications open ports for themselves automatically','Most convenient, least controlled — an application can open more than you\'d have manually'],
 ])+
 `<p>All four exist to solve the identical problem raised in the NAT chapter: a private IP address can\'t normally receive a connection nobody inside asked for first. One real, commonly-hit quirk worth knowing: <strong>port 80 is permanently reserved for local admin access</strong> on most routers, so forwarding port 80 to an internal web server requires first moving the router\'s own remote-management port to something like 8080 — a conflict every major router vendor\'s own support documentation calls out explicitly.</p>`),
sec('VPN Server and Dynamic DNS — reaching your own LAN from outside',
 `<p>Many routers (TP-Link\'s Archer series among them) can run their own <strong>VPN Server</strong> &mdash; commonly OpenVPN and PPTP, with WireGuard increasingly available on newer firmware &mdash; turning the router itself into the far end of the tunnel described in the VPN chapter. Because a VPN server\'s own listening port has to be reachable from outside, actually using this feature almost always means combining it with a <strong>Port Forwarding</strong> rule and, since most home WAN addresses are dynamic (recall "Connection Type: Dynamic IP" on the Status page), a <strong>Dynamic DNS</strong> service so the router stays reachable under one fixed hostname even as its real IP changes underneath it.</p>`),
sec('System Tools — the maintenance layer nobody thinks about until something breaks',
 table(['Tool','What it actually does'],[
  ['Firmware Upgrade','Installs a new version of the router\'s OS — always back up configuration first, since an interrupted upgrade is one of the most common causes of a hard factory reset'],
  ['Backup & Restore','Saves/loads the entire configuration as a single .bin file'],
  ['Time Settings','Syncs the router\'s clock via NTP — required for logs, schedules, and certificate validation to mean anything'],
  ['System Log','A running record of DHCP leases, Wi-Fi associations, and firewall events — the router\'s own miniature version of the Observability chapter\'s logs'],
  ['Reboot Schedule','Automatically restarts the router on a timer, a blunt but effective fix for slow memory leaks in consumer firmware'],
  ['Factory Default Restore','Wipes all configuration back to the original defaults'],
 ])),
sec('The boot sequence this panel is quietly the result of',
 flow(['Router powers on','Wi-Fi AP starts','DHCPv4 server starts','NAT engine starts','Firewall starts','IPv6 Router Advertisement starts','Routing table initialized','Router negotiates its own WAN connection with the ISP','Every value on the Status page above reflects the result of this sequence'])+
 callout('','CROSS-REFERENCE','This exact sequence is traced packet-by-packet in the History → "Anatomy of One Page Load" chapter\'s Phase 0, and every individual mechanism (DHCP, NAT, ARP, DNS forwarding) has its own dedicated chapter in the Network Layer group.'))
], {tool:'routeradmin'});

reg('ipv6','13','IPv6',
'IPv6 is not "IPv4 with more digits" &mdash; it rebuilds addressing, autoconfiguration, and neighbor discovery to solve exhaustion and simplify decades of IPv4 accretion at once.',
[
sec('Why IPv6, and the address structure',
 `<p>IPv4's 32-bit space (&asymp;4.3 billion addresses) was exhausted at the regional registries years ago; IPv6 uses 128 bits &mdash; enough for roughly 3.4&times;10<sup>38</sup> addresses, effectively removing exhaustion as a constraint. Addresses are written as eight groups of four hex digits (<code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code>), with consecutive zero groups collapsible once to <code>::</code>.</p>
 ${hdiag('ipv6addr','FIG. — ANATOMY OF A GLOBAL UNICAST ADDRESS','128 bits split into a routed prefix, a locally-assigned subnet, and a 64-bit interface identifier.')}`),
sec('Address types & autoconfiguration',
 table(['Type','Scope','Purpose'],[
  ['Global unicast','Routable Internet-wide','Public address, analogous to public IPv4'],
  ['Link-local (fe80::/10)','One link only','Required on every interface; used by ND/SLAAC'],
  ['Unique local (fc00::/7)','Private, org-wide','Analogous to RFC 1918 private space'],
  ['Multicast (ff00::/8)','Group','Replaces IPv4 broadcast entirely &mdash; IPv6 has no broadcast'],
  ['Anycast','Nearest of many','Same address on multiple nodes, routed to the closest'],
 ])+
 `<p><strong>SLAAC</strong> (Stateless Address Autoconfiguration) lets a host build its own address from a router-advertised prefix plus its interface identifier, with no DHCP server required; <strong>DHCPv6</strong> remains available for stateful, centrally-managed assignment. <strong>Neighbor Discovery Protocol (NDP)</strong> replaces ARP, and <strong>Duplicate Address Detection</strong> confirms a chosen address is unique before it's used.</p>`),
sec('Transition mechanisms',
 `<p>IPv4 and IPv6 don't interoperate directly, so networks run <strong>dual stack</strong> (both protocols side by side), <strong>tunneling</strong> (encapsulate IPv6 inside IPv4 to cross legacy segments), or <strong>NAT64/DNS64</strong> (let IPv6-only clients reach the IPv4-only Internet by synthesizing IPv6 addresses for IPv4 destinations).</p>`)
]);

reg('arpicmpdhcp','14','ARP, ICMP & DHCP',
'Three small, ubiquitous protocols do the unglamorous plumbing that makes IP networks actually usable: mapping addresses, reporting errors, and handing out configuration.',
[
sec('ARP — Address Resolution Protocol',
 flow(['Host needs MAC for IP 192.168.1.1','Broadcasts ARP request: "Who has 192.168.1.1?"','Owner unicasts ARP reply with its MAC','Requester caches the mapping in its ARP table'])+
 callout('danger','SECURITY NOTE','ARP has no authentication. <strong>Gratuitous ARP</strong> (an unsolicited announcement, legitimately used for failover) and malicious <strong>ARP spoofing</strong> use the same mechanism: broadcasting a false IP&rarr;MAC mapping to redirect traffic through an attacker for a man-in-the-middle position.')),
sec('ICMP — Internet Control Message Protocol',
 `<p>ICMP carries operational information, not user data: <strong>echo request/reply</strong> (the basis of <code>ping</code>), <strong>destination unreachable</strong>, and <strong>time exceeded</strong> (TTL hit zero &mdash; the mechanism <code>traceroute</code> exploits by sending packets with increasing TTL and recording who reports the expiry at each hop).</p>`),
sec('DHCP — Dynamic Host Configuration Protocol',
 flow(['DISCOVER &mdash; client broadcasts, looking for a server','OFFER &mdash; server proposes an IP + lease','REQUEST &mdash; client formally asks for that offer','ACK &mdash; server confirms the lease'])+
 hdiag('dhcpdora','FIG. — DHCP DORA, END TO END','Four broadcast/unicast messages later, the client has a full IP configuration and no manual setup was needed.')+
 `<p>Remembered as <strong>DORA</strong>. Beyond an IP address, DHCP hands out subnet mask, default gateway, DNS servers, and lease duration &mdash; the reason a laptop needs zero manual configuration to join a network.</p>`)
]);

reg('routing','15','Routing Fundamentals',
'Forwarding is the mechanical act of moving a packet out the correct interface; routing is the algorithmic process, run continuously, that decides what "correct" even means.',
[
sec('Forwarding vs routing',
 `<p><strong>Forwarding</strong> is the fast-path, per-packet lookup in a <strong>routing table</strong> to find the <strong>next hop</strong>. <strong>Routing</strong> is the slower, control-plane process (static configuration or a dynamic protocol) that builds and updates that table. <strong>Administrative distance</strong> ranks trust between different routing sources when they disagree about the same destination; a route's <strong>metric</strong> ranks paths from the same source by cost.</p>`),
sec('Static vs dynamic',
 `<p><strong>Static routes</strong> are manually configured &mdash; predictable and secure, but don't adapt to failures. A <strong>default route</strong> (0.0.0.0/0) is the static catch-all for "everything not more specifically known." <strong>Dynamic routing protocols</strong> exchange reachability information between routers and recompute automatically after a topology change.</p>`),
sec('The two families of algorithm',
 table(['Family','Idea','Examples'],[
  ['Distance Vector','Each router shares its own routing table with neighbors; "routing by rumor"','RIP'],
  ['Link State','Each router floods its local links to everyone, then independently computes the full shortest-path tree','OSPF, IS-IS'],
  ['Path Vector','Like distance vector, but carries the full AS-level path to allow policy decisions and loop detection','BGP'],
 ])+
 `<p>Underneath both distance-vector and link-state protocols sit two classic graph algorithms: <strong>Dijkstra's algorithm</strong> (single-source shortest path on a graph with non-negative weights &mdash; what OSPF runs locally) and the <strong>Bellman-Ford algorithm</strong> (iteratively relaxes edges, tolerates negative weights, and is what distributed distance-vector protocols effectively compute cooperatively).</p>`),
sec('Interactive routing / Dijkstra simulator',
 '<div id="tool-routesim"></div>')
], {tool:'routesim'});

reg('rip','16','RIP',
'RIP is the simplest real routing protocol ever standardized &mdash; and its failure modes are exactly what later protocols were built to avoid.',
[
sec('Mechanics',
 `<p>RIP is a distance-vector protocol using <strong>hop count</strong> as its only metric, capped at 15 (16 = infinity/unreachable) &mdash; a hard ceiling that makes RIP unusable in large networks by design. Routers broadcast (RIPv1) or multicast (RIPv2, which also adds subnet masks and simple authentication) their full routing table every 30 seconds.</p>`),
sec('Loop-prevention mechanisms',
 table(['Mechanism','What it does'],[
  ['Split horizon','Never advertise a route back out the interface it was learned from'],
  ['Route poisoning','Explicitly advertise a failed route as metric 16 (infinite) rather than silently withdrawing it'],
  ['Hold-down timers','Ignore new information about a route for a period after it\'s marked unreachable, letting the bad news propagate first'],
 ])+
 callout('warn','COUNT-TO-INFINITY','Without these safeguards, two routers can keep incrementing a bad route\'s metric back and forth after a link fails, believing the path still exists through each other &mdash; slowly climbing toward infinity instead of converging. This single failure mode is why virtually every later IGP either abandoned pure distance-vector (OSPF) or hardened it heavily (EIGRP\'s DUAL algorithm).'))
]);

reg('ospf','17','OSPF',
'OSPF is the workhorse interior gateway protocol of enterprise and carrier networks: fast-converging, hierarchical, and built entirely on Dijkstra.',
[
sec('Architecture',
 `<p>OSPF is <strong>link-state</strong>: every router floods <strong>LSAs</strong> (Link State Advertisements) describing its directly connected links, which every other router assembles into an identical <strong>LSDB</strong> (Link State Database). Each router then independently runs <strong>Dijkstra's SPF algorithm</strong> over that database to compute its own shortest-path tree &mdash; so unlike distance-vector, routers never trust a neighbor's computed distances, only raw topology facts.</p>`),
sec('Areas and roles',
 `<p>Large OSPF domains are split into <strong>areas</strong> to bound LSDB size and flooding scope, all attached to a mandatory <strong>Area 0 / backbone area</strong> that all inter-area traffic must transit. On multi-access segments (like Ethernet), a <strong>DR</strong> (Designated Router) and <strong>BDR</strong> (Backup DR) are elected to reduce the number of adjacencies needed, cutting flooding overhead from O(n&sup2;) to O(n).</p>`),
sec('Neighbor states, cost, and versions',
 `<p>Adjacency forms through defined states (Down &rarr; Init &rarr; 2-Way &rarr; ExStart &rarr; Exchange &rarr; Loading &rarr; Full). Path <strong>cost</strong> is inversely proportional to interface bandwidth by default, summed along the path. <strong>OSPFv2</strong> runs over IPv4; <strong>OSPFv3</strong> extended it for IPv6 while keeping the same link-state mechanics.</p>`)
]);

reg('bgp','18','BGP',
'BGP is the protocol that glues roughly 70,000+ independently operated networks into one Internet &mdash; and it does so with policy, not just shortest paths.',
[
sec('AS, eBGP, iBGP',
 `<p>An <strong>Autonomous System (AS)</strong> is a network (or group of networks) under one administrative policy, identified by an ASN. <strong>eBGP</strong> runs between different ASes; <strong>iBGP</strong> distributes externally-learned routes within one AS so every internal router agrees on the best exit. BGP is a <strong>Path Vector</strong> protocol: routes carry the literal sequence of ASes traversed, which both prevents loops (a router rejects any route already containing its own ASN) and lets operators apply rich policy.</p>`),
sec('Key path attributes',
 table(['Attribute','Meaning'],[
  ['AS_PATH','Ordered list of ASes the route has crossed &mdash; loop detection + a tiebreaker'],
  ['NEXT_HOP','IP address to forward toward for this route'],
  ['LOCAL_PREF','iBGP-only; higher wins &mdash; the primary "prefer this exit" knob'],
  ['MED','Suggests to a neighboring AS which of several entry points to prefer'],
  ['ORIGIN','How the route entered BGP (IGP, EGP, incomplete)'],
  ['COMMUNITY','Tag used to trigger policy actions on routers along the path'],
 ])+
 hdiag('bgppath','FIG. — AS_PATH IN ACTION','A route carries the literal chain of ASes it crossed — both a loop guard and a policy input.')),
sec('Peering, transit, and security',
 `<p>Networks reach each other either by paying for <strong>transit</strong> (buying reachability to the whole Internet from a larger provider) or by <strong>peering</strong> (exchanging traffic directly, often free, typically at an <strong>Internet Exchange Point</strong>). Because BGP trusts announcements by default, <strong>route hijacking</strong> (falsely announcing someone else's prefix) and <strong>route leaks</strong> (accidentally re-announcing routes outside intended policy) are recurring real-world incidents; <strong>RPKI</strong> and <strong>ROAs</strong> let a prefix owner cryptographically state which AS is authorized to originate it, and <strong>BGPsec</strong> extends similar cryptographic validation to the full path, though deployment of both remains partial industry-wide.</p>`)
]);

reg('mpls','19','MPLS',
'MPLS lets a network forward packets by fast label lookup instead of the longest-prefix IP match &mdash; and along the way, made traffic engineering and VPN services first-class network features.',
[
sec('Labels and label switching',
 `<p>A short, fixed-length <strong>label</strong> is pushed onto a packet at the network edge, mapping it to a <strong>FEC</strong> (Forwarding Equivalence Class &mdash; a group of packets treated identically). <strong>LERs</strong> (Label Edge Routers) push/pop labels at the domain boundary; <strong>LSRs</strong> (Label Switch Routers) in the core simply swap labels and forward, without re-examining the IP header at every hop. <strong>LDP</strong> distributes labels for best-effort paths; <strong>RSVP-TE</strong> signals explicit, traffic-engineered paths with reserved bandwidth.</p>
 ${hdiag('mplslabel','FIG. — LABEL SWITCHING ACROSS AN MPLS CORE','Edge routers push/pop labels; core routers only ever swap a label and forward — no IP lookup in the middle.')}`),
sec('MPLS VPNs and traffic engineering',
 `<p>MPLS VPNs let a provider carry many customers\' private traffic over one shared core, each isolated by its own label space (and, for Layer-3 VPNs, its own VRF routing table) &mdash; the technology behind most enterprise "private WAN" services. <strong>Traffic engineering</strong> lets an operator steer traffic along explicit, non-shortest paths to balance load, something pure IP routing does poorly on its own.</p>`),
sec('MPLS vs Segment Routing',
 table(['','Traditional IP routing','MPLS','Segment Routing'],[
  ['State in the core','Per-packet longest-prefix match','Per-label forwarding state','No per-flow state; path encoded in packet header'],
  ['Traffic engineering','Weak','Strong, via RSVP-TE','Strong, simpler control plane (source routing)'],
  ['Typical use','The public Internet','Carrier/enterprise WANs, VPNs','Modern carrier/SDN cores replacing RSVP-TE'],
 ]))
]);

/* ===== GROUP IV — TRANSPORT ===== */
reg('transport','20','Transport Layer',
'The transport layer takes IP\'s best-effort, host-to-host delivery and turns it into process-to-process communication &mdash; optionally adding reliability, ordering, and fairness along the way.',
[
sec('Ports, sockets, multiplexing',
 `<p>A <strong>port number</strong> (0&ndash;65535) identifies a specific process on a host; a <strong>socket</strong> is the (IP, port) pair &mdash; or for TCP, the 4-tuple of source/destination IP and port &mdash; that uniquely names one conversation. <strong>Multiplexing</strong> combines many application streams onto the network at the sender; <strong>demultiplexing</strong> splits them back apart at the receiver using that socket identity.</p>`),
sec('Port numbers, in full',
 `<p>Both TCP and UDP headers reserve exactly <strong>16 bits</strong> for a port number, giving 2<sup>16</sup> = <strong>65,536</strong> possible values, numbered 0&ndash;65535. An IP address answers "which machine?"; a port answers "which application/service on that machine?" &mdash; together they pin down one exact process.</p>`+
 hdiag('portsocket','FIG. — ONE IP, MANY SERVICES','The same server IP hosts HTTP, HTTPS, and SSH simultaneously, distinguished only by port number.')+
 table(['Range','Name','Typical use'],[
  ['0–1023','Well-known ports','Standard services (HTTP 80, HTTPS 443, SSH 22)'],
  ['1024–49151','Registered ports','Registered applications/services'],
  ['49152–65535','Dynamic / private (ephemeral)','Temporary client-side ports, assigned per connection'],
 ])+
 callout('','WHY THE CLIENT USES A RANDOM PORT','A browser almost never needs port 443 for itself — the OS hands it a free ephemeral port (e.g. 52000) for the outgoing side of the connection, while the destination port stays fixed at whatever the server is listening on. That is why a packet capture shows something like <code>192.168.1.10:52000 → 93.184.216.34:443</code> rather than port 443 on both ends.')),
sec('Common port examples',
 table(['Port','Service','Typical transport'],[
  ['20 / 21','FTP','TCP'],['22','SSH','TCP'],['23','Telnet','TCP'],['25','SMTP','TCP'],
  ['53','DNS','UDP / TCP'],['67 / 68','DHCP','UDP'],['80','HTTP','TCP'],['123','NTP','UDP'],
  ['143','IMAP','TCP'],['443','HTTPS','TCP, or QUIC/UDP for HTTP/3'],['587','SMTP submission','TCP'],
  ['993','IMAPS','TCP'],['995','POP3S','TCP'],
 ])),
sec('TCP and UDP have separate port namespaces',
 `<p>This trips a lot of people up: <strong>TCP port 53</strong> and <strong>UDP port 53</strong> are two completely independent namespaces &mdash; a machine can have a process bound to each simultaneously without any conflict. That is exactly why DNS can use UDP for ordinary lookups and transparently fall back to TCP for larger responses (like zone transfers) on the very same port number.</p>`),
sec('The socket 4-tuple',
 `<p>A single TCP connection is uniquely identified by four values together, not by port alone:</p>`+
 table(['Field','Example'],[['Source IP','192.168.1.10'],['Source port','52000'],['Destination IP','93.184.216.34'],['Destination port','443']])+
 `<p>Because the <em>combination</em> is what has to be unique, one machine can hold many simultaneous connections to the very same destination IP and port — each one just needs a different source port (or source IP, on a multi-homed host) to stay distinct.</p>`),
sec('How HTTP/1.1, HTTP/2 and HTTP/3 differ, purely at the port/transport level',
 table(['','Transport','Source port','Destination port'],[
  ['HTTP/1.1','TCP','ephemeral (e.g. 52000)','443'],
  ['HTTP/2','TCP','ephemeral','443'],
  ['HTTP/3','QUIC over UDP','ephemeral','443 (UDP)'],
 ])+
 `<p>HTTP/3 still fundamentally relies on port numbers — it just carries them inside <strong>UDP</strong> instead of TCP, which is why UDP port 443 is now a very common sight in modern traffic captures alongside the familiar TCP port 443.</p>`),
sec('What transport protocols choose to add',
 table(['Protocol','Reliability','Ordering','Congestion control','Typical use'],[
  ['TCP','Yes','Yes','Yes','Web, email, file transfer &mdash; anything needing correctness'],
  ['UDP','No','No','No','DNS, gaming, VoIP &mdash; anything needing speed over guarantees'],
  ['QUIC','Yes (per-stream)','Per-stream, not global','Yes','HTTP/3, modern low-latency web/mobile'],
  ['SCTP','Yes','Optional, multi-stream','Yes','Telecom signaling (SS7 over IP), multi-homing'],
 ]))
]);

reg('udp','21','UDP',
'UDP is the transport layer stripped to its minimum: no handshake, no retransmission, no flow control &mdash; just addressed datagrams, as fast as the application can send them.',
[
sec('Header and behavior',
 table(['Field','Size'],[['Source Port','16 bits'],['Destination Port','16 bits'],['Length','16 bits'],['Checksum','16 bits (optional in IPv4, mandatory in IPv6)']])+
 `<p>UDP is <strong>connectionless</strong>: no setup, no state kept between datagrams, no delivery guarantee. That minimalism is a feature, not a gap &mdash; it hands full control of reliability and pacing to the application, which is exactly what latency-sensitive or custom-reliability workloads want.</p>`),
sec('Where it wins',
 `<ul><li><strong>DNS</strong> &mdash; single request/response, cheap to just retry</li><li><strong>DHCP</strong> &mdash; broadcast-based bootstrap, before a TCP stack could even be configured</li><li><strong>VoIP / streaming</strong> &mdash; a late packet is worse than a dropped one</li><li><strong>Gaming</strong> &mdash; the newest state matters more than a guaranteed-delivered old one</li><li><strong>QUIC</strong> &mdash; deliberately builds its own reliability atop UDP to escape kernel/middlebox ossification around TCP</li></ul>`)
]);

reg('tcp','22','TCP',
'TCP turns IP\'s best-effort chaos into an ordered, reliable, congestion-aware byte stream &mdash; the single protocol responsible for most of the Internet\'s actual data delivery.',
[
sec('Header essentials',
 table(['Field','Purpose'],[
  ['Sequence number','Byte-stream position of this segment\'s first byte'],
  ['Acknowledgment number','Next byte the receiver expects'],
  ['Flags (SYN/ACK/FIN/RST/PSH/URG)','Control connection state and signal intent'],
  ['Window','Receiver\'s current flow-control advertisement'],
  ['Options','MSS, window scaling, SACK, timestamps, etc.'],
 ])),
sec('MSS vs. MTU — a very commonly confused pair',
 table(['Term','Full name','What it actually bounds'],[
  ['MTU','Maximum Transmission Unit','The biggest IP packet a given link can carry without fragmentation (≈1500 bytes on typical Ethernet)'],
  ['MSS','Maximum Segment Size','The biggest chunk of TCP <em>payload</em> in one segment — MTU minus the IP and TCP headers'],
 ])+
 hdiag('mssmtu','FIG. — WHERE MSS COMES FROM','Start from the link\'s MTU, subtract the IP header, subtract the TCP header — whatever survives is the MSS.')+
 fmla('MSS = MTU &minus; IP header &minus; TCP header  =  1500 &minus; 20 &minus; 20  =  1460 bytes (typical IPv4/Ethernet)')+
 `<p>Over IPv6\'s larger 40-byte minimum header, the same Ethernet MTU instead yields <code>1500 − 40 − 20 = 1440</code> bytes. TCP options (timestamps, SACK) shrink the usable header space further, trimming the effective MSS a little more.</p>`),
sec('Connection lifecycle',
 flow(['SYN &mdash; client proposes a connection with initial sequence number','SYN-ACK &mdash; server acknowledges and proposes its own','ACK &mdash; client acknowledges; connection established'])+
 hdiag('handshake3way','FIG. — THE THREE-WAY HANDSHAKE','Both directions must prove they work before either side trusts the connection with real data.')+
 flow(['FIN &mdash; sender signals it has no more data','ACK &mdash; receiver acknowledges','FIN &mdash; receiver, when ready, signals the same','ACK &mdash; final acknowledgment; connection closed'])+
 `<p>The 3-way handshake exists to synchronize both sides\' starting sequence numbers and confirm both directions work before any data is trusted to flow.</p>`),
sec('Reliability',
 `<p>Every byte is numbered; the receiver acknowledges cumulatively. A missing <strong>ACK</strong> before a computed <strong>RTO</strong> (Retransmission Timeout, derived from measured RTT and its variance) triggers retransmission. <strong>Fast retransmit</strong> reacts faster: three <strong>duplicate ACKs</strong> for the same byte are treated as strong evidence of loss, without waiting for the full timeout.</p>`),
sec('Flow control vs congestion control',
 `<p><strong>Flow control</strong> protects the <em>receiver</em> &mdash; the advertised <strong>window</strong> says "don't send more than my buffer can hold." <strong>Congestion control</strong> protects the <em>network</em> &mdash; the sender's own <strong>cwnd</strong> (congestion window) caps how much unacknowledged data it will risk in flight, inferred from loss or delay signals since the sender can't see the network's queues directly. The amount actually sent is always <code>min(cwnd, rwnd)</code>.</p>`),
sec('Slow start, AIMD, and TCP variants',
 table(['Phase / algorithm','Behavior'],[
  ['Slow start','cwnd doubles every RTT until a threshold (ssthresh) or loss'],
  ['Congestion avoidance (AIMD)','cwnd grows by ~1 segment/RTT (Additive Increase); halves on loss (Multiplicative Decrease)'],
  ['Fast recovery','After fast retransmit, halve cwnd rather than collapsing all the way to slow start'],
 ])+
 table(['Variant','Signal used','Note'],[
  ['Tahoe','Loss','Original, always restarts slow start on loss'],
  ['Reno','Loss','Adds fast recovery'],
  ['New Reno','Loss','Handles multiple losses in one window better'],
  ['CUBIC','Loss, cubic growth function','Linux default for years; scales well to high-BDP links'],
  ['BBR','Estimated bottleneck bandwidth + RTT, not loss','Google\'s model-based algorithm; avoids treating shallow-buffer loss as congestion'],
 ])+
 callout('','FAIRNESS','AIMD converges toward roughly equal bandwidth share between competing flows over time (a property proven via a simple phase-plot argument) &mdash; one reason congestion control is standardized rather than left to each implementation to optimize selfishly.')),
sec('Live congestion-window simulator',
 '<div id="tool-tcpsim"></div>')
], {tool:'tcpsim'});

reg('quic','23','QUIC & Modern Transport',
'QUIC rebuilds transport on top of UDP specifically to escape decades of ossification around TCP in middleboxes and OS kernels &mdash; and to fix head-of-line blocking for good.',
[
sec('Why QUIC exists',
 `<p>TCP is implemented in operating-system kernels and assumed, hard-coded, by countless middleboxes &mdash; deploying real improvements to TCP itself takes a decade or more. QUIC sidesteps this by running in <strong>user space over UDP</strong>, so browsers and servers can iterate transport logic at software-release speed, not OS-upgrade speed.</p>`),
sec('What QUIC folds together',
 `<ul>
   <li><strong>Integrated TLS 1.3</strong> &mdash; encryption isn\'t a layer bolted on top; the handshake and transport setup happen together, enabling <strong>0-RTT</strong> resumption for known peers.</li>
   <li><strong>Independent streams</strong> &mdash; multiple logical streams multiplex over one connection, and loss on one stream no longer blocks the others (the specific problem HTTP/2-over-TCP still has).</li>
   <li><strong>Connection IDs, not IP:port</strong> &mdash; a connection survives a client\'s network change (Wi-Fi &rarr; cellular) via <strong>connection migration</strong>, something TCP\'s 4-tuple identity can\'t do.</li>
   <li><strong>Built-in loss recovery & congestion control</strong> &mdash; pluggable in software, same as TCP\'s but easier to evolve.</li>
 </ul>`),
sec('TCP+TLS+HTTP/2 vs QUIC+HTTP/3',
 table(['','TCP + TLS + HTTP/2','QUIC + HTTP/3'],[
  ['Handshake RTTs (fresh)','~2&ndash;3 (TCP + TLS)','~1 (combined)'],
  ['Head-of-line blocking','Yes, at the TCP layer, across all streams','No, per-stream only'],
  ['Connection migration','No &mdash; tied to IP:port','Yes &mdash; via connection ID'],
  ['Deployability','Kernel-level, slow to evolve','User-space, fast to evolve'],
 ])),
sec('Connection migration, worked example',
 `<p>A phone streaming video over Wi-Fi walks out of range and switches to 5G. A TCP-based stream is identified by its 4-tuple (source IP, source port, destination IP, destination port) &mdash; the moment the phone\'s IP address changes, that identity breaks, and the app has to open a brand-new TCP connection (and usually re-buffer). QUIC identifies the connection by a <strong>connection ID</strong> instead of the network path, so the same logical QUIC connection can simply keep going over the new 5G path once the client confirms it still owns that connection ID &mdash; no visible restart, no fresh handshake, no re-buffering.</p>`)
]);

/* ===== GROUP V — APPLICATION ===== */
reg('applayer','24','Application Layer',
'Everything a person or program actually asked the network to do lives here: the meaning, not just the mechanics, of a request.',
[sec('Where the meaning lives',
 `<p>Below the application layer, every protocol just moves opaque bytes; the application layer defines what those bytes <em>mean</em> &mdash; a URL, an email, a DNS name. Architectures repeat the same choices as networking overall: <strong>client-server</strong> for most APIs and websites, <strong>peer-to-peer</strong> for some file-sharing and messaging systems, both ultimately implemented over <strong>sockets</strong> exposed by the OS and consumed through language/framework-level APIs.</p>`)]);

reg('dns','25','DNS',
'DNS turns memorable names into routable addresses for effectively every Internet interaction &mdash; a single global, distributed, heavily cached database with no single owner.',
[
sec('Hierarchy',
 `<p>Domain names read right-to-left in authority: the <strong>root</strong> (unnamed, represented by a trailing dot), then a <strong>TLD</strong> (<code>.com</code>, <code>.org</code>, country codes), then the organization\'s <strong>authoritative</strong> zone. A <strong>recursive resolver</strong> (often run by an ISP or a public service) does the legwork on a client\'s behalf, walking the hierarchy and <strong>caching</strong> results for their <strong>TTL</strong> to spare the authoritative servers repeat work.</p>`+
 flow(['Browser (stub resolver)','Recursive resolver','Root server','TLD server','Authoritative server','&larr; IP address returned back up the chain'])),
sec('Record types',
 table(['Record','Maps to'],[
  ['A','IPv4 address'],['AAAA','IPv6 address'],['CNAME','Another domain name (alias)'],
  ['MX','Mail server, with priority'],['NS','Authoritative name servers for a zone'],
  ['TXT','Free-form text (SPF/DKIM, verification)'],['SOA','Zone authority + refresh/retry/expire timers'],
  ['PTR','Reverse lookup: IP &rarr; name'],['SRV','Service location: host + port for a named service'],['CAA','Which CAs may issue certificates for this domain'],
 ])),
sec('Security & scale',
 `<p><strong>DNS cache poisoning</strong> and <strong>spoofing</strong> inject false records into a resolver\'s cache; <strong>DNSSEC</strong> cryptographically signs records so resolvers can verify authenticity. <strong>DoH</strong> (DNS over HTTPS) and <strong>DoT</strong> (DNS over TLS) encrypt the resolver&harr;client leg, closing off on-path eavesdropping and tampering. At scale, <strong>Anycast DNS</strong> lets the same IP be announced from many global sites so a query is answered by the topologically nearest instance, and <strong>GeoDNS</strong> returns different answers by requester location for load distribution.</p>`),
sec('Interactive resolution simulator',
 '<div id="tool-dnssim"></div>')
], {tool:'dnssim'});

reg('http','26','HTTP',
'HTTP evolved from a single-line document-fetch protocol into the application substrate for nearly everything &mdash; APIs, streaming, real-time apps &mdash; without abandoning its original request/response shape.',
[
sec('Version evolution',
 table(['Version','Key idea'],[
  ['0.9','GET only, no headers, plain HTML response'],
  ['1.0','Headers, status codes, more methods, one request per connection'],
  ['1.1','Persistent connections, chunked transfer, Host header (virtual hosting)'],
  ['2','Binary framing, header compression, multiplexed streams over one TCP connection'],
  ['3','Same semantics as HTTP/2, over QUIC &mdash; fixes TCP-level head-of-line blocking'],
 ])),
sec('HTTP/0.9 — the one-line protocol',
 `<p>The original Web protocol supported only <code>GET</code>, returned raw HTML with no headers, no status code, and no content type at all &mdash; the server just sent the document and closed the connection. It was enough for a network of plain hyperlinked documents, and nothing more; the moment the Web needed images, different file types, and error handling, HTTP/0.9 had no way to express any of it.</p>`),
sec('HTTP/1.0 — headers and status codes, at the cost of a connection per resource (RFC 1945)',
 `<p>HTTP/1.0 added the version string, status codes (<code>200 OK</code>, <code>404 Not Found</code>), headers (<code>Content-Type</code>, <code>Content-Length</code>), and support for arbitrary content types &mdash; but it normally opened one brand-new TCP connection per request and closed it immediately after. A page with an HTML file, a stylesheet, a script, and two images meant <strong>five separate TCP handshakes</strong>, each paying its own connection-setup latency before a single byte of that resource could move.</p>`),
sec('HTTP/1.1 — persistent connections, and the pipelining dead end (RFC 9112)',
 `<p>HTTP/1.1 (1997, current spec RFC 9112) made <strong>persistent connections</strong> the default: one TCP connection now serves many sequential requests, each just adding a <code>Host</code> header, chunked transfer encoding, and richer caching/content-negotiation on top. HTTP/1.1 also defined <strong>pipelining</strong> &mdash; sending several requests without waiting for each response &mdash; but responses still had to come back in the exact order requested, so one slow response head-of-line-blocked every response queued behind it. Pipelining\'s implementation and ordering problems meant it never saw wide real-world adoption; browsers worked around the limitation instead by opening several parallel TCP connections to the same origin.</p>`),
sec('HTTP/2 — binary framing, multiplexing, and HPACK (RFC 9113, 2015)',
 `<p>HTTP/2 replaced the plain-text request/response format with <strong>binary frames</strong>, and let many logical <strong>streams</strong> (HTML, CSS, JS, images) interleave over <em>one</em> TCP connection instead of needing separate connections for parallelism. Repeated, largely-identical headers (cookies, user-agent, auth tokens) across many requests were the other big source of waste; <strong>HPACK</strong> header compression sends full headers once and compact references afterward.</p>`+
 callout('warn','THE LIMITATION THAT MOTIVATED HTTP/3','HTTP/2 genuinely eliminates HTTP/1.1\'s <em>application-level</em> serialization problem — but it still runs over one TCP connection, and TCP delivers one strictly ordered byte stream. If a single TCP packet is lost, <strong>every</strong> HTTP/2 stream sharing that connection stalls until it\'s retransmitted, even streams whose own data arrived perfectly fine. This transport-level head-of-line blocking, invisible to HTTP/2 itself, is the direct reason QUIC and HTTP/3 exist.')),
sec('HTTP/3 — moving the fix into the transport layer (RFC 9114)',
 `<p>HTTP/3 keeps HTTP/2\'s semantics but swaps the transport underneath: instead of TCP, it rides on <strong>QUIC over UDP</strong>. Because QUIC gives every stream independent, per-stream loss recovery, a lost packet on one stream no longer stalls the others — the exact transport-level HOL blocking HTTP/2 couldn\'t escape. QUIC also folds the TLS 1.3 handshake into connection setup itself, so a fresh HTTP/3 connection typically reaches encrypted application data in about 1 round trip (0-RTT is possible for resumed connections, with its own replay-related security tradeoffs).</p>`),
sec('Methods and status codes',
 `<p>Methods: <code>GET POST PUT PATCH DELETE HEAD OPTIONS CONNECT TRACE</code>. Status classes: <strong>1xx</strong> informational, <strong>2xx</strong> success, <strong>3xx</strong> redirection, <strong>4xx</strong> client error, <strong>5xx</strong> server error.</p>`),
sec('Caching and state',
 `<p><strong>Cookies</strong> and server-side <strong>sessions</strong> add state to an otherwise stateless protocol. <strong>Cache-Control</strong> headers govern how long a response may be reused; <strong>ETag</strong> plus a <strong>conditional GET</strong> (<code>If-None-Match</code>) lets a client revalidate cheaply, receiving a tiny <strong>304 Not Modified</strong> instead of re-downloading unchanged content. <strong>Reverse proxies</strong> sit in front of origin servers to cache, load-balance, and terminate TLS on their behalf.</p>`),
sec('Interactive request builder',
 '<div id="tool-httpsim"></div>')
], {tool:'httpsim'});

 ${hdiag('hiddennode','FIG. — THE HIDDEN NODE PROBLEM','A and C both reach the access point but not each other — carrier sense alone cannot prevent their collision at B.')}`),

 ])+

reg('dcnet','41','Data Center Networking',

 </p>${hdiag('spineleaf','FIG. — SPINE-LEAF (CLOS) FABRIC','Every leaf connects to every spine — no leaf-to-leaf shortcut is needed, and no single spine failure isolates any rack.')}<p> <strong>East-west traffic</strong> (server-to-server, now the majority of data center traffic) is what this design optimizes for, versus <strong>north-south traffic</strong> (client-to-server, in/out of the data center). <strong>ECMP</strong> (Equal-Cost Multi-Path) spreads flows across all available spine paths in parallel, and <strong>oversubscription</strong> ratios describe, deliberately, how much less uplink capacity exists than the sum of downlink capacity &mdash; a cost/performance trade-off, not an oversight.</p>`),
