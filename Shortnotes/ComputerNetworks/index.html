<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mode="engineer">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETLAB &mdash; Computer Networks Learning Platform</title>
<meta name="description" content="An interactive, enterprise-grade Computer Networks learning platform: theory, packet visualizers, simulators, labs, and interview prep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NETLAB — design tokens
   bg near-black cool navy, telemetry green signal accent,
   amber for warnings/routes, mono-first "router CLI" identity.
   ============================================================ */
:root{
  --bg:            #0A0E12;
  --bg-raised:     #0D1218;
  --panel:         #10151C;
  --panel-2:       #141B23;
  --border:        #1E2830;
  --border-soft:   #171F27;
  --text:          #E4EAEE;
  --text-dim:      #93A3AF;
  --text-faint:    #5C6B76;
  --signal:        #3DDC97;
  --signal-dim:    #1F6B4D;
  --signal-glow:   rgba(61,220,151,.18);
  --amber:         #F5B942;
  --danger:        #FF6B6B;
  --violet:        #8B93F8;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  --radius: 3px;
  --radius-lg: 6px;
  --shell-w: 280px;
  --panel-w: 340px;
  --header-h: 56px;
}
html[data-theme="light"]{
  --bg:            #F3F5F3;
  --bg-raised:     #FFFFFF;
  --panel:         #FFFFFF;
  --panel-2:       #ECEFEC;
  --border:        #D7DEDA;
  --border-soft:   #E4E9E5;
  --text:          #131A17;
  --text-dim:      #4A5A54;
  --text-faint:    #8B9C94;
  --signal:        #0E9F6A;
  --signal-dim:    #BFE9D5;
  --signal-glow:   rgba(14,159,106,.12);
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--border-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size:34px 34px;
  background-attachment:fixed;
}
html[data-theme="light"] body{ background-image:
    linear-gradient(var(--border-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
}
::selection{ background:var(--signal); color:#00160E; }
a{ color:inherit; }
button{ font-family:inherit; }
code, .mono{ font-family:var(--mono); }
h1,h2,h3,h4{ font-family:var(--mono); font-weight:700; letter-spacing:-.01em; margin:0; }
p{ margin:0 0 12px; color:var(--text-dim); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }
:focus-visible{ outline:2px solid var(--signal); outline-offset:2px; border-radius:2px; }

/* ---------- utility eyebrow / labels ---------- */
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--signal); display:flex; align-items:center; gap:8px; margin-bottom:10px; font-weight:600;
}
.eyebrow::before{ content:''; width:14px; height:1px; background:var(--signal); display:inline-block; }
.tag{
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  padding:2px 7px; border:1px solid var(--border); border-radius:2px; color:var(--text-dim);
  white-space:nowrap;
}
.tag.on{ color:var(--signal); border-color:var(--signal-dim); background:var(--signal-glow); }
.tag.warn{ color:var(--amber); border-color:#6b551f; background:rgba(245,185,66,.1); }
.tag.danger{ color:var(--danger); border-color:#6b2323; background:rgba(255,107,107,.1); }
.tag.violet{ color:var(--violet); border-color:#3d3f7a; background:rgba(139,147,248,.1); }

/* ============================================================
   APP SHELL
   ============================================================ */
#app{ display:flex; min-height:100vh; }

/* ---------- header ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; height:var(--header-h); z-index:200;
  display:flex; align-items:center; gap:16px; padding:0 16px;
  background:rgba(10,14,18,.86); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
html[data-theme="light"] .topbar{ background:rgba(243,245,243,.86); }
.brand{ display:flex; align-items:center; gap:9px; font-family:var(--mono); font-weight:800; font-size:15px; letter-spacing:.02em; flex-shrink:0; }
.brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--signal); box-shadow:0 0 10px var(--signal-glow), 0 0 0 3px var(--signal-glow); flex-shrink:0; }
.brand small{ color:var(--text-faint); font-weight:500; font-size:11px; }
.topbar-search{
  flex:1; max-width:460px; display:flex; align-items:center; gap:8px;
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:7px 10px; color:var(--text-faint); font-family:var(--mono); font-size:12.5px; cursor:pointer;
}
.topbar-search:hover{ border-color:var(--text-faint); }
.topbar-search kbd{
  margin-left:auto; font-family:var(--mono); font-size:10px; border:1px solid var(--border);
  border-radius:3px; padding:1px 5px; color:var(--text-faint); background:var(--bg-raised);
}
.topbar-actions{ display:flex; align-items:center; gap:6px; margin-left:auto; }
.icon-btn{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid transparent; border-radius:var(--radius); color:var(--text-dim);
  cursor:pointer; position:relative;
}
.icon-btn:hover{ background:var(--panel); border-color:var(--border); color:var(--text); }
.icon-btn svg{ width:17px; height:17px; }
.icon-btn .count{
  position:absolute; top:2px; right:2px; background:var(--signal); color:#00160E;
  font-family:var(--mono); font-size:9px; font-weight:800; border-radius:8px; padding:0 4px; line-height:14px; min-width:14px; text-align:center;
}
.mode-switch{
  display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; font-family:var(--mono); font-size:11px;
}
.mode-switch button{ background:var(--panel); color:var(--text-faint); border:none; padding:7px 10px; cursor:pointer; border-right:1px solid var(--border); }
.mode-switch button:last-child{ border-right:none; }
.mode-switch button.active{ background:var(--signal-glow); color:var(--signal); }

/* ---------- sidebar ---------- */
.sidebar{
  position:fixed; top:var(--header-h); left:0; bottom:0; width:var(--shell-w); z-index:150;
  background:var(--bg-raised); border-right:1px solid var(--border);
  overflow-y:auto; padding:14px 10px 40px;
  transition:transform .2s ease;
}
.sidebar-progress{
  padding:10px 8px 14px; margin-bottom:8px; border-bottom:1px solid var(--border-soft);
}
.sidebar-progress .pct-row{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:6px; }
.pbar{ height:5px; background:var(--panel-2); border-radius:3px; overflow:hidden; }
.pbar > span{ display:block; height:100%; background:linear-gradient(90deg,var(--signal-dim),var(--signal)); border-radius:3px; transition:width .4s; }
.sb-search{ width:100%; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-family:var(--mono); font-size:12px; padding:7px 8px; margin-bottom:10px; }
.sb-group{ margin-bottom:2px; }
.sb-group-head{
  display:flex; align-items:center; gap:6px; padding:8px 7px 4px; font-family:var(--mono);
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); cursor:pointer; user-select:none;
}
.sb-group-head svg{ width:10px; height:10px; transition:transform .15s; flex-shrink:0; }
.sb-group.collapsed .sb-group-head svg{ transform:rotate(-90deg); }
.sb-group.collapsed .sb-items{ display:none; }
.sb-item{
  display:flex; align-items:center; gap:8px; padding:6px 8px 6px 22px; border-radius:var(--radius);
  color:var(--text-dim); font-size:13px; cursor:pointer; border-left:2px solid transparent; margin:1px 0;
}
.sb-item:hover{ background:var(--panel); color:var(--text); }
.sb-item.active{ background:var(--signal-glow); color:var(--signal); border-left-color:var(--signal); font-weight:600; }
.sb-item .num{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); width:18px; flex-shrink:0; }
.sb-item.active .num{ color:var(--signal); }
.sb-item .chk{ margin-left:auto; width:13px; height:13px; flex-shrink:0; opacity:.0; }
.sb-item.done .chk{ opacity:1; color:var(--signal); }
.sb-item .bmk{ margin-left:4px; width:11px; height:11px; flex-shrink:0; color:var(--amber); opacity:0; }
.sb-item.bookmarked .bmk{ opacity:1; }

/* ---------- main content ---------- */
.main{
  margin-left:var(--shell-w); margin-top:var(--header-h); flex:1; min-width:0;
  padding:34px 40px 100px; max-width:980px;
}
.right-rail{
  position:fixed; top:var(--header-h); right:0; bottom:0; width:var(--panel-w);
  border-left:1px solid var(--border); background:var(--bg-raised); overflow-y:auto; padding:18px;
  transform:translateX(100%); transition:transform .2s ease; z-index:140;
}
.right-rail.open{ transform:translateX(0); }
.rail-close{ float:right; }

/* ---------- mobile drawer / bottom nav ---------- */
.hamburger{ display:none; }
@media (max-width:1100px){
  .sidebar{ transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.5); }
  .sidebar.open{ transform:translateX(0); }
  .main{ margin-left:0; padding:24px 16px 90px; }
  .hamburger{ display:flex; }
  .brand small{ display:none; }
  .topbar-search{ max-width:none; }
  .right-rail{ width:100%; }
}
.scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:145; }
.scrim.show{ display:block; }

/* ============================================================
   COMPONENTS
   ============================================================ */
.panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); }
.card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px; }
.card:hover{ border-color:var(--text-faint); }
.grid{ display:grid; gap:14px; }
.grid.cols-2{ grid-template-columns:1fr 1fr; }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:900px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr 1fr; } }
@media (max-width:640px){ .grid.cols-2,.grid.cols-3,.grid.cols-4{ grid-template-columns:1fr; } }

/* buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12.5px; font-weight:600;
  padding:9px 14px; border-radius:var(--radius); border:1px solid var(--border); background:var(--panel-2);
  color:var(--text); cursor:pointer; letter-spacing:.01em;
}
.btn:hover{ border-color:var(--text-faint); }
.btn.primary{ background:var(--signal); color:#00160E; border-color:var(--signal); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; }
.btn.sm{ padding:6px 10px; font-size:11.5px; }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }

/* stat tiles */
.stat{ padding:14px; }
.stat .v{ font-family:var(--mono); font-size:26px; font-weight:800; color:var(--text); }
.stat .l{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-top:4px; }
.stat .v.signal{ color:var(--signal); }

/* dashboard hero / packet stream */
.hero{
  border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; margin-bottom:22px;
  position:relative; overflow:hidden; background:linear-gradient(180deg,var(--panel),var(--bg-raised));
}
.hero h1{ font-size:26px; margin-bottom:8px; }
.hero p{ max-width:560px; }
.stream{ position:relative; height:64px; margin-top:18px; border-top:1px dashed var(--border-soft); }
.stream svg{ width:100%; height:100%; display:block; }
.node-dot{ fill:var(--panel-2); stroke:var(--border); stroke-width:1.5; }
.hop-line{ stroke:var(--border); stroke-width:1; stroke-dasharray:3 4; }
.pkt{ font-family:var(--mono); font-size:9px; font-weight:700; fill:#00160E; }
.pkt-box{ fill:var(--signal); }
.pkt-box.alt{ fill:var(--amber); }

/* learning path */
.path{ display:flex; flex-direction:column; gap:0; }
.path-step{ display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:var(--radius); }
.path-step:hover{ background:var(--panel); }
.path-step .n{ font-family:var(--mono); color:var(--signal); font-size:11px; width:20px; }
.path-arrow{ color:var(--text-faint); font-family:var(--mono); font-size:11px; padding-left:32px; }

/* chapter content typography */
.crumbs{ font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-bottom:10px; display:flex; gap:6px; align-items:center; }
.chapter-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.chapter-head h1{ font-size:28px; line-height:1.2; }
.chapter-actions{ display:flex; gap:6px; flex-shrink:0; }
.lede{ font-size:16px; color:var(--text-dim); max-width:680px; margin-bottom:20px; }
.content h2{ font-size:18px; margin:32px 0 12px; padding-top:14px; border-top:1px solid var(--border-soft); display:flex; align-items:center; gap:10px;}
.content h2 .hn{ font-family:var(--mono); color:var(--signal); font-size:13px; }
.content h3{ font-size:14.5px; margin:18px 0 8px; color:var(--text); }
.content ul, .content ol{ margin:0 0 14px; padding-left:20px; color:var(--text-dim); }
.content li{ margin-bottom:5px; }
.content strong{ color:var(--text); font-weight:600; }
.content table{ width:100%; border-collapse:collapse; margin:10px 0 18px; font-size:13px; }
.content th,.content td{ text-align:left; padding:7px 10px; border:1px solid var(--border); }
.content th{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); background:var(--panel); }
.content td{ color:var(--text-dim); }
.content code{ background:var(--panel-2); border:1px solid var(--border); padding:1px 5px; border-radius:3px; font-size:12.5px; color:var(--signal); }
pre.code{
  background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;
  overflow-x:auto; font-family:var(--mono); font-size:12.5px; line-height:1.6; margin:0 0 16px; color:var(--text-dim);
}
pre.code .c1{ color:var(--signal); }
pre.code .c2{ color:var(--amber); }
.callout{ border:1px solid var(--border); border-left:3px solid var(--signal); border-radius:var(--radius); padding:12px 14px; margin:0 0 16px; background:var(--panel); }
.callout.warn{ border-left-color:var(--amber); }
.callout.danger{ border-left-color:var(--danger); }
.callout .lbl{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--signal); margin-bottom:5px; display:block; }
.callout.warn .lbl{ color:var(--amber); }
.callout.danger .lbl{ color:var(--danger); }
.formula{ font-family:var(--mono); background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; text-align:center; font-size:14px; color:var(--signal); margin:0 0 16px; }

/* diagram flow (vertical arrows) */
.flow{ display:flex; flex-direction:column; align-items:flex-start; gap:0; margin:14px 0 20px; }
.flow .fstep{ font-family:var(--mono); font-size:12.5px; background:var(--panel); border:1px solid var(--border); padding:7px 12px; border-radius:var(--radius); }
.flow .farrow{ font-family:var(--mono); color:var(--text-faint); padding:2px 0 2px 16px; font-size:12px; }

/* status pills for research maturity */
.maturity{ display:inline-flex; gap:6px; flex-wrap:wrap; margin:6px 0 16px; }

/* accordion (interview / glossary / labs) */
.acc-item{ border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; overflow:hidden; }
.acc-head{ display:flex; justify-content:space-between; align-items:center; padding:11px 14px; cursor:pointer; background:var(--panel); }
.acc-head:hover{ background:var(--panel-2); }
.acc-head span.q{ font-size:13.5px; color:var(--text); font-weight:500; padding-right:12px;}
.acc-head svg{ flex-shrink:0; width:13px; height:13px; color:var(--text-faint); transition:transform .15s; }
.acc-item.open .acc-head svg{ transform:rotate(180deg); }
.acc-body{ display:none; padding:2px 14px 14px; font-size:13.5px; color:var(--text-dim); }
.acc-item.open .acc-body{ display:block; }

/* footer chapter nav */
.chap-nav{ display:flex; justify-content:space-between; gap:12px; margin-top:38px; padding-top:18px; border-top:1px solid var(--border-soft); }
.chap-nav a{ flex:1; border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; text-decoration:none; cursor:pointer; }
.chap-nav a:hover{ border-color:var(--text-faint); }
.chap-nav .d{ font-family:var(--mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
.chap-nav .t{ font-size:13.5px; margin-top:3px; color:var(--text); }
.chap-nav .next{ text-align:right; }

/* ============================================================
   TOOLS
   ============================================================ */
.tool{ border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; margin:16px 0 24px; background:var(--panel); }
.tool-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.tool-head .ic{ color:var(--signal); }
.tool-head h3{ font-size:14px; }
.field-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.field{ display:flex; flex-direction:column; gap:5px; flex:1; min-width:130px; }
.field label{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); }
.field input, .field select{
  background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius);
  color:var(--text); font-family:var(--mono); font-size:13px; padding:8px 10px;
}
.field input:focus, .field select:focus{ border-color:var(--signal); }
.out-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-top:10px; }
.out-cell{ background:var(--bg-raised); padding:10px 12px; }
.out-cell .k{ font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--text-faint); letter-spacing:.06em; }
.out-cell .v{ font-family:var(--mono); font-size:14px; color:var(--signal); margin-top:3px; word-break:break-all; }

/* packet header visualizer */
.pkthdr{ display:flex; flex-wrap:wrap; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.pkthdr .f{
  border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:9px 10px; cursor:pointer;
  font-family:var(--mono); font-size:11px; color:var(--text-dim); background:var(--bg-raised); flex-grow:1; text-align:center;
}
.pkthdr .f:hover, .pkthdr .f.sel{ background:var(--signal-glow); color:var(--signal); }
.pkthdr .f .sz{ display:block; font-size:9px; color:var(--text-faint); margin-top:2px; }
.pkthdr .f.sel .sz{ color:var(--signal-dim); }
.field-detail{ margin-top:12px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-raised); min-height:70px; }
.field-detail .fn{ font-family:var(--mono); color:var(--signal); font-size:13px; margin-bottom:4px; }
.proto-tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.proto-tabs button{ font-family:var(--mono); font-size:11.5px; padding:6px 11px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg-raised); color:var(--text-dim); cursor:pointer; }
.proto-tabs button.active{ background:var(--signal-glow); color:var(--signal); border-color:var(--signal-dim); }

/* stack layers viz */
.stackviz{ display:flex; flex-direction:column; gap:6px; margin:14px 0; }
.stackviz .layer{ display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-raised); font-family:var(--mono); font-size:12px; }
.stackviz .layer b{ color:var(--signal); min-width:110px; }
.stackviz .arrow-down{ align-self:center; color:var(--text-faint); font-size:12px; }

/* wireshark-style packet table */
.pkt-table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11.5px; }
.pkt-table th{ text-align:left; padding:6px 8px; background:var(--panel-2); border-bottom:1px solid var(--border); color:var(--text-faint); font-weight:600; position:sticky; top:0; }
.pkt-table td{ padding:6px 8px; border-bottom:1px solid var(--border-soft); color:var(--text-dim); cursor:pointer; white-space:nowrap; }
.pkt-table tr:hover td{ background:var(--panel); color:var(--text); }
.pkt-table tr.sel td{ background:var(--signal-glow); color:var(--signal); }
.pkt-table-wrap{ max-height:260px; overflow:auto; border:1px solid var(--border); border-radius:var(--radius); }
.pkt-decode{ margin-top:10px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-raised); font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:var(--text-dim); }
.pkt-decode .lyr{ color:var(--signal); }

/* subnet lab / quiz feedback */
.correct{ color:var(--signal); } .incorrect{ color:var(--danger); }
.quiz-opt{ display:block; width:100%; text-align:left; padding:10px 13px; margin-bottom:7px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-raised); color:var(--text); cursor:pointer; font-size:13.5px; }
.quiz-opt:hover{ border-color:var(--text-faint); }
.quiz-opt.right{ border-color:var(--signal); background:var(--signal-glow); color:var(--signal); }
.quiz-opt.wrong{ border-color:var(--danger); background:rgba(255,107,107,.08); color:var(--danger); }
.quiz-opt[disabled]{ cursor:default; }
.quiz-meta{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; color:var(--text-faint); margin-bottom:10px; }

/* routing / topology canvas */
canvas{ display:block; width:100%; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-raised); }
.sim-controls{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
.sim-log{ font-family:var(--mono); font-size:11.5px; color:var(--text-dim); background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; max-height:150px; overflow-y:auto; margin-top:10px; }
.sim-log div{ margin-bottom:3px; }
.sim-log .t{ color:var(--text-faint); margin-right:6px; }

/* compare table */
.compare-picker{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }

/* glossary */
.gloss-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.gloss-card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px 13px; background:var(--bg-raised); }
.gloss-card .term{ font-family:var(--mono); color:var(--signal); font-size:13px; margin-bottom:5px; font-weight:700; }
.gloss-card .def{ font-size:12.5px; color:var(--text-dim); margin-bottom:0; }
.gloss-card .meta{ margin-top:7px; }

/* toasts / notes side */
.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:400; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--panel); border:1px solid var(--signal-dim); color:var(--text); font-family:var(--mono); font-size:12.5px; padding:10px 14px; border-radius:var(--radius); box-shadow:0 8px 24px rgba(0,0,0,.4); }

/* modal / command palette */
.modal-backdrop{ position:fixed; inset:0; background:rgba(4,6,8,.7); backdrop-filter:blur(2px); z-index:500; display:none; align-items:flex-start; justify-content:center; padding-top:12vh; }
.modal-backdrop.show{ display:flex; }
.cmdk{ width:min(560px,92vw); background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden; }
.cmdk input{ width:100%; padding:15px 16px; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text); font-family:var(--mono); font-size:15px; }
.cmdk-list{ max-height:360px; overflow-y:auto; padding:6px; }
.cmdk-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius); cursor:pointer; color:var(--text-dim); font-size:13.5px; }
.cmdk-item .k{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--text-faint); }
.cmdk-item.sel, .cmdk-item:hover{ background:var(--signal-glow); color:var(--signal); }
.cmdk-sec{ font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--text-faint); padding:8px 10px 4px; }

.notes-list textarea{
  width:100%; min-height:70px; background:var(--bg-raised); border:1px solid var(--border); color:var(--text);
  font-family:var(--sans); font-size:13px; border-radius:var(--radius); padding:9px; resize:vertical; margin-bottom:8px;
}
.note-card{ border:1px solid var(--border); border-radius:var(--radius); padding:10px 11px; margin-bottom:9px; background:var(--bg-raised); }
.note-card .meta{ font-family:var(--mono); font-size:10px; color:var(--text-faint); display:flex; justify-content:space-between; margin-bottom:5px; }
.note-card p{ font-size:12.5px; margin:0; color:var(--text-dim); }

/* floating dock */
.dock{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:190; }
.dock button{ width:42px; height:42px; border-radius:50%; background:var(--panel); border:1px solid var(--border); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.35); }
.dock button:hover{ color:var(--signal); border-color:var(--signal-dim); }
.dock svg{ width:18px; height:18px; }

.skip-link{ position:absolute; left:-999px; top:0; background:var(--signal); color:#00160E; padding:10px 14px; z-index:999; font-family:var(--mono); }
.skip-link:focus{ left:10px; top:10px; }

.arch-svg{ width:100%; height:auto; }
.arch-svg text{ font-family:var(--mono); font-size:10px; fill:var(--text-dim); }
.arch-svg .box{ fill:var(--bg-raised); stroke:var(--border); }
.arch-svg .box.acc{ stroke:var(--signal); }
.arch-svg line, .arch-svg path.link{ stroke:var(--border); stroke-width:1.3; fill:none; }

/* ---------- history timeline ---------- */
.timeline{ position:relative; margin:14px 0 20px; padding-left:22px; border-left:1px solid var(--border); }
.timeline .tl-item{ position:relative; padding-bottom:18px; }
.timeline .tl-item::before{ content:''; position:absolute; left:-27px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--bg-raised); border:2px solid var(--signal); }
.timeline .tl-date{ font-family:var(--mono); font-size:11px; color:var(--signal); letter-spacing:.04em; margin-bottom:2px; }
.timeline .tl-title{ color:var(--text); font-weight:600; font-size:13.5px; margin-bottom:2px; }
.timeline .tl-body{ font-size:13px; color:var(--text-dim); }
.mythfact{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin:0 0 16px; }
.mythfact > div{ background:var(--bg-raised); padding:11px 13px; }
.mythfact .lbl{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:5px; }
.mythfact .myth .lbl{ color:var(--danger); }
.mythfact .fact .lbl{ color:var(--signal); }
.mythfact p{ font-size:12.5px; margin:0; color:var(--text-dim); }
@media (max-width:640px){ .mythfact{ grid-template-columns:1fr; } }
.quote-block{ border-left:3px solid var(--amber); padding:4px 0 4px 16px; margin:0 0 16px; font-style:italic; color:var(--text); font-size:14.5px; }

/* ---------- history diagrams ---------- */
.hdiag{ border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg-raised); padding:16px 16px 12px; margin:16px 0 20px; }
.hdiag svg{ width:100%; height:auto; display:block; }
.hdiag .hd-cap{ margin-top:10px; font-family:var(--mono); font-size:11px; color:var(--text-faint); text-align:center; letter-spacing:.02em; }
.hdiag .hd-title{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--signal); margin-bottom:10px; }
.hd-node-label{ font-family:'JetBrains Mono',monospace; font-size:9.5px; fill:var(--text); }
.hd-node-sub{ font-family:'JetBrains Mono',monospace; font-size:7.5px; fill:var(--text-faint); }
.hd-edge{ stroke:var(--border); stroke-width:1.3; fill:none; }
.hd-edge.on{ stroke:var(--signal); stroke-width:2; }
.hd-edge.bad{ stroke:var(--danger); stroke-width:1.3; stroke-dasharray:3 3; }
.hd-node-circle{ fill:var(--panel-2); stroke:var(--border); stroke-width:1.5; }
.hd-node-circle.signal{ fill:var(--signal); stroke:var(--signal); }
.hd-node-circle.dead{ fill:var(--bg-raised); stroke:var(--danger); stroke-dasharray:2 2; }
.hd-box{ fill:var(--panel-2); stroke:var(--border); stroke-width:1.3; }
.hd-box.acc{ stroke:var(--signal); }
.hd-dot-move{ fill:var(--signal); }
@keyframes hdPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
@keyframes hdBlink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
@keyframes hdDash{ to{ stroke-dashoffset:-24; } }
.hd-pulse{ animation:hdPulse 1.6s ease-in-out infinite; }
.hd-blink{ animation:hdBlink 1s steps(1) infinite; }
.hd-flow-line{ stroke-dasharray:5 5; animation:hdDash 1.2s linear infinite; }

/* ---------- router admin panel replica ---------- */
.routerui{
  --ru-teal:#2fb8ae; --ru-teal-dk:#249a91; --ru-yellow:#f5b400; --ru-ink:#33474a;
  --ru-sub:#5c7378; --ru-line:#e3eeee; --ru-bg:#ffffff;
  border-radius:8px; overflow:hidden; border:1px solid var(--border);
  font-family:var(--sans); color:var(--ru-ink); margin:16px 0 22px; background:var(--ru-bg);
}
.routerui *{ box-sizing:border-box; }
.ru-topbar{ background:var(--ru-teal); color:#fff; display:flex; align-items:center; gap:18px; padding:12px 18px; flex-wrap:wrap; }
.ru-brand{ font-weight:800; font-size:16px; display:flex; align-items:center; gap:6px; }
.ru-brand::before{ content:'📶'; }
.ru-tabs{ display:flex; gap:22px; margin-left:10px; }
.ru-tabs button{ background:none; border:none; color:rgba(255,255,255,.85); font-size:14px; padding:8px 4px; cursor:pointer; border-bottom:2px solid transparent; }
.ru-tabs button.active{ color:#fff; font-weight:700; border-bottom-color:#fff; }
.ru-actions{ margin-left:auto; display:flex; gap:16px; align-items:center; font-size:12.5px; color:#fff; }
.ru-body{ display:flex; min-height:420px; }
.ru-sidebar{ width:190px; background:var(--ru-teal); flex-shrink:0; padding:10px; display:flex; flex-direction:column; gap:6px; }
.ru-sidebar button{ text-align:left; background:rgba(255,255,255,.12); border:none; color:#fff; padding:11px 12px; border-radius:4px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; }
.ru-sidebar button.active{ background:var(--ru-yellow); color:#2b2200; font-weight:700; }
.ru-sidebar button:hover:not(.active){ background:rgba(255,255,255,.22); }
.ru-content{ flex:1; padding:22px 24px; background:#fff; overflow:auto; }
.ru-content h4{ font-family:var(--sans); font-size:17px; margin:0 0 4px; color:var(--ru-ink); }
.ru-content .ru-desc{ font-size:12.5px; color:var(--ru-sub); margin-bottom:16px; }
.ru-cards{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.ru-card{ border:1px solid var(--ru-line); border-radius:6px; overflow:hidden; }
.ru-card-head{ background:#f2f7f7; padding:10px 14px; font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:8px; color:var(--ru-ink); }
.ru-card-body{ padding:12px 14px; }
.ru-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:12.5px; border-bottom:1px dashed var(--ru-line); }
.ru-row:last-child{ border-bottom:none; }
.ru-row .k{ color:var(--ru-sub); }
.ru-row .v{ color:var(--ru-ink); font-weight:600; }
.ru-field{ margin-bottom:16px; max-width:460px; }
.ru-field label{ display:block; font-size:13px; margin-bottom:5px; color:var(--ru-ink); }
.ru-field input[type=text],.ru-field input[type=password]{ width:100%; border:1px solid #c9d6d6; border-radius:4px; padding:8px 10px; font-size:13px; color:var(--ru-ink); }
.ru-field .ru-check{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }
.ru-btn{ background:var(--ru-teal); color:#fff; border:none; padding:9px 22px; border-radius:4px; font-size:13px; cursor:pointer; }
.ru-toggle{ width:38px; height:20px; border-radius:20px; background:#ccd8d8; position:relative; display:inline-block; cursor:pointer; flex-shrink:0; }
.ru-toggle::after{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:#fff; top:2px; left:2px; box-shadow:0 1px 2px rgba(0,0,0,.3); }
.ru-toggle.on{ background:var(--ru-teal); }
.ru-toggle.on::after{ left:20px; }
.ru-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:16px; }
.ru-table th{ background:#f2f7f7; text-align:left; padding:8px 10px; color:var(--ru-sub); font-weight:600; border:1px solid var(--ru-line); }
.ru-table td{ padding:8px 10px; border:1px solid var(--ru-line); color:var(--ru-ink); }
.ru-note{ background:#f2f7f7; border-left:3px solid var(--ru-teal); padding:9px 12px; font-size:12px; color:var(--ru-sub); border-radius:0 4px 4px 0; }
@media (max-width:640px){ .ru-body{ flex-direction:column; } .ru-sidebar{ width:100%; flex-direction:row; overflow-x:auto; } .ru-cards{ grid-template-columns:1fr; } }
</style>

<header class="topbar">

    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

<script>
/* ============================================================
   NETLAB — application script
   Sections: 1) helpers  2) content data  3) tools  4) app/router
   ============================================================ */
'use strict';

/* ---------------- 1. small render helpers ---------------- */
const h = (s)=>s; // passthrough, content authored as HTML strings
function callout(type,label,text){ return `<div class="callout ${type||''}"><span class="lbl">${label}</span>${text}</div>`; }
function fmla(txt){ return `<div class="formula">${txt}</div>`; }
function flow(steps){ return `<div class="flow">${steps.map((s,i)=>`<div class="fstep">${s}</div>${i<steps.length-1?'<div class="farrow">&darr;</div>':''}`).join('')}</div>`; }
function table(headers,rows){
  return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function maturity(items){
  const cls={DEPLOYED:'on',STANDARDIZED:'on',EMERGING:'warn',RESEARCH:'violet',EXPERIMENTAL:'violet',SPECULATIVE:'danger'};
  return `<div class="maturity">${items.map(i=>`<span class="tag ${cls[i]||''}">${i}</span>`).join('')}</div>`;
}
function stack(layers){ return `<div class="stackviz">${layers.map(l=>`<div class="layer"><b>${l[0]}</b><span>${l[1]}</span></div>`).join('')}</div>`; }
function sec(title,body){ return {title,body}; }
function mythfact(myth,fact){ return `<div class="mythfact"><div class="myth"><span class="lbl">Popular myth</span><p>${myth}</p></div><div class="fact"><span class="lbl">Documented fact</span><p>${fact}</p></div></div>`; }
function tl(items){ return `<div class="timeline">${items.map(i=>`<div class="tl-item"><div class="tl-date">${i[0]}</div><div class="tl-title">${i[1]}</div>${i[2]?`<div class="tl-body">${i[2]}</div>`:''}</div>`).join('')}</div>`; }
function quote(t){ return `<div class="quote-block">${t}</div>`; }
function hdiag(key, title, caption){ return `<div class="hdiag"><div class="hd-title">${title}</div><div class="hist-diagram" data-diagram="${key}"></div>${caption?`<div class="hd-cap">${caption}</div>`:''}</div>`; }
function esc(s){ return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------- storage ---------------- */
const DB = {
  get(k,d){ try{ const v=localStorage.getItem('netlab:'+k); return v?JSON.parse(v):d; }catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('netlab:'+k, JSON.stringify(v)); }catch(e){} }
};
let STATE = {
  done: DB.get('done', {}),
  bookmarks: DB.get('bookmarks', {}),
  notes: DB.get('notes', []),
  quizStats: DB.get('quizStats', {attempts:0, correct:0, total:0, byTopic:{}}),
  theme: DB.get('theme','dark'),
  mode: DB.get('mode','engineer'),
  streak: DB.get('streak', {last:null,count:0}),
  labsDone: DB.get('labsDone', {}),
};
function saveState(){
  DB.set('done',STATE.done); DB.set('bookmarks',STATE.bookmarks); DB.set('notes',STATE.notes);
  DB.set('quizStats',STATE.quizStats); DB.set('theme',STATE.theme); DB.set('mode',STATE.mode);
  DB.set('streak',STATE.streak); DB.set('labsDone', STATE.labsDone);
}
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(STATE.streak.last===today) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  STATE.streak.count = (STATE.streak.last===y) ? STATE.streak.count+1 : 1;
  STATE.streak.last = today; saveState();
}
function toast(msg){
  const w=document.getElementById('toastWrap');
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  w.appendChild(t); setTimeout(()=>t.remove(),2600);
}

/* ---------------- 2. content data ---------------- */
const GROUPS = [

const CH = {};
function reg(id,num,title,lede,sections,opts){ CH[id] = Object.assign({id,num,title,lede,sections:sections||[]}, opts||{}); }

/* ===== GROUP I — FOUNDATIONS ===== */
reg('foundations','01','Computer Network Foundations',
'A computer network exists to let independent machines exchange data as if they shared memory. Everything else in this platform &mdash; routing, transport, security &mdash; is built to make that illusion reliable, fast, and safe.',
[
sec('What a network is, and why it exists',
 `<p>A <strong>computer network</strong> is a set of autonomous computing devices (<strong>hosts</strong> or <strong>end systems</strong>) connected by communication <strong>links</strong> so they can exchange data. Networks exist because centralizing every computation on one machine doesn't scale: it can't be everywhere a user is, can't survive a single failure, and can't be shared economically. Splitting work across many machines connected by a network solves all three &mdash; at the cost of needing agreed-upon rules (<strong>protocols</strong>) for how those machines talk.</p>`),
sec('Core components',
 `<p>Every network is built from a small vocabulary of parts:</p>
 <ul>
  <li><strong>Host / node / end system</strong> &mdash; a device that originates or terminates data (PC, phone, server, sensor).</li>
  <li><strong>NIC (Network Interface Card)</strong> &mdash; the hardware that puts bits on, and takes bits off, a physical medium.</li>
  <li><strong>Link</strong> &mdash; the physical or wireless medium connecting nodes (copper, fiber, radio).</li>
  <li><strong>Switch</strong> &mdash; forwards frames within one Layer-2 network based on MAC address.</li>
  <li><strong>Router</strong> &mdash; forwards packets between different networks based on IP address.</li>
  <li><strong>Hub</strong> &mdash; a legacy Layer-1 repeater; floods every bit to every port (obsolete in production networks).</li>
  <li><strong>Bridge</strong> &mdash; a 2-port precursor to the switch, joining two LAN segments at Layer 2.</li>
  <li><strong>Gateway</strong> &mdash; any device that translates between two different protocol environments (e.g. a network's edge to the Internet).</li>
  <li><strong>Modem</strong> &mdash; modulates/demodulates digital data over an analog carrier (DSL, cable, fiber ONT).</li>
  <li><strong>Access Point</strong> &mdash; bridges wireless stations onto a wired LAN.</li>
  <li><strong>Firewall</strong> &mdash; enforces a security policy on traffic crossing a boundary.</li>
  <li><strong>Proxy / Load balancer / Controller</strong> &mdash; intermediate systems that terminate, redirect, or program traffic rather than just forwarding it.</li>
 </ul>`),
sec('Classifying networks by scale',
 table(['Type','Span','Typical example'],[
  ['PAN','A few meters','Bluetooth earbuds &harr; phone'],
  ['LAN','A building/floor','Office Ethernet + Wi-Fi'],
  ['WLAN','A building, wireless','Campus Wi-Fi'],
  ['CAN','A campus','University network joining buildings'],
  ['MAN','A city','Metro fiber ring'],
  ['WAN','Country/continent','MPLS backbone, the Internet itself'],
  ['SAN','A data center','Fibre Channel / iSCSI storage fabric'],
  ['VPN','Overlay, any span','Encrypted tunnel over the public Internet'],
 ])+
 `<p>Beyond span, networks are also classified by <strong>trust boundary</strong>: an <strong>intranet</strong> is private to an organization, an <strong>extranet</strong> selectively exposes part of that intranet to partners, and the <strong>Internet</strong> is the global, public interconnection of autonomous networks.</p>`),
sec('Architectures and communication models',
 `<p><strong>Client&ndash;server</strong> concentrates state and control on always-on servers that many clients contact; <strong>peer-to-peer</strong> spreads both role and load across equal participants; real systems are usually <strong>distributed</strong> combinations of both, ranging from fully <strong>centralized</strong> to <strong>decentralized</strong> to <strong>federated</strong> (independent domains that agree to interoperate, like email or the Fediverse).</p>
 <p>Delivery patterns describe how many receivers a sender targets:</p>`+
 table(['Pattern','Meaning','Example'],[
  ['Unicast','One sender &rarr; one receiver','A normal TCP connection'],
  ['Broadcast','One sender &rarr; all nodes on a segment','ARP request, DHCP discover'],
  ['Multicast','One sender &rarr; a subscribed group','IPTV, routing protocol updates'],
  ['Anycast','One address &rarr; nearest of many receivers','Root DNS servers, CDN edge entry'],
 ])+
 hdiag('commmodels','FIG. — DELIVERY PATTERNS','Four ways one sender can address the network — each trading reach for control.')),
sec('Duplex and topology',
 `<p><strong>Simplex</strong> flows one direction only (broadcast TV); <strong>half-duplex</strong> allows both directions but not at once (old Wi-Fi/walkie-talkie); <strong>full-duplex</strong> allows simultaneous send and receive, which is what switched Ethernet and modern links provide.</p>
 <p>Physical/logical <strong>topologies</strong> &mdash; bus, star, ring, mesh, tree, hybrid &mdash; describe how links connect nodes. Modern data centers overwhelmingly use <strong>spine-leaf</strong>, a special case of a <strong>Clos topology</strong>: every leaf switch connects to every spine switch, giving predictable latency and high bisection bandwidth with no single point of failure.</p>`),
sec('The metrics that describe network quality',
 table(['Metric','Definition'],[
  ['Bandwidth','Maximum theoretical data rate a link can carry (bits/sec)'],
  ['Throughput','Actual delivered rate, always &le; bandwidth'],
  ['Goodput','Useful application-level throughput, excluding headers/retransmits'],
  ['Latency / RTT','One-way delay, or round-trip time out and back'],
  ['Jitter','Variation in latency between packets'],
  ['Packet loss','Fraction of packets that never arrive'],
  ['Availability','Fraction of time a system is reachable and correct'],
  ['Utilization','Fraction of link capacity currently in use'],
  ['Congestion','Demand exceeding available capacity, causing queueing/loss'],
 ])+
 fmla('Bandwidth-Delay Product (BDP) = Bandwidth &times; RTT')+
 `<p>BDP is the amount of data "in flight" needed to keep a pipe full. Example: a 100&nbsp;Mbps link with a 100&nbsp;ms RTT has a BDP of 100,000,000 &times; 0.1 = 10,000,000 bits &asymp; <strong>1.25&nbsp;MB</strong>. If your TCP send/receive window is smaller than the BDP, the link sits idle waiting for acknowledgments no matter how much bandwidth exists &mdash; this single number explains why long-fat-network performance tuning exists.</p>`)
]);

reg('layering','02','Network Architecture & Layering',
'Layering is the single idea that makes the Internet tractable: split an impossibly complex problem into independent slices, each hiding its internals behind a stable interface to the layer above.',
[
sec('Protocols, services, and interfaces',
 `<p>A <strong>protocol</strong> is a precise agreement between peers about message format and the rules for exchanging them. A <strong>protocol suite</strong> or <strong>stack</strong> is a set of protocols designed to work together, each occupying one <strong>layer</strong>. Each layer offers a <strong>service</strong> to the layer above through a well-defined <strong>interface</strong>, while hiding how that service is implemented &mdash; this is <strong>abstraction</strong>, and it is what allows Wi-Fi and fiber to both simply be "the network" to your browser.</p>`),
sec('OSI vs TCP/IP',
 stack([['7 &middot; Application','HTTP, DNS, SMTP &mdash; user-facing protocols'],['6 &middot; Presentation','Encoding, encryption, compression (often folded into app/TLS today)'],['5 &middot; Session','Dialog control (rarely a distinct layer in practice)'],['4 &middot; Transport','TCP, UDP, QUIC &mdash; process-to-process delivery'],['3 &middot; Network','IP &mdash; host-to-host delivery across networks'],['2 &middot; Data Link','Ethernet, Wi-Fi &mdash; node-to-node delivery on one link'],['1 &middot; Physical','Bits on copper, fiber, or radio']])+
 `<p>The <strong>TCP/IP model</strong> that the real Internet runs on collapses this to four practical layers: <strong>Link, Internet, Transport, Application</strong>. OSI is the teaching reference; TCP/IP is what ships. The two rarely map perfectly &mdash; TLS, for instance, straddles session/presentation duties inside what TCP/IP just calls "application."</p>`),
sec('Why layer, and where it breaks down',
 `<p>Layering buys <strong>modularity</strong> (swap Wi-Fi for fiber without touching TCP), <strong>independent innovation</strong> (QUIC shipped without changing routers), and manageable complexity. The cost is <strong>overhead</strong> (every layer adds header bytes and processing) and <strong>layering violations</strong> &mdash; cases where a layer must peek at another's data to work at all, e.g. TCP's checksum covers a pseudo-header borrowed from IP.</p>
 <p>The <strong>end-to-end principle</strong> (Saltzer, Reed, Clark, 1984) argues that functions like reliability and security are best implemented at the endpoints, not the network core &mdash; the core should stay simple and "dumb." This produced the Internet's <strong>narrow waist</strong>: an enormous diversity of link technologies below IP, an enormous diversity of applications above it, and one thin, stable IP layer holding it all together. <strong>Middleboxes</strong> (NATs, firewalls, proxies) violate the end-to-end principle by inspecting or altering packets in the core &mdash; a pragmatic but permanent tension in Internet architecture.</p>`),
sec('Encapsulation',
 `<p>Data moving down the stack is wrapped, not translated: each layer prepends (or appends) its own header to the payload from the layer above, producing a Russian-doll structure. Moving up the stack at the receiver is the reverse: <strong>decapsulation</strong>, each layer stripping its own header before handing the remainder upward.</p>`+
 flow(['Application Data','+ TCP header &rarr; Segment','+ IP header &rarr; Packet','+ Ethernet header/trailer &rarr; Frame','&rarr; Bits on the wire'])+
 hdiag('encapstack','FIG. — ENCAPSULATION, LAYER BY LAYER','Each layer wraps the one above it in its own header — the animated packet shows one unit of data descending the full stack.')+
 callout('','TERMINOLOGY','Each layer\'s unit of data has a name: <strong>bits</strong> (Physical), <strong>frame</strong> (Data Link), <strong>packet/datagram</strong> (Network), <strong>segment</strong>/<strong>datagram</strong> (Transport: TCP/UDP respectively), <strong>message</strong> (Application). Generic term for any of these: <strong>PDU</strong> &mdash; Protocol Data Unit.'))
]);

reg('osimodel','02B','The Complete OSI Model — Layer by Layer',
'The OSI Model is the reference map every networking concept in this platform ultimately plugs into. This chapter walks all seven layers end to end using one concrete, worked example — a login request travelling from a client to a server node — with real header values at every step, exactly the way a packet capture would show it.',
[
sec('What the OSI Model is, and why it has exactly seven layers',
 `<p>The <strong>Open Systems Interconnection (OSI) Model</strong> was published by the <strong>ISO</strong> (International Organization for Standardization) in 1984 as a vendor-neutral reference for how network communication should be divided into independent, stackable responsibilities. It was never meant to be implemented literally byte-for-byte (the Internet runs on the leaner four-layer TCP/IP model instead) &mdash; its real value is as a shared <strong>vocabulary</strong>: "Layer 3 problem" or "Layer 7 firewall" mean something precise to any network engineer on Earth because everyone is pointing at the same seven-layer map.</p>
 <p>Each layer exists to solve one specific class of problem, hand its result to the layer above or below, and otherwise stay out of that layer\'s business:</p>`+
 table(['#','Layer','Unit (PDU)','Core job'],[
  ['7','Application','Data','What the human or program actually wants to say'],
  ['6','Presentation','Data','Make that data safe and portable: encrypt, serialize, compress'],
  ['5','Session','Data','Open, manage, and close a logical conversation'],
  ['4','Transport','Segment','Get it from the right process to the right process (ports)'],
  ['3','Network','Packet','Get it from the right host to the right host, across networks (IP)'],
  ['2','Data Link','Frame','Get it across exactly one physical hop (MAC)'],
  ['1','Physical','Bits','Actually put energy on a medium — voltage, light, or radio'],
 ])),
sec('The worked example — a login request to Node 34-2A',
 `<p>To make every layer concrete, follow one real action through the whole stack: a client machine logs into an application, sending a <strong>username and password</strong> to a server identified as <strong>Node 34-2A</strong>. Every value below (ports, IPs, MAC addresses) is illustrative but internally consistent, the same way a real Wireshark capture would look.</p>`+
 hdiag('osiencap','FIG. — ONE LOGIN REQUEST, ALL SEVEN LAYERS','Reading top to bottom is encapsulation (sending); reading bottom to top at the receiver is decapsulation.')),
sec('Layer 7 — Application: human-readable data',
 `<p>This is the only layer a human ever consciously interacts with. The application (a login form) produces <strong>human-readable data</strong>: <code>username = &hellip;</code>, <code>password = &hellip;</code>. Protocols living here: HTTP, DNS, SMTP, FTP, SSH. Nothing about ports, IP addresses, or wires exists yet at this stage &mdash; it\'s purely "what do I want to send."</p>`),
sec('Layer 6 — Presentation: encryption, serialization, compression',
 `<p>Before the data leaves the application, it\'s made safe and portable. Three things typically happen here, in roughly this order: <strong>serialization</strong> (structuring the data into a defined format, e.g. JSON), <strong>compression</strong> (shrinking it if worthwhile), and <strong>encryption</strong> (TLS, so the raw username/password are never sent in the clear). The data is still just "Data" as a PDU &mdash; Presentation doesn\'t add its own header in most real implementations, it transforms the payload in place.</p>`),
sec('Layer 5 — Session: managing the conversation',
 `<p>The Session layer establishes, maintains, and eventually tears down a logical conversation between the two endpoints &mdash; think of it as the layer that remembers "this login attempt and the next few requests all belong to the same conversation." In practice on the modern Internet this responsibility is largely absorbed into TLS session state and application-level session tokens/cookies, rather than a separate protocol of its own &mdash; one reason Session and Presentation are the two OSI layers engineers reference least often day-to-day.</p>`),
sec('Layer 4 — Transport: the data becomes a Segment',
 `<p>This is the first layer where a real, inspectable header gets added. The Transport layer wraps the data in a <strong>Segment</strong> (TCP) or <strong>datagram</strong> (UDP), and adds <strong>port numbers</strong> identifying which process on each end this belongs to:</p>`+
 table(['Field','Example value'],[['Protocol','TCP'],['Source port','53211 (the client\'s temporary port)'],['Destination port','4000 (the login service\'s listening port)']])+
 `<p>Port <strong>4000</strong> here plays exactly the role port 443 plays for HTTPS or port 53 plays for DNS &mdash; it tells the receiving machine <em>which application</em> should get this data once it arrives, out of potentially dozens running at once.</p>`),
sec('Layer 3 — Network: the segment becomes a Packet',
 `<p>The Network layer wraps the segment in a <strong>Packet</strong> and adds <strong>IP addresses</strong> &mdash; the addressing that will get this data across however many networks separate the client from Node 34-2A:</p>`+
 table(['Field','Example value'],[['Source IP','192.168.0.5 (the client)'],['Destination IP','142.3.4.1 (the server)']])+
 `<p>Unlike the MAC addresses one layer down, these IP addresses stay <strong>the same for the entire end-to-end journey</strong> (barring NAT) &mdash; every router along the way reads the destination IP to decide the next hop, but never rewrites it.</p>`),
sec('Layer 2 — Data Link: the packet becomes a Frame',
 `<p>The Data Link layer wraps the packet in a <strong>Frame</strong> and adds <strong>MAC addresses</strong> &mdash; but only for the <em>next physical hop</em>, not the final destination:</p>`+
 table(['Field','Example value'],[['Source MAC','24-9A-43-2B (the client\'s NIC)'],['Destination MAC','1A-42-F9-4B (the very next hop — usually the default gateway/router, not the final server)']])+
 `<p>This distinction &mdash; IP addresses are end-to-end, MAC addresses are hop-to-hop &mdash; is one of the most tested concepts in networking, and the next section walks through exactly why.</p>`),
sec('Layer 1 — Physical: the frame becomes bits',
 `<p>Finally, the frame is converted into whatever the physical medium actually carries &mdash; voltage transitions on copper, light pulses in fiber, or radio waves over Wi-Fi &mdash; a raw stream of <strong>bits</strong>, no headers left to reason about, just <code>1011010&hellip;</code> traveling as physical energy.</p>`),
sec('Hop-to-hop delivery — why the MAC address keeps changing but the IP address doesn\'t',
 hdiag('hopmac','FIG. — SAME IP, NEW MAC AT EVERY HOP','Layer 3 delivery is end-to-end (192.168.0.5 → 142.3.4.1, unchanged the whole way). Layer 2 delivery is hop-to-hop — a fresh source/destination MAC pair is written at every single link.')+
 `<p>When the frame reaches the first router (MAC <code>1A-42-F9-4B</code>), that router strips the Layer 2 header entirely, looks only at the Layer 3 destination IP (<code>142.3.4.1</code>) to decide the next hop, and builds a <strong>brand-new frame</strong> for the next link &mdash; now with <em>its own</em> outgoing interface as the source MAC and the next hop\'s MAC as the destination (e.g. <code>S = 1A-42-F9-4B, D = 34-2A</code> for the final hop into the server\'s own switch port). This repeats at every router between client and server. The packet\'s IP header is untouched through all of it; only the Ethernet frame around it is torn down and rebuilt, hop by hop.</p>`+
 callout('','WHY IT\'S DESIGNED THIS WAY','MAC addresses only need to be unique on one local segment, so they can be cheap, flat, and re-used everywhere. IP addresses need to be globally meaningful for routing to work at all, so they stay fixed for the whole journey. Splitting "how do I reach the very next device" (Layer 2) from "where does this ultimately need to end up" (Layer 3) is exactly what lets one packet cross dozens of unrelated physical networks without every router needing to understand every kind of link technology on Earth.')),
sec('Decapsulation — the reverse trip at the receiver',
 flow(['Bits arrive at Node 34-2A\'s NIC','Physical layer recovers the Frame from the raw signal','Data Link layer strips the MAC header, checks the FCS, hands up the Packet','Network layer strips the IP header, confirms 142.3.4.1 is really this host, hands up the Segment','Transport layer strips the TCP header, uses port 4000 to find the right process, hands up the Data','Presentation layer decrypts/decompresses/deserializes it','Session layer confirms which ongoing conversation this belongs to','Application layer finally sees the human-readable username and password'])),
sec('OSI vs. TCP/IP, and which devices live at which layer',
 table(['OSI layer','TCP/IP layer','Typical device / example'],[
  ['7 Application','Application','Browser, HTTP/DNS/SMTP client — application firewalls, proxies'],
  ['6 Presentation','Application','TLS encryption, JSON/Protobuf serialization'],
  ['5 Session','Application','Session tokens, TLS session resumption'],
  ['4 Transport','Transport','TCP/UDP stack — Layer-4 load balancers'],
  ['3 Network','Internet','Routers, Layer-3 switches — IP routing'],
  ['2 Data Link','Link','Switches, bridges, NICs — MAC forwarding'],
  ['1 Physical','Link','Hubs, cables, radios, transceivers'],
 ])),
sec('OSI vs. TCP/IP — the reference comparison table',
 table(['OSI Model Layer','TCP/IP Model Layer','Data Name (PDU)','Description'],[
  ['Application (Layer 7)','Application','Data','Provides services for end-user applications like HTTP, FTP, DNS, SMTP.'],
  ['Presentation (Layer 6)','Application','Data','Handles data format translation, encryption, and compression.'],
  ['Session (Layer 5)','Application','Data','Manages sessions (establishment, maintenance, and termination).'],
  ['Transport (Layer 4)','Transport','Segment (TCP) / Datagram (UDP)','Ensures reliable or fast delivery with protocols like TCP or UDP.'],
  ['Network (Layer 3)','Internet','Packet','Handles logical addressing (IP addresses) and routes data between networks.'],
  ['Data Link (Layer 2)','Network Access','Frame','Structures packets into frames, adds MAC addresses, and manages error checking.'],
  ['Physical (Layer 1)','Network Access','Bits','Transmits raw binary data as electrical, optical, or radio signals.'],
 ]))
]);

reg('perfmath','03','Performance & Network Mathematics',
'Every networking decision &mdash; buffer size, timeout value, link upgrade &mdash; is ultimately a calculation. This chapter is the arithmetic toolbox the rest of the platform relies on.',
[
sec('The four delay components',
 table(['Delay','Formula','Depends on'],[
  ['Transmission','Packet size / Link rate','How fast bits are pushed onto the wire'],
  ['Propagation','Distance / Propagation speed','Physical distance and medium (&asymp;2&times;10<sup>8</sup> m/s in fiber)'],
  ['Processing','Device-dependent','Router/switch lookup & queue-management work'],
  ['Queueing','Depends on traffic load','Congestion at the outbound interface'],
 ])+
 fmla('Total end-to-end delay = Transmission + Propagation + Processing + Queueing (summed per hop)')+
 hdiag('delaychain','FIG. — THE FOUR DELAYS, IN ORDER','Each hop pays all four costs — propagation usually dominates over long distance, transmission over slow/congested links.')+
 `<p>Worked example: sending a 1500-byte (12,000-bit) packet over a 1&nbsp;Gbps link spanning 2,000&nbsp;km of fiber &mdash; transmission delay = 12,000 / 10<sup>9</sup> = <strong>12&nbsp;&micro;s</strong>; propagation delay = 2,000,000 / 2&times;10<sup>8</sup> = <strong>10&nbsp;ms</strong>. Propagation dominates over long distances; transmission dominates on slow or congested links carrying big packets.</p>`),
sec('Throughput, RTT, and Little\'s Law',
 fmla('Throughput = Data transferred / Time taken')+
 `<p><strong>RTT</strong> (round-trip time) is the time for a packet to reach the destination and its acknowledgment to return &mdash; it sets the pace at which a single reliable flow can operate. <strong>Little\'s Law</strong>, borrowed from queueing theory, states <code>L = &lambda; &times; W</code>: the average number of items in a system (L) equals the arrival rate (&lambda;) times the average time each item spends in the system (W). Applied to a router queue, it directly links arrival rate, queue length, and delay &mdash; the mathematical basis for capacity planning.</p>
 <p>An <strong>M/M/1 queue</strong> (Poisson arrivals, exponential service time, one server) is the simplest tractable model of a router's outbound buffer; it shows that average delay grows explosively, not linearly, as utilization approaches 100% &mdash; which is why network operators target utilization well under saturation, not "as close to full as possible."</p>`),
sec('Bufferbloat and head-of-line blocking',
 callout('warn','PRACTICAL FAILURE MODE','<strong>Bufferbloat</strong>: oversized buffers absorb bursts instead of dropping them, so a queue can grow for seconds, adding huge latency to every flow sharing that link &mdash; even though no packet is ever lost. <strong>Head-of-line (HOL) blocking</strong>: one stalled item (a lost packet, a slow request) blocks everything queued behind it, even unrelated data &mdash; the core motivation for HTTP/2 stream multiplexing and later QUIC.')),
sec('Interactive calculator',
 '<div id="tool-bdp"></div>')
], {tool:'bdp'});

/* ===== GROUP II — PHYSICAL & LINK ===== */
reg('physical','04','Physical Layer',
'The physical layer turns bits into something that can actually travel: voltage, light, or radio. Every other layer assumes this one works &mdash; when it fails, nothing above it can help.',
[
sec('Signals and their properties',
 `<p>A signal carries information by varying a physical quantity over time. Key properties: <strong>frequency</strong> (cycles/sec, Hz), <strong>amplitude</strong> (signal strength), <strong>phase</strong> (timing offset), and <strong>wavelength</strong> (physical distance per cycle). The range of frequencies a medium can carry is its <strong>spectrum</strong> or <strong>bandwidth</strong> in the original, physical sense of the word (distinct from "bits/sec," though the two are related by the Shannon/Nyquist limits below). <strong>Bit rate</strong> is bits/sec transmitted; <strong>baud rate</strong> is symbols/sec &mdash; they're equal only when each symbol encodes exactly one bit.</p>`),
sec('Line coding and modulation',
 `<p><strong>Line coding</strong> maps bits directly onto a baseband digital signal: <strong>NRZ</strong> (level per bit, but long runs of 0s/1s lose clock sync), <strong>Manchester</strong> (a transition mid-bit guarantees clock recovery at the cost of double bandwidth, used in classic 10&nbsp;Mbps Ethernet), <strong>4B/5B</strong> and <strong>8B/10B</strong> (map data bits to slightly longer code-words that guarantee enough transitions), and <strong>PAM-4</strong> (4 voltage levels &rarr; 2 bits/symbol, used in 100GbE+ and NVMe signaling to raise rate without raising frequency).</p>
 <p><strong>Modulation</strong> carries digital data over an analog carrier by varying amplitude (<strong>ASK</strong>), frequency (<strong>FSK</strong>), or phase (<strong>PSK</strong>/<strong>QPSK</strong>), or combinations of amplitude+phase (<strong>QAM</strong>). <strong>OFDM</strong> splits one channel into many narrow, overlapping-but-orthogonal subcarriers transmitted in parallel &mdash; the technique behind Wi-Fi, LTE/5G, and cable broadband, because it resists multipath fading far better than a single wideband carrier.</p>`),
sec('The two hard limits on capacity',
 fmla('Nyquist: Max bit rate = 2B &times; log&#8322;(L)  &nbsp;(B = bandwidth in Hz, L = signal levels, noiseless channel)')+
 fmla('Shannon: Capacity = B &times; log&#8322;(1 + S/N)  &nbsp;(S/N = signal-to-noise ratio, real noisy channel)')+
 `<p>Nyquist bounds a perfect, noise-free channel; Shannon bounds any real, noisy one and is the limit engineers actually design against. Doubling bandwidth (B) roughly doubles capacity; doubling SNR only adds capacity logarithmically &mdash; which is why "add more spectrum" beats "add more power" whenever it's an option.</p>`),
sec('Transmission media',
 table(['Medium','Type','Typical use'],[
  ['UTP/STP copper','Twisted pair','Cat5e/6/6a/8 &mdash; desk and access-layer Ethernet'],
  ['Coaxial','Copper, shielded','Cable broadband (DOCSIS)'],
  ['Single-mode fiber','Optical, one light path','Long-haul, metro, data-center core'],
  ['Multi-mode fiber','Optical, multiple paths','Short intra-building/data-center runs'],
  ['WDM / DWDM','Optical multiplexing','Many wavelengths &times; one fiber for massive backbone capacity'],
  ['RF / microwave / satellite','Wireless','Wi-Fi, cellular, backhaul, LEO constellations'],
 ])+
 `<p>Impairments common to all media: <strong>attenuation</strong> (signal weakens with distance), <strong>noise</strong> (unwanted energy), <strong>interference</strong> (energy from other sources), <strong>crosstalk</strong> (leakage between adjacent conductors), summarized by <strong>SNR</strong> and observed as <strong>BER</strong> (bit error rate) at the receiver.</p>`)
]);

reg('topology','04B','Network Topology — The Complete Guide',
'Topology is the shape of a network: how nodes and links are physically or logically arranged. The shape you choose determines cost, fault tolerance, and how far a single failure can spread — this chapter covers all seven classic topologies end to end, with the failure behavior of each.',
[
sec('1. Point-to-Point',
 `<p>Two devices connected through one dedicated link, with no intermediary. Simple, high-performance, and secure precisely because only two devices ever share that link — a leased WAN line between two offices, or a direct router-to-router connection, are typical examples.</p>`+
 table(['Advantages','Disadvantages'],[['Simple, dedicated bandwidth, easy to secure/troubleshoot','Connects only two devices; scaling to more requires more links, which gets expensive fast']])),
sec('2. Bus',
 hdiag('topo_bus','FIG. — BUS TOPOLOGY','All devices tap into one shared backbone cable, terminated at both ends to stop signal reflection.')+
 `<p>Every device shares one backbone cable; every transmission is seen by every device, but only the intended recipient processes it. Historic coaxial Ethernet (10BASE2/10BASE5) used this physically. A single backbone break takes the <strong>entire</strong> network down &mdash; the single biggest reason bus topology is essentially extinct in modern LANs.</p>`),
sec('3. Ring',
 hdiag('topo_ring','FIG. — RING TOPOLOGY','Each device connects to exactly two neighbors, forming a closed loop; data (or a token) circulates around it.')+
 `<p>Each device connects to exactly two neighbors, forming a closed loop. Some historical ring networks (IBM Token Ring, FDDI) used a circulating <strong>token</strong> &mdash; only the device holding it could transmit, which elegantly avoided collisions. A single broken link can disrupt a simple (non-redundant) ring entirely, which is why production ring designs typically add a second, counter-rotating ring for resilience.</p>`),
sec('4. Star',
 hdiag('topo_star','FIG. — STAR TOPOLOGY','Every device connects only to a central switch — the dominant physical topology of virtually every modern Ethernet LAN.')+
 `<p>Every device connects only to a central device &mdash; a switch, in any modern Ethernet LAN. This is why star dominates real-world networks: one cable failing only takes down the one device on that cable, installation and troubleshooting are simple, and adding a device never disrupts anyone else. The one real weakness is the central switch itself &mdash; if it fails, every device attached to it loses connectivity at once, which is exactly why core switches get built with redundant power, redundant uplinks, or paired failover units.</p>`),
sec('5. Mesh',
 hdiag('topo_mesh','FIG. — FULL MESH TOPOLOGY','Every node connects directly to every other node — maximum redundancy, at a steeply rising cost.')+
 `<p>In a <strong>full mesh</strong>, every device connects directly to every other device, so losing any single link still leaves an alternate path. In a <strong>partial mesh</strong>, only some devices get multiple connections &mdash; a practical compromise. The number of links a full mesh needs grows fast:</p>`+
 fmla('Links required = n(n&minus;1) / 2')+
 `<p>5 devices need 5&times;4/2 = <strong>10</strong> links; 10 devices need 10&times;9/2 = <strong>45</strong>. This quadratic growth is exactly why full mesh is reserved for small, mission-critical cores (Internet backbone links, WAN router cores) rather than general LANs.</p>`),
sec('6. Tree',
 hdiag('topo_tree','FIG. — TREE TOPOLOGY','Multiple star networks connected in a parent-child hierarchy — the natural shape of a campus or multi-building network.')+
 `<p>A hierarchical structure formed by connecting multiple star networks in a parent-child arrangement &mdash; the natural shape a university or enterprise campus grows into as buildings and departments are added over time. A leaf device failing affects only itself; an intermediate switch failing takes its whole branch down; the core failing can affect everything beneath it &mdash; fault impact scales directly with how high up the hierarchy the failure occurs.</p>`),
sec('7. Hybrid',
 `<p>Any real combination of the above &mdash; e.g. one building wired as a star, connected via a WAN ring to another building also wired as a star, all tied together through a core network. Most real, mature enterprise and campus networks are hybrids in practice, even when individual sections are cleanly one textbook topology.</p>`),
sec('Comparison and failure behavior',
 table(['Topology','Central device?','Reliability','Cost','Scalability'],[
  ['Point-to-Point','No','High for that one link','Low for 2 devices','Low'],
  ['Bus','No','Low — one backbone break kills the network','Low','Low'],
  ['Ring','No','Medium/Low — one break can disrupt a simple ring','Medium','Medium'],
  ['Star','Yes','High — one cable failing isolates only that device','Medium','High'],
  ['Mesh','No','Very high — multiple paths survive link loss','Very high','Medium/Low'],
  ['Tree','Yes (hierarchical)','High — failure impact scales with hierarchy level','Medium/High','Very high'],
  ['Hybrid','Depends','Depends on the combined topologies','High','Very high'],
 ])),
sec('Physical vs. logical topology — a distinction worth keeping straight',
 `<p><strong>Physical topology</strong> describes how devices and cables are actually connected in space; <strong>logical topology</strong> describes how data actually flows. A modern Ethernet LAN is a textbook example of the two diverging: it is almost always wired as a <strong>physical star</strong> (every device cabled to a central switch), while its <strong>logical</strong> behavior is governed by switching and forwarding logic, not by the physical cable shape at all.</p>`),
sec('Quick revision',
 table(['Topology','Remember it as'],[
  ['Point-to-Point','One device &harr; one device'],
  ['Bus','One common backbone'],
  ['Ring','Devices form a circle'],
  ['Star','Everything connects to a center'],
  ['Mesh','Multiple paths between devices'],
  ['Tree','Hierarchical parent-child structure'],
  ['Hybrid','Combination of different topologies'],
 ])+
 callout('','MEMORY TRICK','<strong>P B R S M T H</strong> &mdash; Point &rarr; Bus &rarr; Ring &rarr; Star &rarr; Mesh &rarr; Tree &rarr; Hybrid.'))
]);

reg('muxswitch','05','Multiplexing & Switching',
'Links and switching fabrics are expensive shared resources. Multiplexing decides how many conversations share one wire; switching decides how each unit of data finds its way through the network.',
[
sec('Multiplexing techniques',
 table(['Technique','Splits by','Example'],[
  ['FDM','Frequency','Cable TV channels, analog radio'],
  ['TDM','Time slots','T1/E1 circuits, GSM voice'],
  ['WDM','Optical wavelength','DWDM backbone fiber'],
  ['CDM','Orthogonal codes','CDMA cellular (legacy 3G)'],
  ['SDM','Physical/spatial streams','MIMO Wi-Fi, multi-fiber bundles'],
 ])+
 `<p><strong>Statistical multiplexing</strong> &mdash; the technique underlying all packet networks &mdash; doesn't pre-allocate fixed slots; instead it lets any flow use the full link whenever others are idle, trading a small risk of momentary congestion for dramatically higher average utilization than fixed TDM/FDM.</p>`),
sec('Circuit vs packet vs message switching',
 table(['Switching','Resource reservation','Delay character','Example'],[
  ['Circuit','Dedicated path for call duration','Fixed, predictable','Traditional telephone network'],
  ['Packet (datagram)','None &mdash; each packet routed independently','Variable, bursty','The Internet (IP)'],
  ['Packet (virtual circuit)','Path set up once, packets follow it','More predictable than pure datagram','ATM, MPLS, Frame Relay'],
  ['Message switching','Whole message stored & forwarded hop by hop','High, but resilient','Historic store-and-forward telegraph networks'],
 ])+
 callout('','WHY IT MATTERS','Circuit switching guarantees bandwidth but wastes it during silence; packet switching shares efficiently but must cope with congestion it cannot fully predict. Nearly every modern network debate &mdash; QoS, traffic engineering, congestion control &mdash; is really this trade-off resurfacing.'))
]);

reg('datalink','06','Data Link Layer',
'The data link layer turns a raw, error-prone physical channel into something the network layer can trust for delivery across exactly one hop.',
[
sec('Framing and addressing',
 `<p><strong>Framing</strong> marks where one link-layer unit begins and ends inside a continuous bit stream, typically via defined header/trailer patterns or byte-stuffed delimiters. Every frame carries source and destination <strong>MAC addresses</strong> &mdash; 48-bit identifiers burned into (or spoofable on) a NIC, unique within a broadcast domain.</p>`),
sec('Error detection and correction',
 table(['Technique','Detects','Corrects?','Notes'],[
  ['Parity bit','Single-bit errors','No','Cheap, weak'],
  ['Checksum','Burst errors, moderately','No','Used by IP/TCP/UDP headers'],
  ['CRC (Cyclic Redundancy Check)','Burst errors, very reliably','No','Standard in Ethernet frame trailer'],
  ['Hamming code','Single-bit errors','Yes (1-bit)','Classic FEC teaching example'],
  ['Forward Error Correction (FEC)','Multiple-bit errors','Yes','Added redundancy transmitted proactively (optical links, satellite, Wi-Fi)'],
 ])+
 `<p>Detection-only schemes rely on the sender retransmitting; FEC spends bandwidth up front so the receiver can repair errors itself &mdash; the right trade-off when RTT is too long or retransmission too costly (deep space, live video).</p>`),
sec('Reliable delivery: ARQ',
 table(['Protocol','Idea','Efficiency'],[
  ['Stop-and-Wait','Send 1 frame, wait for ACK before sending next','Low on high-BDP links &mdash; link idles during RTT'],
  ['Go-Back-N','Send window of N frames; on any loss, resend everything from the lost frame onward','Simple receiver, wastes bandwidth on loss'],
  ['Selective Repeat','Send window of N frames; retransmit only the specific lost frame','Best throughput, more receiver-side buffering'],
 ])+
 hdiag('arqwindow','FIG. — STOP-AND-WAIT VS. SLIDING WINDOW','A single-frame-at-a-time link idles most of the time; a window keeps several frames in flight to fill the pipe.')+
 callout('','WORKED EXAMPLE','Link rate 1 Mbps, frame 1000 bits, RTT 20 ms. Stop-and-Wait: 1 frame (1 ms) then 20 ms idle wait &rarr; efficiency &asymp; 1/21 &asymp; 4.8%. A sliding window sized to the BDP (20,000 bits/1000 = 20 frames) keeps the pipe continuously full &mdash; this is exactly why TCP uses a window, not stop-and-wait, at the transport layer.'))
]);

reg('mac','07','MAC & Medium Access Control',
'When many nodes share one physical channel, something has to decide who transmits when &mdash; that referee is the Medium Access Control sublayer.',
[
sec('Random access protocols',
 table(['Protocol','Rule','Max theoretical efficiency'],[
  ['Pure ALOHA','Transmit whenever you have data; retry with random backoff on collision','&asymp;18%'],
  ['Slotted ALOHA','Transmit only at the start of a fixed time slot','&asymp;37%'],
  ['CSMA','Listen before transmitting ("carrier sense")','Better, but collisions still possible near-simultaneously'],
  ['CSMA/CD','CSMA + detect collision mid-transmission, abort early','Classic wired Ethernet'],
  ['CSMA/CA','CSMA + avoid collisions proactively (can\'t reliably detect them)','Wi-Fi, because a radio can\'t hear over its own transmission'],
 ])),
sec('Collisions, domains, and backoff',
 `<p>A <strong>collision</strong> happens when two frames overlap on the medium, corrupting both. A <strong>collision domain</strong> is the set of nodes whose transmissions can collide with each other; switches (unlike hubs) put every port in its own collision domain. A <strong>broadcast domain</strong> is the set of nodes that receive each other's broadcasts &mdash; routers (or VLANs) bound broadcast domains; switches alone do not. After a collision, <strong>exponential backoff</strong> makes each station wait a random multiple of a base slot time, doubling the range after each repeated collision, so competing stations statistically spread their retries apart.</p>`),
sec('Collision animation',
 hdiag('csmacd','FIG. — A CSMA/CD COLLISION','Two stations sense the bus idle, transmit at the same instant, and collide — both back off for a random interval and retry.')),
sec('Ethernet vs Wi-Fi access',
 `<p>Ethernet historically used CSMA/CD, but full-duplex switched Ethernet has effectively retired it &mdash; a dedicated switch port to each device means there's no shared medium left to contend for. Wi-Fi still needs contention because radio is inherently shared and half-duplex per channel, so CSMA/CA (with optional RTS/CTS handshakes to solve the "hidden node" problem) remains essential.</p>`)
]);

reg('ethernet','08','Ethernet & LAN',
'Ethernet is the most successful link-layer technology ever built: unchanged in spirit since 1980, still scaling from 10&nbsp;Mbps to 800&nbsp;Gbps in the same data centers where it began.',
[
sec('The Ethernet frame',
 table(['Field','Size','Purpose'],[
  ['Preamble + SFD','8 bytes','Clock synchronization, frame start marker'],
  ['Destination MAC','6 bytes','Recipient hardware address'],
  ['Source MAC','6 bytes','Sender hardware address'],
  ['EtherType / Length','2 bytes','Identifies the payload protocol (e.g. 0x0800 = IPv4)'],
  ['Payload','46&ndash;1500 bytes','Encapsulated packet (jumbo frames extend this)'],
  ['FCS (CRC)','4 bytes','Error-detection trailer'],
 ])),
sec('Speed evolution',
