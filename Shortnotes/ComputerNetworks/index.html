 flow(['Users','DNS','CDN','WAF','Load Balancer','API Gateway','Service Mesh','Kubernetes','Microservices','Database'])+
 `<p>Deployed across <strong>Region A, Region B, Region C</strong>. This is a design exercise, not an automated grader &mdash; use it to pressure-test your own reasoning against the decisions below, then compare.</p>`),
sec('Decisions to work through',
 `<ul>
 <li><strong>IP addressing</strong> &mdash; a per-region VPC scheme that\'s summarizable and won\'t need renumbering as you add a fourth region</li>
 <li><strong>DNS</strong> &mdash; GeoDNS or Anycast to route users to their nearest healthy region</li>
 <li><strong>Routing / BGP</strong> &mdash; how regions and any on-prem components interconnect and advertise reachability</li>
 <li><strong>Load balancing & CDN</strong> &mdash; where content is cached, where requests are balanced, and at which layer (L4 vs L7)</li>
 <li><strong>TLS</strong> &mdash; where certificates terminate (edge vs. origin) and whether east-west traffic is also encrypted (mTLS via service mesh)</li>
 <li><strong>Zero trust</strong> &mdash; per-request authorization instead of relying on network location alone</li>
 <li><strong>Observability</strong> &mdash; logs/metrics/traces across every hop, correlated by a request ID</li>
 <li><strong>Latency & availability</strong> &mdash; explicit RTO/RPO targets and what happens when one region fails entirely</li>
 <li><strong>Disaster recovery</strong> &mdash; data replication strategy and tested (not theoretical) failover</li>
 <li><strong>Network security & data center networking</strong> &mdash; segmentation between tenants/services and the fabric each region\'s Kubernetes cluster runs on</li>
 <li><strong>Cost & scalability</strong> &mdash; where you\'re deliberately over-provisioning for headroom, and where you\'re not</li>
 </ul>`),
sec('Self-check',
 callout('','SCORE YOURSELF','A strong design explicitly states a trade-off for every decision above &mdash; there is no free option. If any answer reads as "just use the best one for everything," that\'s the place to go back and add the constraint that makes it a real decision.'))
]);

/* ===== GROUP XII — HISTORY OF NETWORKING ===== */
reg('hist-before','H1','Before the Wire',
'Digital networking did not begin with computers. It began roughly two centuries earlier, the moment humans first tried to separate information from physical mass &mdash; to send a message without sending an object. This chapter follows that idea through optical semaphore, electric telegraph, and telephone.',
[
sec('The information problem',
 `<p>For most of human history, information moved only as fast as a messenger could run, a horse could gallop, or a ship could sail. A governor in Rome who needed to reach a legion in Gaul had no choice but to send a physical rider carrying a physical document a thousand miles down a road. The bottleneck was structural: <strong>the mass of the message equaled the mass of its carrier.</strong></p>`),
sec('1794 &mdash; Chappe\'s optical telegraph',
 `<p>French engineer <strong>Claude Chappe</strong> proposed a fix: mount a moveable wooden apparatus &mdash; a long <strong>regulator</strong> beam with two shorter <strong>indicator</strong> arms &mdash; on a tower. By pivoting the arms into one of thousands of codebook positions, an operator could signal a symbol that the next tower's operator read through a telescope and repeated down the chain, at the speed of sight rather than the speed of a horse. Chappe tested a rudimentary version on <strong>March 2, 1791</strong>; the French state funded a full line between <strong>Paris and Lille</strong> (about 230&nbsp;km), officially opened <strong>July 16, 1794</strong>.</p>`+
 callout('warn','🔎 RESEARCH NOTE','The Paris&ndash;Lille line used approximately <strong>15 to 18 towers</strong>, spaced 10&ndash;15&nbsp;km apart &mdash; not the 56 towers sometimes claimed. That larger figure belongs to the mature 1840s network, which had grown to 500+ stations covering roughly 5,000&nbsp;km and connecting 29 major cities. Chappe\'s 1795 codebook held <strong>8,940</strong> words and phrases, known only to inspectors &mdash; tower operators themselves typically had no idea what they were transmitting, only which shapes to copy.')+
 hdiag('semaphore','FIG. 1 — THE RELAY CHAIN','A signal hops tower to tower, read through a telescope, at the speed of sight — not the speed of a horse.')+
 `<p>Under good conditions a message crossed the 230&nbsp;km line in well under an hour &mdash; some accounts report as little as 9 to 32 minutes, against roughly a full day by horse relay. But the system was useless at night, in fog, rain, or heavy smoke, and demanded constant skilled labor and expensive state-funded infrastructure at every tower. Humanity needed a signal that didn\'t depend on light or weather at all.</p>`),
sec('1844 &mdash; the electric telegraph',
 mythfact('Samuel Morse invented the telegraph in isolation and devised Morse Code entirely by himself.','Telegraphy emerged along multiple parallel paths. Cooke and Wheatstone deployed working needle-telegraph systems in Britain around the same period; Alfred Vail did much of the detailed work on the letter-frequency table that became known as "Morse Code."')+
 `<p>Alessandro Volta\'s battery (1800) and Hans Christian &Oslash;rsted\'s discovery of electromagnetism (1820) gave engineers a genuinely new medium: electricity down a wire. <strong>Samuel Morse</strong>, <strong>Alfred Vail</strong>, and <strong>Leonard Gale</strong> built a circuit with a mechanical key &mdash; short interruptions (dots) and long interruptions (dashes) standing for letters, a binary temporal code. On <strong>May 24, 1844</strong>, from the Supreme Court chamber in the U.S. Capitol to a B&amp;O Railroad depot in Baltimore, the message <em>&ldquo;What hath God wrought&rdquo;</em> traveled roughly 40 miles in seconds. Vail and Morse assigned the shortest codes to the most frequent letters (\'E\', \'T\') &mdash; an early, informal instinct for what would later become data compression theory.</p>
 ${hdiag('telegraph','FIG. 2 — THE TELEGRAPH CIRCUIT','Pressing the key completes a circuit; the electromagnet at the far end pulls an armature that marks a moving paper tape.')}
 <p>The system remained point-to-point (one wire, two fixed locations), required trained operators to encode/decode character by character, and was physically fragile: the first transatlantic cable (1858) failed after roughly three weeks when high voltage destroyed its insulation. A durable transatlantic cable didn\'t succeed until 1866.</p>`),
sec('1876&ndash;1892 &mdash; the telephone and circuit switching',
 `<p><strong>Alexander Graham Bell</strong> and <strong>Thomas Watson</strong> asked a different question: could a continuously varying current replicate the continuous waveform of a human voice, rather than encoding it into discrete symbols? On <strong>March 10, 1876</strong>, in Boston, Bell\'s liquid transmitter &mdash; a needle dipped in acidified water, vibrated by a diaphragm &mdash; varied a circuit\'s resistance in step with sound, reproducing speech at a receiving electromagnet. <strong>Elisha Gray</strong> filed a strikingly similar design the very same day, February 14, 1876 (for the underlying patent), a coincidence that triggered decades of litigation.</p>
 <p>As telephones proliferated, running a dedicated wire between every possible pair of subscribers became mathematically absurd (<em>N</em> subscribers need on the order of <em>N(N&minus;1)/2</em> wires). The fix was a central hub: the telephone exchange. In the 1880s, Kansas City, Missouri undertaker <strong>Almon Brown Strowger</strong> &mdash; reportedly convinced a rival\'s wife, a switchboard operator, was diverting his calls &mdash; built a working automatic switch from a collar box and straight pins, patented it in 1891, and opened the first commercial automatic exchange in La Porte, Indiana on <strong>November 3, 1892</strong>.</p>`+
 callout('warn','🔎 RESEARCH NOTE','Some accounts place Strowger in Topeka, Kansas. The Kansas Historical Society and the SPARK Museum of Electrical Invention place him firmly in <strong>Kansas City, Missouri</strong> at the time he conceived and patented the automatic switch.')+
 hdiag('circuitswitch','FIG. 3 — THE STROWGER EXCHANGE','Every subscriber pair no longer needs its own wire — a central switch completes one circuit on demand, then tears it down.')+
 `<p>This institutionalized <strong>circuit switching</strong>: a dedicated copper path reserved for an entire call, silence and all, with a single broken link anywhere along the path dropping the whole call. That model worked tolerably for continuous human speech. It would prove disastrously inefficient once computers, not people, needed to talk.</p>`)
]);

reg('hist-waves','H2','How a Voice Becomes a Signal',
'Every phone call, radio broadcast, and fiber-optic Internet connection depends on a chain of energy conversions most people never think about. This chapter follows one human voice through every wave it becomes, and back again — and explains exactly why each conversion is necessary.',
[
sec('Two fundamentally different kinds of wave',
 `<p>Before tracing the chain, it matters to separate two physically different things that both get casually called "waves":</p>`+
 table(['','Sound wave','Electrical signal','Electromagnetic (radio) wave','Light (optical) signal'],[
  ['What it is','A mechanical pressure wave — molecules of air compressing and rarefying','Electrons drifting back and forth in a conductor','Oscillating electric + magnetic fields, self-propagating','A specific, very high frequency band of the same electromagnetic spectrum'],
  ['Needs a medium?','Yes — air, water, or a solid; cannot exist in vacuum','Yes — a conductor (copper, etc.)','No — radiates through empty space','No — but needs a low-loss path (fiber) to go far'],
  ['Typical speed','&asymp;343 m/s in air (slow)','&asymp;2&times;10&#8312; m/s in copper (near light-speed)','299,792,458 m/s in vacuum (light-speed)','&asymp;2&times;10&#8312; m/s in glass fiber'],
  ['Can cross empty space?','No','No (needs a wire)','Yes','Yes, within the fiber\'s glass core'],
 ])+
 `<p>A sound wave physically cannot leave a room without a medium to carry it, and even inside a room it loses most of its energy within a few dozen meters. Every technology in this chapter exists to solve exactly that one limitation: <strong>get the pattern of a sound wave to travel farther, faster, and more reliably than sound itself ever could.</strong></p>`),
sec('The transducer — converting energy without losing the pattern',
 `<p>A <strong>transducer</strong> is any device that converts energy from one form to another while preserving the <em>pattern</em> of variation — the shape of the wave, not the physical medium carrying it. A microphone is a transducer (sound &rarr; electrical); a speaker is the same transducer running in reverse (electrical &rarr; sound). The critical design requirement, in both directions, is <strong>fidelity</strong>: the electrical signal\'s voltage must rise and fall in the same pattern as the original air pressure did, or the reproduced sound will be distorted.</p>`),
sec('Path 1 — the original wired telephone call',
 hdiag('wavechainWired','FIG. — SOUND, WIRED END TO END','Bell\'s entire 1876 breakthrough was building a transducer good enough to make this round trip intelligible.')+
 `<p>Alexander Graham Bell\'s telephone transmitter used a diaphragm that vibrated with incoming sound pressure; that vibration varied the electrical resistance of a circuit (first via a liquid contact, later via carbon granules in commercial telephones), which varied the current flowing through the line in lock-step with the sound. At the far end, that varying current flowed through an electromagnet, whose changing pull on a metal diaphragm recreated the original pressure pattern in the air &mdash; sound again, now reaching a second person\'s ear.</p>
 <p><strong>Why convert at all, here:</strong> electricity in copper travels at a meaningful fraction of light-speed and, unlike sound, can be amplified with active electronics and carried for hundreds of kilometers with repeaters restoring the signal along the way. Air simply cannot do either.</p>`),
sec('Path 2 — going wireless: radio and cellular',
 hdiag('wavechainWireless','FIG. — SOUND, OVER THE AIR','Two full conversions now happen at each end: the audio-to-carrier step is the one landline telephony never needed.')+
 `<p>Human voice sits mostly in the 300&ndash;3,400&nbsp;Hz range. An antenna radiates efficiently only when its size is comparable to the wavelength it\'s handling &mdash; and a useful antenna for a 1&nbsp;kHz signal would need to be hundreds of kilometers long. So the audio-frequency electrical signal is never radiated directly. Instead it is <strong>modulated</strong>: used to vary some property (amplitude, frequency, or phase) of a much higher-frequency <strong>carrier wave</strong>, which an antenna of a practical size (centimeters, for cellular bands) can radiate efficiently as a genuine electromagnetic wave. That EM wave needs no medium at all &mdash; it propagates through air or vacuum at the speed of light.</p>
 <p>At the receiving antenna, the reverse happens: the EM wave induces a tiny corresponding current, a <strong>demodulator</strong> strips the original audio-frequency signal back out of the carrier, and a speaker converts that electrical signal back into sound. <strong>Heinrich Hertz</strong> first proved electromagnetic waves existed experimentally in 1887; <strong>Guglielmo Marconi</strong> turned that into practical long-distance wireless transmission by the late 1890s and into the 1900s.</p>`),
sec('Path 3 — the modern path: digital, then light',
 hdiag('wavechainDigital','FIG. — SOUND, DIGITIZED AND SENT AS LIGHT','Every long-distance call today almost certainly crosses this exact chain at least once, usually inside a data center or under an ocean.')+
 `<p>Modern telephone and Internet infrastructure adds two more conversions the original 1876 system never needed:</p>
 <ul>
  <li><strong>Analog &rarr; digital (ADC):</strong> the continuous analog electrical waveform is <strong>sampled</strong> at fixed intervals and each sample is stored as a binary number &mdash; classic telephony uses <strong>PCM</strong> (Pulse-Code Modulation), sampling 8,000 times per second at 8 bits per sample (64,000 bits/sec per call), a technique conceived by <strong>Alec Reeves</strong> in 1937 and deployed at scale by telephone carriers from the 1960s&ndash;70s onward.</li>
  <li><strong>Electrical &rarr; optical:</strong> for long-haul and Internet backbone links, that digital electrical signal drives a laser or LED, turning binary 1s and 0s into pulses of light injected into a hair-thin glass fiber. Practical <strong>low-loss optical fiber</strong> was demonstrated by <strong>Robert Maurer, Donald Keck, and Peter Schultz</strong> at Corning in 1970, building on loss-mechanism theory published by <strong>Charles Kao</strong> in 1966 (work recognized with a share of the 2009 Nobel Prize in Physics).</li>
 </ul>
 <p>At the receiving end this reverses exactly: a <strong>photodiode</strong> converts light pulses back to electrical digital pulses, a <strong>DAC</strong> (Digital-to-Analog Converter) reconstructs the continuous analog waveform, and a speaker turns that back into sound.</p>`+
 callout('','WHY DIGITAL WINS OVER LONG DISTANCES','An analog signal degrades a little at every amplifier &mdash; noise gets amplified right along with the signal, generation after generation. A digital signal only has to be distinguished as a 1 or a 0; a regenerator can detect a slightly noisy bit and re-transmit a perfectly clean new pulse, so noise never accumulates. Digital also multiplexes trivially &mdash; thousands of calls interleave as bits on one fiber, something far harder to do cleanly with continuous analog waveforms.')),
sec('Why convert at all — the four underlying reasons',
 `<ol>
  <li><strong>Distance</strong> &mdash; sound in air is inaudible past a few dozen meters; electricity, radio, and light can all cross continents or oceans.</li>
  <li><strong>Speed</strong> &mdash; electrical and optical signals travel at a meaningful fraction of light-speed; sound crawls at &asymp;343&nbsp;m/s.</li>
  <li><strong>Noise immunity &amp; regeneration</strong> &mdash; digital electrical/optical signals can be perfectly regenerated at every repeater; analog sound and analog electrical signals cannot.</li>
  <li><strong>Multiplexing &amp; scale</strong> &mdash; one fiber can carry millions of simultaneous digitized calls; one column of air can carry, in practice, one intelligible conversation.</li>
 </ol>`),
sec('An alternative path worth naming: VoIP',
 `<p>A modern alternative skips dedicated circuits entirely. In <strong>VoIP</strong> (Voice over IP &mdash; the mechanism behind WhatsApp calls, Zoom, and modern telephony backbones), the digitized audio samples are compressed and chopped into ordinary IP packets, sent over the general-purpose Internet exactly like any other data, and reassembled and played back in order (with a jitter buffer smoothing out arrival-time variation) at the far end. The sound&rarr;electrical&rarr;digital conversion chain is identical to Path 3 above &mdash; what\'s different is that, after digitization, the bits ride the same packet-switched Internet as a web page or an email, instead of a dedicated telephone circuit.</p>`),
sec('Who figured out each conversion',
 table(['Conversion','Person / team','Year'],[
  ['Sound &harr; electrical (telephone)','Alexander Graham Bell & Thomas Watson','1876'],
  ['Proof that EM waves exist','Heinrich Hertz','1887'],
  ['Electrical &harr; EM wave, practical distance','Guglielmo Marconi','1895&ndash;1901'],
  ['Analog &rarr; digital voice (PCM concept)','Alec Reeves','1937'],
  ['Practical low-loss optical fiber','Maurer, Keck & Schultz (Corning), building on Kao\'s 1966 theory','1966&ndash;1970'],
 ]))
]);

reg('hist-computers','H3','Computers Arrive, and Stay Isolated',
'The first electronic computers were room-sized, isolated islands. Getting more than one person to use one turned out to be a research problem in its own right &mdash; and Sputnik was about to make solving it a national priority.',
[
sec('1945 &mdash; the stored-program computer',
 `<p>Before the late 1940s, a "computer" was usually a person paid to calculate by hand, or a mechanical device like Hollerith\'s punched-card tabulators (first used for the 1890 U.S. census). Military and scientific problems &mdash; artillery firing tables, nuclear simulations &mdash; demanded speeds no human team or gear train could match. In 1945 <strong>John von Neumann</strong> circulated the <em>First Draft of a Report on the EDVAC</em>, describing the CPU/memory/control/I&#47;O architecture computing still uses today. <strong>ENIAC</strong> (1945&ndash;46, Eckert &amp; Mauchly), <strong>UNIVAC I</strong> (1951), and the <strong>IBM 701</strong> (1952) followed &mdash; giant, fragile, vacuum-tube machines costing millions of dollars, each an <strong>isolated electronic island</strong> with no way to talk to another.</p>
 ${hdiag('vonneumann','FIG. 4 — THE VON NEUMANN ARCHITECTURE','One shared memory for both instructions and data — the blueprint every computer on Earth still follows.')}`),
sec('The batch-processing bottleneck',
 flow(['Programmer writes code by hand on paper','Keypunch operator translates it into holes on cards','Card deck physically carried ("sneakernet") to the machine room','Computer runs the job, prints results, halts','Hours or days later, programmer collects a printout — often to find one typo'])+
 `<p>The core architectural question this exposed: if the machine holds valuable processing power, why must humans physically ferry data to it? Why can\'t users &mdash; and eventually other computers &mdash; reach it remotely, even simultaneously?</p>`),
sec('1960&ndash;63 &mdash; time-sharing and Licklider\'s vision',
 `<p><strong>Fernando Corbat&oacute;</strong> at MIT built <strong>CTSS</strong> (Compatible Time-Sharing System), first demonstrated in 1961 on an IBM 7090: slice the machine\'s execution time into millisecond intervals and rotate rapidly among connected users. Because human reaction time is glacial next to a computer\'s clock, each user experiences the illusion of having the whole machine to themselves.</p>
 ${hdiag('timesharing','FIG. 5 — TIME-SHARING','The scheduler rotates among terminals so fast each user believes they have the whole machine alone.')}
 <p>In <strong>March 1960</strong>, <strong>J.C.R. Licklider</strong> published <em>"Man-Computer Symbiosis"</em> in <em>IRE Transactions on Human Factors in Electronics</em>, arguing computers should be interactive partners extending human cognition &mdash; he estimated he spent roughly 85% of his own "thinking" time just getting into a position to think.</p>`+
 callout('warn','🔎 RESEARCH NOTE','A common transcription error dates this paper to "1860." It was published in <strong>March 1960</strong>.')+
 quote('&ldquo;A network of such [computer] centers, connected to one another by wide-band communication lines&hellip; the whole [system] might be less costly than the sum of the pieces.&rdquo; — Licklider, "Man-Computer Symbiosis," 1960')+
 `<p>Licklider extended the idea in an informal <strong>April 1963</strong> memo addressed to the "Members and Affiliates of the Intergalactic Computer Network" &mdash; a playful title covering a serious proposal to link ARPA-funded time-sharing computers together. To achieve symbiosis at scale, he argued, terminals needed to be networked across long distances.</p>`),
sec('1957&ndash;58 &mdash; Sputnik and the creation of ARPA',
 mythfact('Sputnik directly forced the Pentagon to build a bomb-proof Internet.','Sputnik triggered institutional panic over technological surprise. Eisenhower created ARPA to fund long-range, high-risk research broadly. Networking emerged later, as a resource-sharing solution developed by ARPA\'s computing office — not as a literal bomb-proof command network, which is a separate, more famous myth.')+
 tl([
   ['Oct 4, 1957','Sputnik 1 launched','The USSR put the first artificial satellite into orbit, proving it had rockets capable of reaching North America.'],
   ['Feb 7, 1958','ARPA created','DoD Directive 5105.15 establishes the Advanced Research Projects Agency to prevent future technological surprises by funding ambitious, high-risk research no single service branch would fund alone.'],
   ['1962','IPTO founded','ARPA creates the Information Processing Techniques Office to pursue advanced computing and command-and-control research; Licklider becomes its first director.'],
 ]))
]);

reg('hist-packet','H4','Packet Switching, Discovered Three Times',
'Before Larry Roberts could design a network, he needed to know how data should actually travel. The answer had no single inventor — it was independently conceived by three researchers solving three different problems.',
[
sec('Three parallel inventions',
 `<p>Telephone circuit switching locked an entire physical circuit for a call\'s duration &mdash; wasteful for computer traffic, which is inherently <strong>bursty</strong>: intense transmission followed by long silence.</p>`+
 table(['Researcher','Where','When','Contribution'],[
  ['Leonard Kleinrock','MIT (PhD), then UCLA','1961&ndash;1964','Applied queueing theory to digital communication, mathematically proving dynamic shared allocation beats dedicated circuits for bursty traffic (PhD thesis 1962; book <em>Communication Nets</em>, 1964)'],
  ['Paul Baran','RAND Corporation, Santa Monica','1960&ndash;1964','Designed a survivable, distributed mesh for military use: break messages into standardized blocks, tag them, and route dynamically ("hot-potato routing") so surviving nodes route around any destroyed node'],
  ['Donald Davies','National Physical Laboratory, UK','1965&ndash;1966','Working independently, converged on the same architecture for interactive multi-user computing; coined the term <strong>&ldquo;packet&rdquo;</strong>; NPL built a working single-node packet switch by 1968, among the earliest anywhere'],
 ])+
 hdiag('topologies','FIG. 6 — BARAN\'S THREE NETWORK TOPOLOGIES','A centralized network dies with its one hub. A distributed mesh survives node loss by routing around the gap — the flashing node shows a destroyed link being bypassed.')+
 `<p>When Larry Roberts designed ARPANET, he drew on Kleinrock\'s mathematics, Baran\'s survivability concepts, and Davies\' terminology &mdash; a genuine synthesis of three independent lines of work, not one person\'s invention.</p>`),
sec('1965 &mdash; the TX-2 / Q-32 experiment',
 `<p>Before committing real money to a national network, ARPA needed proof that two distant computers could exchange digital data directly. <strong>Thomas Marill</strong> and <strong>Lawrence Roberts</strong> linked the <strong>TX-2</strong> computer at MIT Lincoln Lab (Lexington, MA) to the <strong>AN/FSQ-32</strong> at System Development Corporation (Santa Monica, CA) over a leased, low-speed (&asymp;1200&nbsp;bps) dial-up phone line.</p>
 ${hdiag('txq32','FIG. 7 — THE 1965 EXPERIMENT','A noisy, slow, circuit-switched phone line — exactly the setup packet switching was designed to replace.')}
 <p>The two machines successfully exchanged messages &mdash; but the experiment also exposed exactly the flaws packet switching was designed to fix: circuit setup over the phone network cost precious seconds, line noise caused frequent errors, and both multi-million-dollar machines burned CPU cycles on handshaking instead of useful work. The lesson: circuit switching over voice-grade lines was too slow and too noisy for computer traffic. The network needed dedicated hardware, separate from the host computers, to handle routing and error management.</p>`)
]);

reg('hist-arpanet','H5','Building ARPANET',
'From a hostile room of university researchers to a UCLA teletype crashing on the letter "G" — how the first packet-switched network went from proposal to reality in under two years.',
[
sec('1966 &mdash; the three-terminal problem',
 `<p>By 1966, ARPA/IPTO director <strong>Bob Taylor</strong>\'s Pentagon office held three separate terminals, each dedicated to a different ARPA-funded time-sharing system: one to the <strong>SDC Q-32</strong> in Santa Monica, one to <strong>Project Genie at UC Berkeley</strong>, and one to <strong>Multics at MIT</strong>.</p>`+
 callout('warn','🔎 RESEARCH NOTE','A widely repeated version of this story names SRI\'s SDS&nbsp;940 as the second terminal. Taylor\'s own account describes it as <strong>Project Genie at UC Berkeley</strong> instead. SRI does appear later in this story &mdash; it became the ARPANET\'s <em>second node</em> in 1969 &mdash; but it was not one of these three original terminals.')+
 `<p>Taylor\'s question, as he later told it: <em>if I have three terminals in one room connecting to three separate machines, why can\'t we build one network that lets any terminal talk to any computer?</em> He took the idea to ARPA Director <strong>Charles Herzfeld</strong>; by Herzfeld\'s own account the conversation lasted roughly 20 minutes and ended with $1&nbsp;million redirected to start the project (Herzfeld later called the "20 minutes" a likely dramatization, while confirming the decision was fast and informal). Taylor recruited <strong>Larry Roberts</strong> from MIT Lincoln Lab as chief architect.</p>`),
sec('1967 &mdash; Wesley Clark\'s IMP idea',
 `<p>In April 1967, Roberts presented his draft plan to ARPA\'s principal investigators in Ann Arbor, Michigan &mdash; and met open hostility. Each researcher already ran a university computing center and none wanted to surrender 20&ndash;30% of their mainframe\'s power to handle routing on behalf of other institutions. During a taxi ride after the meeting, computer designer <strong>Wesley Clark</strong> proposed a clean separation: don\'t make host computers run the network &mdash; place a small, standardized minicomputer, an <strong>Interface Message Processor (IMP)</strong>, in front of every host to handle all routing, packetization, and switching. The host only needs a simple interface to its local IMP. The IMP is the direct conceptual ancestor of today\'s Internet router.</p>
 ${hdiag('impwiring','FIG. 8 — HOST + IMP','Each site keeps its own computer untouched — the IMP standing in front of it does all the packet work, host-to-host.')}`),
sec('1968&ndash;69 &mdash; BBN builds the network',
 `<p>ARPA issued a Request for Quotation to roughly 140 potential bidders to build four IMPs; IBM and Control Data Corporation declined to bid, reportedly skeptical packet switching would work at all. Twelve proposals came back; ARPA awarded the contract to <strong>Bolt Beranek and Newman (BBN)</strong>, a small Cambridge, MA consulting firm, in <strong>December 1968</strong>, with a contract start date of <strong>January 1, 1969</strong>.</p>`+
 callout('warn','🔎 RESEARCH NOTE','A specific award date of "December 24, 1968" circulates online but could not be verified in any primary source; sources consistently support "December 1968" as the award month with a January&nbsp;1,&nbsp;1969 start.')+
 `<p>BBN\'s team &mdash; <strong>Frank Heart</strong> (lead), <strong>Bob Kahn</strong> (communications theory), <strong>Severo Ornstein</strong> (hardware), <strong>Dave Walden, Will Crowther, Bernie Cosell</strong> (software, written in assembly), and <strong>Ben Barker</strong> &mdash; had well under a year to design hardware, write store-and-forward packet software from scratch, and ship working units to California. The IMP itself was a ruggedized <strong>Honeywell&nbsp;516</strong> minicomputer: roughly 5&nbsp;ft tall, 900&nbsp;lbs, 12,000 words (&asymp;24&nbsp;KB) of core memory, in heavy steel military-transport casing.</p>`),
sec('The four original nodes',
 table(['Node','Institution','Host machine','Lead researcher','Role'],[
  ['1','UCLA, Los Angeles','Sigma 7','Leonard Kleinrock','Network Measurement Center'],
  ['2','SRI, Menlo Park','SDS 940','Douglas Engelbart','Network Information Center'],
  ['3','UCSB, Santa Barbara','IBM 360/75','Glen Culler','Interactive graphics & waveform processing'],
  ['4','University of Utah, Salt Lake City','PDP-10','David Evans / Ivan Sutherland','3D computer graphics research'],
 ])+
 hdiag('fournodes','FIG. 9 — THE FOUR ORIGINAL NODES','The entire ARPANET, October 1969 — the glowing packet retraces the very first hop, UCLA to SRI.')),
sec('October 29, 1969 &mdash; "LO"',
 `<p>BBN delivered the first IMP to UCLA on <strong>September 2, 1969</strong>; a second reached SRI about a month later, linked by a 50&nbsp;kbps leased AT&amp;T line. At <strong>10:30&nbsp;p.m. on October 29, 1969</strong>, UCLA student <strong>Charley Kline</strong>, working under Kleinrock, tried to remote-login to SRI, where programmer <strong>Bill Duvall</strong> waited &mdash; confirming each letter by an ordinary voice phone line running alongside the data link.</p>`+
 mythfact('The first message was "LOGIN," which crashed after two letters, leaving "LO" as a poetic "Lo and behold!"','Kline attempted to type "LOGIN." The system crashed as he typed the third letter, \'G\' — leaving "LO" as the literal first transmission. A full login succeeded about an hour later.')+
 `<p>Kline typed \'L\'; Duvall confirmed by phone: "Got the L." Kline typed \'O\'; "Got the O." Kline typed \'G\' &mdash; and the SRI host crashed.</p>`+
 callout('warn','🔎 RESEARCH NOTE','The crash is often attributed to a vague "buffer overflow." The more precise cause: the SRI host software expected characters at roughly 10 per second (a typical human typing rate) but the link delivered them in a burst of roughly 5,000 characters per second, which the receiving system wasn\'t built to handle gracefully &mdash; a data-rate mismatch, though the practical effect (a crash) is the same.')+
 quote('The UCLA Network Measurement Center logbook for that night reads simply: &ldquo;22:30 Talked to SRI Host to Host.&rdquo;'))
]);

reg('hist-protocols','H6','From NCP to Email',
'Wiring computers together was only half the problem — the other half was getting the software on either end to agree on how to talk. That software layer is what turned a routing experiment into a communication medium.',
[
sec('1969&ndash;70 &mdash; the Network Working Group and NCP',
 `<p>An IMP only guarantees packet delivery &mdash; it says nothing about how host software should structure a conversation. Graduate students from the original node universities formed the <strong>Network Working Group</strong>, informally led by <strong>Steve Crocker</strong> of UCLA. On <strong>April 7, 1969</strong>, Crocker authored <strong>RFC&nbsp;1</strong>, "Host Software." He deliberately chose the humble title <strong>"Request for Comments"</strong> to avoid sounding like the group was dictating standards it had no authority to impose &mdash; that framing, inviting open critique rather than issuing decrees, became the enduring model for all Internet standardization, still used by the IETF today.</p>
 <p>By 1970 the group had completed the <strong>Network Control Protocol (NCP)</strong>, the first standardized host-to-host transport layer, enabling the first real network applications: <strong>Telnet</strong> (1971, remote terminal login) and <strong>FTP</strong> (1971, file transfer, RFC&nbsp;114/354).</p>`),
sec('October 1971 &mdash; Ray Tomlinson and @',
 `<p>Early-1970s "messaging" existed only within a single machine &mdash; one user leaving a text file for another user of the <em>same</em> computer. <strong>Ray Tomlinson</strong> at BBN combined a local message program (<strong>SNDMSG</strong>) with an experimental file-transfer program to route a message to a specific person on a <em>different</em> networked machine. He needed a delimiter separating username from destination host, and picked the little-used <strong>@</strong> symbol off his Teletype keyboard &mdash; it read naturally as "at" and was unlikely to appear in any legitimate username.</p>
 <p>Email transformed ARPANET almost overnight, from a system built to share scarce processing power into a genuine human communication medium; by the mid-1970s it made up an often-cited three-quarters of all ARPANET traffic.</p>
 ${hdiag('atsign','FIG. 10 — THE @ SYMBOL','Tomlinson\'s insight: one delimiter separates "who" from "where" — still every email address on Earth.')}`),
sec('The network-of-networks problem',
 `<p>By 1973, ARPANET was a clear success, and ARPA began funding two new experimental packet networks on entirely different physical media: <strong>PRNET</strong> (mobile packet radio, with SRI) and <strong>SATNET</strong> (satellite links to Europe via Intelsat&nbsp;IV). NCP had been designed assuming ARPANET\'s reliable, terrestrial infrastructure &mdash; it could not bridge to PRNET or SATNET, whose packet sizes, timing, and error rates were all incompatible. The question this forced: how do you connect fundamentally different networks together without forcing each one to rebuild its internals?</p>
 ${hdiag('threenets','FIG. 11 — THREE INCOMPATIBLE NETWORKS','ARPANET, PRNET, and SATNET each worked fine alone — none could natively talk to the others.')}`)
]);

reg('hist-tcpip','H7','TCP/IP and the Internet Unifies',
'The answer to "how do dissimilar networks interoperate" turned out to require a completely new layer of architecture — and a hard, single-day cutover that, for many people, is the closest thing to an Internet birthday.',
[
sec('1973&ndash;74 &mdash; Kahn, Cerf, and the end-to-end principle',
 `<p><strong>Bob Kahn</strong> (now at ARPA) and <strong>Vint Cerf</strong> (Stanford) set out in 1973 to solve internetworking. Their governing principle: don\'t assume the underlying network is reliable; put intelligence at the <strong>end nodes</strong>, not inside the network itself; use simple intermediate "gateways" (routers) to pass raw datagrams across network boundaries. In <strong>May 1974</strong> they published <em>"A Protocol for Packet Network Intercommunication"</em> in <em>IEEE Transactions on Communications</em>, defining a master protocol they called the Transmission Control Program.</p>
 ${hdiag('gateway','FIG. 12 — THE GATEWAY IDEA','A simple router sits between two dissimilar networks, re-encapsulating packets so neither side has to change.')}`),
sec('1978 &mdash; splitting TCP and IP',
 `<p>Originally, TCP handled both reliable delivery and routing in one layer. By 1978, Cerf, Kahn, and <strong>Jon Postel</strong> recognized this coupling as a mistake: real-time applications (like early experimental voice traffic) needed fast, loss-tolerant transmission, not TCP\'s insistence on retransmitting every dropped packet. They split the design in two &mdash; <strong>TCP</strong> (connection-oriented, guaranteed delivery, ordering, flow control) sitting above <strong>IP</strong> (connectionless, best-effort routing across boundaries using global addresses) &mdash; the two-layer architecture the Internet still runs on.</p>
 ${hdiag('tcpiplayers','FIG. 13 — THE TWO-LAYER SPLIT','TCP owns reliability; IP owns addressing and routing. Every packet on the Internet still descends through exactly this stack.')}`),
sec('January 1, 1983 &mdash; Flag Day',
 mythfact('The Internet was "invented" on January 1, 1983.','January 1, 1983 was an operational transition date: existing hosts switched off NCP and standardized on TCP/IP, which had already existed and been tested for years. It marks the technical unification point, not the invention.')+
 `<p>Through the late 1970s, NCP and TCP/IP coexisted. As more heterogeneous networks connected, keeping NCP alive became a growing liability. The Department of Defense set a hard cutover: <strong>January 1, 1983</strong>, "Flag Day" &mdash; NCP was permanently disabled across every ARPANET node simultaneously, and every host had to be running TCP/IP by that date or lose connectivity entirely.</p>`),
sec('1985&ndash;90 &mdash; NSFNET and DNS',
 `<p>By the mid-1980s, ARPANET access remained largely limited to military contractors and DOD-funded CS departments. In 1985, the <strong>National Science Foundation</strong>, under director <strong>Erich Bloch</strong>, funded five new supercomputing centers; to connect universities to them, NSF built the <strong>NSFNET</strong> backbone starting in <strong>1986</strong> (56&nbsp;kbps initially, T1/1.544&nbsp;Mbps by 1988, T3/45&nbsp;Mbps by 1991). As NSFNET absorbed ARPANET\'s traffic and purpose, ARPANET was formally decommissioned on <strong>February 28, 1990</strong>.</p>
 <p>Meanwhile, every host still had only a numerical address, translated to names via a single flat file, <strong>HOSTS.TXT</strong>, centrally maintained by SRI-NIC under <strong>Jon Postel</strong>. By the early 1980s the FTP traffic to redistribute that file was unsustainable and name collisions were routine. In <strong>1983</strong>, <strong>Paul Mockapetris</strong> designed the <strong>Domain Name System</strong>: a distributed, hierarchical database delegating authority downward, zone by zone (root &rarr; <code>.com</code> &rarr; <code>example.com</code> &rarr; <code>www</code>) &mdash; still the naming architecture the Internet runs on.</p>
 ${hdiag('dnstree','FIG. 14 — DNS REPLACES HOSTS.TXT','A single hand-edited flat file becomes a delegated, distributed tree — no central bottleneck, infinitely extensible.')}`)
]);

reg('hist-web','H8','Tim Berners-Lee and the World Wide Web',
'By 1989 the Internet already connected hundreds of thousands of computers. Finding anything on it meant knowing an exact server address and navigating command-line directories by hand. The Web solved discovery, not connectivity.',
[
sec('Internet vs. Web',
 `<p>The Internet is the underlying physical and logical infrastructure &mdash; cables, routers, IP addresses, TCP, DNS, BGP. The <strong>World Wide Web</strong> is an application built on top of it: hypertext documents linked together via HTTP and URLs. Conflating the two is the single most common piece of networking terminology confusion, then and now.</p>
 ${hdiag('webstack','FIG. 15 — INTERNET VS. WEB','The Web is one application riding on top of the Internet — not a synonym for it.')}`),
sec('March 1989 &mdash; the CERN proposal',
 `<p>At CERN, the European particle physics laboratory near Geneva, thousands of visiting physicists arrived, ran experiments, and left again using incompatible systems (Unix, VAX, NeXT, IBM) and incompatible document formats &mdash; institutional knowledge kept getting lost in software silos. In <strong>March 1989</strong>, British contractor <strong>Tim Berners-Lee</strong> circulated <em>"Information Management: A Proposal."</em> His supervisor <strong>Mike Sendall</strong> wrote across the cover: <em>"Vague but exciting&hellip;"</em> and gave him informal latitude to buy a NeXT workstation and start building &mdash; a quote and attribution confirmed across CERN\'s own archives.</p>
 <p>The proposal contained three inventions that, together, became the Web: the <strong>URL</strong> (a global address system for documents), <strong>HTTP</strong> (a simple protocol to fetch them), and <strong>HTML</strong> (a formatting language with links).</p>
 ${hdiag('webflow','FIG. 16 — THE FIRST WEB REQUEST','A browser asks a server for a document by name, and gets hypertext back — the request/response pattern every web page still uses.')}`),
sec('1990&ndash;91 &mdash; the first server and browser',
 `<p>Working through 1990 with Belgian engineer <strong>Robert Cailliau</strong>, Berners-Lee built the first web server (<code>httpd</code>) and the first browser/editor, <strong>WorldWideWeb</strong> (a name landed on after rejecting alternatives like "Mesh" and "The Information Mine"), both running on a NeXTstation in his office. To stop colleagues from unplugging the machine quietly hosting the entire nascent Web, he taped a handwritten red-ink label to its casing: <em>"This machine is a server. DO NOT POWER IT DOWN!!"</em></p>`+
 callout('warn','🔎 RESEARCH NOTE','Sources differ on exactly when "the Web went live." The server and browser existed and worked internally by December 1990. Most historical accounts, including CERN\'s own retrospectives, treat <strong>1991</strong> &mdash; particularly the August 1991 public announcement on the alt.hypertext newsgroup &mdash; as when the Web became accessible beyond Berners-Lee\'s immediate collaborators. Both framings are defensible.')),
sec('1993 &mdash; CERN gives it away, and Mosaic makes it visual',
 `<p>On <strong>April 30, 1993</strong>, CERN placed the Web\'s underlying software into the <strong>public domain</strong>, royalty-free, for anyone to use, modify, or sell without restriction. Had CERN licensed it commercially instead, competing closed networks &mdash; CompuServe, AOL, France\'s Minitel &mdash; might well have persisted as permanent walled gardens.</p>
 <p>That same year, <strong>Marc Andreessen</strong> and <strong>Eric Bina</strong> at NCSA, University of Illinois, released <strong>NCSA Mosaic</strong>: the first browser to render images inline with text and ship with simple Windows/Mac installers, turning the Web from a text-only research tool into something a general audience could use. In 1994 Andreessen co-founded <strong>Netscape Communications</strong>, whose Navigator browser triggered the Web\'s first wave of mass adoption.</p>`)
]);

reg('hist-dynamicweb','H9','From Static Pages to Web 2.0',
'The earliest Web was read-only: a server held fixed files and streamed them unchanged to every visitor. Making it interactive took three separate inventions — none of which took longer than a few years, one of which took ten days.',
[
sec('1993 &mdash; CGI and server-side scripting',
 `<p>Static HTML could not power shopping carts, logins, or anything backed by a live database. <strong>CGI</strong> (Common Gateway Interface, 1993) let a web server launch an external program in response to a request, which could process form input and print a fresh HTML response. CGI\'s per-request overhead was heavy, so <strong>PHP</strong> (1995), Microsoft\'s <strong>ASP</strong> (1996), and <strong>Java Servlets/JSP</strong> (1997) folded application logic into long-running server processes instead.</p>`),
sec('May 1995 &mdash; JavaScript, in about 10 days',
 `<p>Netscape hired <strong>Brendan Eich</strong> to embed a scripting language into Navigator so ordinary page authors could validate forms and animate elements without a full server round-trip. Eich designed and implemented the first working prototype &mdash; initially <strong>Mocha</strong>, briefly <strong>LiveScript</strong>, finally marketed as <strong>JavaScript</strong> for commercial synergy with the unrelated Java language &mdash; in roughly <strong>10 days</strong>.</p>`),
sec('1994&ndash;96 &mdash; CSS separates structure from style',
 `<p>As the Web grew, HTML pages filled with inline presentational clutter (<code>&lt;font color="red"&gt;</code>, <code>&lt;center&gt;</code>). In 1994, <strong>H&aring;kon Wium Lie</strong> (at CERN, later W3C), working with <strong>Bert Bos</strong>, proposed <strong>Cascading Style Sheets</strong>, formalizing a clean separation of structure (HTML), presentation (CSS), and behavior (JavaScript) that browsers widely adopted through the late 1990s.</p>
 ${hdiag('triad','FIG. 17 — THREE CLEAN LAYERS','Structure, presentation, and behavior finally became independently editable — a huge maintainability win at Web scale.')}`),
sec('2005 &mdash; AJAX and "Web 2.0"',
 `<p>In the early 2000s, clicking almost any button forced the browser to discard the current page and render an entirely new one &mdash; even for a single-word change. Microsoft introduced the underlying mechanism (<code>IXMLHTTPRequest</code>) for Outlook Web Access in 1999; it slowly spread to other browsers. In <strong>2005</strong>, developer <strong>Jesse James Garrett</strong> coined the term <strong>AJAX</strong> (Asynchronous JavaScript and XML), naming a pattern that let JavaScript fetch data in the background and update the page in place. Gmail (2004) and Google Maps (2005) demonstrated that a browser could deliver rich, desktop-quality interaction &mdash; ushering in the era commonly labeled "Web 2.0."</p>
 ${hdiag('ajax','FIG. 18 — FULL RELOAD VS. AJAX','Instead of rebuilding an entire page for one small change, JavaScript fetches just the data and patches the DOM in place.')}`)
]);

reg('hist-scale','H10','Scaling the Web — CDNs, Cloud, and Modern HTTP',
'A single server in one city cannot serve a billion global users. The last two decades of networking history are largely the story of pushing computation and caching physically closer to people, and re-engineering HTTP itself for a mobile, encrypted, latency-sensitive world.',
[
sec('1998 &mdash; Content Delivery Networks',
 `<p>Light in fiber travels slower than in a vacuum, and a round trip across the Atlantic still costs tens of milliseconds under ideal conditions; a sudden traffic spike could overwhelm a single-origin server entirely. In 1998, MIT mathematician <strong>Tom Leighton</strong> and graduate student <strong>Danny Lewin</strong> founded <strong>Akamai</strong>, commercializing research on efficiently routing traffic across distributed networks &mdash; pioneering the modern CDN: many edge servers worldwide, with DNS-based or Anycast routing steering each user to the nearest one.</p>`),
sec('2006 &mdash; cloud computing',
 `<p>Launching a scalable internet company in the 1990s meant buying physical racks, signing colocation leases, and provisioning for peak load used only a few days a year. In 2006, Amazon launched <strong>AWS</strong>, introducing <strong>S3</strong> (March 2006) and <strong>EC2</strong> (beta, August 2006) &mdash; drawing on internal infrastructure work led by engineer <strong>Chris Pinkham</strong>. Cloud computing made infrastructure fully software-definable: a developer could go from one server to thousands of virtual instances in minutes, paying only for what was used.</p>
 ${hdiag('cdn','FIG. 19 — THE CDN MODEL','Instead of every user reaching one distant origin, cached copies sit at edge nodes close to them — the glowing path shows a local user hitting their nearest edge.')}`),
sec('HTTP grows up: 1.0 &rarr; 2 &rarr; 3',
 table(['Version','Year','Breakthrough','Remaining problem'],[
  ['HTTP/0.9','1991','Raw text protocol: one socket, one HTML response, close','No headers, no status codes'],
  ['HTTP/1.0','1996','Headers, status codes, POST, content types','New TCP connection per request'],
  ['HTTP/1.1','1997','Persistent ("keep-alive") connections reuse one socket','Head-of-line blocking: request 2 waits on request 1'],
  ['HTTP/2','2015 (RFC 7540, from Google\'s SPDY)','Binary framing, multiplexed streams over one TCP connection','TCP-level HOL blocking persists — one lost packet stalls every stream'],
  ['HTTP/3','2022 (RFC 9114)','Built on QUIC/UDP — near-zero-RTT handshakes, TLS 1.3 by default, true per-stream isolation','—'],
 ])+
 hdiag('httpgen','FIG. 20 — HTTP\'S THREE GENERATIONS','Serial requests, then multiplexed streams over one TCP connection, then fully isolated streams over QUIC — each generation removes one more layer of waiting.')),
sec('Security catches up to an open network',
 `<p>The original ARPANET was a high-trust academic network &mdash; nearly everyone on it knew everyone else, so security was barely a design consideration. As the network went public, that assumption collapsed. <strong>Taher Elgamal</strong> at Netscape led development of <strong>SSL</strong> in 1994&ndash;95, which evolved into <strong>TLS</strong>; rising awareness of public Wi-Fi sniffing pushed the 2010s Web toward mandatory HTTPS, and <strong>Let\'s Encrypt</strong> (2015) made certificates free and automated, removing the last major adoption barrier.</p>`)
]);

[

sec('The technology relay chain',
 flow(['Optical semaphore (1794) — distance limited by transport speed','Electric telegraph (1844) — needed line-of-sight & daylight','Telephone & circuit switching (1876–92) — coded messages too slow for voice','Time-sharing (1961) — batch computing wasted time, blocked interactivity','Packet-switching theory (1960–66) — circuits waste capacity on bursty data','ARPANET & the IMP (1969) — no purpose-built computer network existed','NCP & email (1971) — hosts needed a shared protocol to cooperate','TCP/IP (1974–83) — dissimilar networks couldn\'t interoperate','DNS & NSFNET (1983–86) — HOSTS.TXT couldn\'t scale','World Wide Web (1989–93) — no shared hypertext system existed','Dynamic Web & JavaScript (1993–95) — static pages couldn\'t process data','AJAX, CDNs, Cloud (2000s) — full reloads, single origins, fixed hardware','HTTP/3 & modern edge infrastructure (today) — connection overhead & head-of-line blocking'])),
sec('Epilogue — from "LO" to billions of devices',
 `<p>When Charley Kline typed "L" and "O" on a noisy teletype at UCLA at 10:30&nbsp;p.m. on October 29, 1969, he was simply trying to log into a machine 350 miles away. He had no vision of social networks, mobile video, or planet-scale AI infrastructure &mdash; he just wanted to run a program without physically traveling to Menlo Park.</p>
 <p>This history is not a story of isolated genius or single miraculous breakthroughs. It\'s a continuous, cumulative chain of people solving the physical limitation directly in front of them &mdash; the weather-dependence of optical towers, the locked circuits of telephone switchboards, the CPU overhead of mainframe hosts &mdash; each time asking a version of the same question: <em>how can information move faster, more reliably, and more efficiently, with fewer physical barriers in the way?</em> By replacing dedicated physical paths with dynamic software packets, separating infrastructure into clean layers, and insisting &mdash; repeatedly, and not always without a fight &mdash; on open, royalty-free standards, humanity built the largest and most complex engineered system in its history.</p>`)
]);

function buildSidebar(filter){
  const wrap = document.getElementById('sbGroups');
  wrap.innerHTML='';
  const f = (filter||'').toLowerCase();
  GROUPS.forEach((grp,gi)=>{
    const items = grp.items.filter(id=>{
      if(!f) return true;
      const c = CH[id]; if(!c) return false;
      return (c.title.toLowerCase().includes(f) || c.lede.toLowerCase().includes(f));
    });
    if(f && items.length===0) return;
    const gEl = document.createElement('div');
    gEl.className='sb-group'; gEl.dataset.gi=gi;
    gEl.innerHTML = `<div class="sb-group-head">${svgIcons.chevron}<span>${grp.g}</span></div><div class="sb-items"></div>`;
    const itemsEl = gEl.querySelector('.sb-items');
    items.forEach(id=>{
      const c = CH[id]; if(!c) return;
      const el = document.createElement('div');
      el.className='sb-item'+(STATE.done[id]?' done':'')+(STATE.bookmarks[id]?' bookmarked':'')+(id===currentChapter?' active':'');
      el.dataset.id = id;
      el.innerHTML = `<span class="num">${c.num}</span><span>${c.title}</span><svg class="bmk" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>`;
      el.addEventListener('click',()=>navigate(id));
      itemsEl.appendChild(el);
    });
    gEl.querySelector('.sb-group-head').addEventListener('click',()=>{ gEl.classList.toggle('collapsed'); });
    wrap.appendChild(gEl);
  });
  updateSidebarProgress();
}
function updateSidebarProgress(){

function drawHeroStream(){

  nodes.forEach((x,i)=>{ s+=`<circle class="node-dot" cx="${x}" cy="32" r="9"/>`; if(i<nodes.length-1) s+=`<line class="hop-line" x1="${x+9}" y1="32" x2="${nodes[i+1]-9}" y2="32"/>`; });
  svg.innerHTML = s;
  const pkts=[{l:'SYN',c:''},{l:'DNS',c:'alt'},{l:'TLS',c:''},{l:'ACK',c:'alt'}];

    const p = pkts[pi%pkts.length]; pi++;

    g.innerHTML = `<rect class="pkt-box ${p.c}" x="0" y="22" width="30" height="16" rx="2"/><text class="pkt" x="15" y="33" text-anchor="middle">${p.l}</text>`;
    g.setAttribute('transform','translate(45,0)');
    svg.appendChild(g);
    let t=0; const dur=4200; const start=performance.now();
    function step(now){
      t = now-start; const prog = Math.min(t/dur,1);
      g.setAttribute('transform',`translate(${45+prog*770},0)`);
      if(prog<1) requestAnimationFrame(step); else g.remove();
    }
    requestAnimationFrame(step);
  }
  spawn();
  const iv = setInterval(spawn, 1300);
  window.__streamIv && clearInterval(window.__streamIv); window.__streamIv = iv;
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svgRoot(vb, h){ const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox',vb); if(h) s.style.maxHeight=h+'px'; return s; }
function svgTag(tag, attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function svgNode(svg, cx, cy, r, label, sub, cls){
  const g = svgTag('g',{});
  g.appendChild(svgTag('circle',{cx,cy,r,class:'hd-node-circle '+(cls||'')}));
  if(label){ const t=svgTag('text',{x:cx,y:cy+3.5,'text-anchor':'middle',class:'hd-node-label'}); t.textContent=label; g.appendChild(t); }
  if(sub){ const t2=svgTag('text',{x:cx,y:cy+r+11,'text-anchor':'middle',class:'hd-node-sub'}); t2.textContent=sub; g.appendChild(t2); }
  svg.appendChild(g);
  return g;
}
function svgEdge(svg, x1,y1,x2,y2, cls){ const l=svgTag('line',{x1,y1,x2,y2,class:'hd-edge '+(cls||'')}); svg.insertBefore(l, svg.firstChild); return l; }
function svgBox(svg, x,y,w,h,label,sub,cls){
  const g=svgTag('g',{});
  g.appendChild(svgTag('rect',{x,y,width:w,height:h,rx:3,class:'hd-box '+(cls||'')}));
  if(label){ const t=svgTag('text',{x:x+w/2,y:y+h/2+(sub?-2:3.5),'text-anchor':'middle',class:'hd-node-label'}); t.textContent=label; g.appendChild(t); }
  if(sub){ const t2=svgTag('text',{x:x+w/2,y:y+h/2+11,'text-anchor':'middle',class:'hd-node-sub'}); t2.textContent=sub; g.appendChild(t2); }
  svg.appendChild(g);
  return g;
}
function svgArrow(svg,x1,y1,x2,y2,cls){
  svgEdge(svg,x1,y1,x2,y2,cls);
  const ang = Math.atan2(y2-y1,x2-x1);
  const ah = 5;
  const p1 = [x2-ah*Math.cos(ang-0.4), y2-ah*Math.sin(ang-0.4)];
  const p2 = [x2-ah*Math.cos(ang+0.4), y2-ah*Math.sin(ang+0.4)];
  svg.appendChild(svgTag('polygon',{points:`${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}`, class:'hd-edge '+(cls||''), style:'fill:currentColor;stroke:none;color:var(--text-faint)'}));
}
/** Animate a small dot along a polyline path of [x,y] points, looping. */
function animateDot(svg, points, opts){
  opts = opts||{};
  const dot = svgTag('circle',{r:opts.r||5, class:'hd-dot-move'});
  const label = opts.label!==undefined ? svgTag('text',{class:'hd-node-label', 'text-anchor':'middle', y:-9}) : null;
  const g = svgTag('g',{}); g.appendChild(dot); if(label){ label.textContent=opts.label; g.appendChild(label); }
  svg.appendChild(g);
  const segLen = []; let total=0;
  for(let i=0;i<points.length-1;i++){ const d=Math.hypot(points[i+1][0]-points[i][0], points[i+1][1]-points[i][1]); segLen.push(d); total+=d; }
  const dur = opts.duration || 2600;
  const delay = opts.delay || 0;
  const loopGap = opts.loopGap!==undefined? opts.loopGap : 700;
  let raf;
  function frame(now){
    const t = ((now - startTime - delay) % (dur+loopGap));
    if(t<0){ raf=requestAnimationFrame(frame); return; }
    const prog = Math.min(t/dur, 1);
    if(t<=dur){
      g.style.display='';
      let d = prog*total, i=0;
      while(i<segLen.length-1 && d>segLen[i]){ d-=segLen[i]; i++; }
      const segP = segLen[i]? d/segLen[i] : 0;
      const x = points[i][0] + (points[i+1][0]-points[i][0])*segP;
      const y = points[i][1] + (points[i+1][1]-points[i][1])*segP;
      dot.setAttribute('cx',x); dot.setAttribute('cy',y);
      if(label){ label.setAttribute('x',x); label.setAttribute('y',y-9); }
    } else { g.style.display='none'; }
    raf = requestAnimationFrame(frame);
  }
  const startTime = performance.now();
  raf = requestAnimationFrame(frame);
  return ()=>cancelAnimationFrame(raf);
}

/* ---- wave-conversion chain diagrams (History — "How a Voice Becomes a Signal") ---- */
function waveChainDiagram(el, stages){
  const boxW = 108, gap = 130;
  const w = 40 + stages.length*gap;
  const svg = svgRoot(`0 0 ${w} 160`,160); el.appendChild(svg);
  const y = 66;
  const xs = stages.map((s,i)=> 40 + boxW/2 + i*gap);
  for(let i=0;i<stages.length-1;i++) svgArrow(svg, xs[i]+boxW/2, y, xs[i+1]-boxW/2-6, y);
  stages.forEach((s,i)=>{ svgBox(svg, xs[i]-boxW/2, y-26, boxW, 52, s.label, s.sub, s.acc?'acc':''); });
  animateDot(svg, xs.map(x=>[x,y]), {duration: Math.max(1800, stages.length*450), loopGap:900, r:4});
}

/* --- Subnet calculator --- */
function ipToInt(ip){ const p=ip.split('.').map(Number); if(p.length!==4||p.some(x=>isNaN(x)||x<0||x>255)) return null; return ((p[0]<<24)>>>0)+(p[1]<<16)+(p[2]<<8)+p[3]; }
function intToIp(n){ return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.'); }
function intToBin(n){ return (n>>>0).toString(2).padStart(32,'0').match(/.{8}/g).join('.'); }
TOOLS.subnet = function(){
  const el = document.getElementById('tool-subnet'); if(!el) return;
  el.innerHTML = `<div class="tool">
    <div class="tool-head"><span class="ic">&#9679;</span><h3>IPv4 SUBNET CALCULATOR</h3></div>
    <div class="field-row">
      <div class="field"><label>IP Address</label><input id="snIp" value="192.168.10.130"></div>
      <div class="field"><label>Prefix (/n)</label><input id="snPrefix" type="number" min="0" max="32" value="26"></div>
    </div>
    <div class="out-grid" id="snOut"></div>
  </div>`;
  function calc(){
    const ip = ipToInt(document.getElementById('snIp').value.trim());
    let prefix = parseInt(document.getElementById('snPrefix').value,10);
    const out = document.getElementById('snOut');
    if(ip===null || isNaN(prefix) || prefix<0 || prefix>32){ out.innerHTML=`<div class="out-cell"><div class="k">Error</div><div class="v" style="color:var(--danger)">Enter a valid IPv4 + prefix</div></div>`; return; }
    const maskInt = prefix===0? 0 : (0xFFFFFFFF << (32-prefix))>>>0;
    const network = (ip & maskInt)>>>0;
    const broadcast = (network | (~maskInt>>>0))>>>0;
    const hostsTotal = Math.pow(2,32-prefix);
    const usable = prefix>=31? hostsTotal : Math.max(hostsTotal-2,0);
    const first = prefix>=31? network : (network+1)>>>0;
    const last = prefix>=31? broadcast : (broadcast-1)>>>0;
    const nextSubnet = (network + hostsTotal)>>>0;
    const wildcard = (~maskInt)>>>0;
    out.innerHTML = `
     <div class="out-cell"><div class="k">Network</div><div class="v">${intToIp(network)}</div></div>
     <div class="out-cell"><div class="k">Broadcast</div><div class="v">${intToIp(broadcast)}</div></div>
     <div class="out-cell"><div class="k">Subnet mask</div><div class="v">${intToIp(maskInt)}</div></div>
     <div class="out-cell"><div class="k">Wildcard mask</div><div class="v">${intToIp(wildcard)}</div></div>
     <div class="out-cell"><div class="k">First usable host</div><div class="v">${intToIp(first)}</div></div>
     <div class="out-cell"><div class="k">Last usable host</div><div class="v">${intToIp(last)}</div></div>
     <div class="out-cell"><div class="k">Usable hosts</div><div class="v">${usable.toLocaleString()}</div></div>
     <div class="out-cell"><div class="k">Next subnet</div><div class="v">${intToIp(nextSubnet)}</div></div>
     <div class="out-cell" style="grid-column:1/-1"><div class="k">Binary (network)</div><div class="v">${intToBin(network)}</div></div>
     <div class="out-cell" style="grid-column:1/-1"><div class="k">Binary (mask)</div><div class="v">${intToBin(maskInt)}</div></div>`;
  }
  ['snIp','snPrefix'].forEach(id=>document.getElementById(id).addEventListener('input',calc));
  calc();
};

TOOLS.switchlearn = function(){
  const el = document.getElementById('tool-switchlearn'); if(!el) return;
  const devices = [{n:'PC-A',m:'AA:11'},{n:'PC-B',m:'BB:22'},{n:'PC-C',m:'CC:33'},{n:'PC-D',m:'DD:44'}];
  el.innerHTML = `<div class="tool">
    <div class="tool-head"><span class="ic">&#9679;</span><h3>LEARNING SWITCH SIMULATOR</h3></div>
    <p style="margin-bottom:10px">Pick a sender and receiver; watch the switch's MAC table learn and forward.</p>
    <div class="field-row">
      <div class="field"><label>From</label><select id="lsFrom">${devices.map((d,i)=>`<option value="${i}">${d.n} (${d.m})</option>`).join('')}</select></div>
      <div class="field"><label>To</label><select id="lsTo">${devices.map((d,i)=>`<option value="${i}" ${i===1?'selected':''}>${d.n} (${d.m})</option>`).join('')}</select></div>
      <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn primary sm" id="lsSend">Send frame</button></div>
    </div>
    <div class="out-grid" id="lsTable"></div>
    <div class="sim-log" id="lsLog"></div>
  </div>`;
  let table = {};
  function renderTable(){
    const cells = Object.keys(table).length? Object.entries(table).map(([m,p])=>`<div class="out-cell"><div class="k">${m}</div><div class="v">Port ${p}</div></div>`).join('') : `<div class="out-cell"><div class="k">MAC table</div><div class="v" style="color:var(--text-faint)">empty</div></div>`;
    document.getElementById('lsTable').innerHTML = cells;
  }
  function log(msg){ const l=document.getElementById('lsLog'); const d=document.createElement('div'); d.innerHTML=`<span class="t">&gt;</span>${msg}`; l.appendChild(d); l.scrollTop=l.scrollHeight; }
  document.getElementById('lsSend').addEventListener('click',()=>{
    const from = devices[document.getElementById('lsFrom').value];
    const to = devices[document.getElementById('lsTo').value];
    if(from===to){ log('Source and destination are the same device.'); return; }
    const fromPort = devices.indexOf(from)+1, toPort = devices.indexOf(to)+1;
    table[from.m] = fromPort; renderTable();
    log(`Frame arrives on port ${fromPort} from ${from.n} (${from.m}) &rarr; learned.`);
    if(table[to.m]){ log(`${to.m} found in table &rarr; forwarding out port ${table[to.m]} only (filtering).`); }
    else{ log(`${to.m} not yet in table &rarr; flooding out all ports except ${fromPort}.`); }
  });
  renderTable();
};

/* --- TCP congestion window simulator --- */
TOOLS.tcpsim = function(){
  const el = document.getElementById('tool-tcpsim'); if(!el) return;
  el.innerHTML = `<div class="tool">
    <div class="tool-head"><span class="ic">&#9679;</span><h3>TCP CONGESTION WINDOW SIMULATOR</h3></div>
    <div class="field-row">
      <div class="field"><label>Algorithm</label><select id="tcAlgo"><option>Tahoe</option><option>Reno</option><option selected>CUBIC (simplified)</option></select></div>
      <div class="field"><label>Loss at RTT #</label><input id="tcLoss" type="number" value="12" min="0"></div>
      <div class="field"><label>ssthresh (initial)</label><input id="tcSsthresh" type="number" value="32"></div>
      <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn primary sm" id="tcRun">Run simulation</button></div>
    </div>
    <canvas id="tcCanvas" height="220"></canvas>
    <p style="margin-top:8px;font-size:12px;color:var(--text-faint)">Green = congestion window (cwnd) in MSS segments. Amber dashed = ssthresh. X-axis = RTT rounds.</p>
  </div>`;
  function run(){
    const algo = document.getElementById('tcAlgo').value;
    const lossRTT = parseInt(document.getElementById('tcLoss').value)||9999;
    let ssthresh = parseFloat(document.getElementById('tcSsthresh').value)||32;
    const N = 40;
    let cwnd = 1; const series=[]; const ssthreshSeries=[];
    let mode='slowstart';
    for(let t=0;t<N;t++){
      series.push(cwnd); ssthreshSeries.push(ssthresh);
      const lossNow = (t===lossRTT || (algo!=='Tahoe' && lossRTT<N && t>lossRTT && (t-lossRTT)%14===0));
      if(lossNow){
        ssthresh = Math.max(cwnd/2,2);
        if(algo==='Tahoe'){ cwnd=1; mode='slowstart'; }
        else{ cwnd=ssthresh; mode='avoid'; }
        continue;
      }
      if(mode==='slowstart'){ cwnd*=2; if(cwnd>=ssthresh){ cwnd=ssthresh; mode='avoid'; } }
      else{ cwnd += (algo==='CUBIC (simplified)')? 1.6 : 1; }
      cwnd = Math.min(cwnd, 200);
    }
    drawSeries(series, ssthreshSeries);
  }
  function drawSeries(series, ssSeries){
    const cv = document.getElementById('tcCanvas'); const ctx = cv.getContext('2d');
    const w = cv.clientWidth||600; cv.width=w; cv.height=220;
    ctx.clearRect(0,0,w,220);
    const maxY = Math.max(...series, ...ssSeries, 10)*1.15;
    const padL=36,padB=20,padT=10;
    const xs = (i)=> padL + i*((w-padL-10)/(series.length-1));
    const ys = (v)=> padT + (1-(v/maxY))*(220-padT-padB);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border'); ctx.lineWidth=1;
    for(let g=0;g<=4;g++){ const y = padT + g*(220-padT-padB)/4; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-10,y); ctx.stroke();
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-faint'); ctx.font='10px JetBrains Mono';
      ctx.fillText(Math.round(maxY*(1-g/4)), 2, y+3); }
    ctx.strokeStyle = '#F5B942'; ctx.setLineDash([4,3]); ctx.beginPath();
    ssSeries.forEach((v,i)=>{ const x=xs(i),y=ys(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#3DDC97'; ctx.lineWidth=2; ctx.beginPath();
    series.forEach((v,i)=>{ const x=xs(i),y=ys(v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
    ctx.fillStyle='#3DDC97';
    series.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(xs(i),ys(v),1.6,0,7); ctx.fill(); });
  }
  document.getElementById('tcRun').addEventListener('click',run);
  run();
};

TOOLS.dnssim = function(){
  const el = document.getElementById('tool-dnssim'); if(!el) return;
  el.innerHTML = `<div class="tool">
    <div class="tool-head"><span class="ic">&#9679;</span><h3>DNS RESOLUTION SIMULATOR</h3></div>
    <div class="field-row">
      <div class="field"><label>Domain</label><input id="dnsDomain" value="www.example.com"></div>
      <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn primary sm" id="dnsRun">Resolve</button></div>
      <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn sm" id="dnsRunCached">Resolve (cached)</button></div>
    </div>
    <div class="sim-log" id="dnsLog" style="max-height:220px"></div>
  </div>`;
  function log(id,msg,delay){ return new Promise(res=>setTimeout(()=>{ const l=document.getElementById(id); const d=document.createElement('div'); d.innerHTML=`<span class="t">t+${delay}ms</span>${msg}`; l.appendChild(d); l.scrollTop=l.scrollHeight; res(); },0)); }
  async function resolve(cached){
    const l = document.getElementById('dnsLog'); l.innerHTML='';
    const domain = document.getElementById('dnsDomain').value.trim()||'www.example.com';
    let t=0; const step=(msg,ms)=>{ t+=ms; return log('dnsLog',msg,t); };
    await step(`Browser checks local cache for <strong>${domain}</strong>&hellip;`, 2);
    if(cached){ await step(`Cache hit &mdash; TTL not expired. Returning cached A record instantly.`, 3); return; }
    await step('Cache miss. Query sent to configured recursive resolver.', 5);
    await step(`Resolver has no cached answer &mdash; queries a <strong>root server</strong>.`, 22);
    await step(`Root replies: "I don't know ${domain}, but here's the TLD server for .${domain.split('.').pop()}".`, 18);
    await step(`Resolver queries the <strong>TLD server</strong>.`, 20);
    await step(`TLD replies: "Here's the <strong>authoritative</strong> name server for this domain".`, 15);
    await step(`Resolver queries the <strong>authoritative server</strong>.`, 25);
    await step(`Authoritative server replies with the A record and a TTL (e.g. 300s).`, 10);
    await step(`Resolver caches the answer for the TTL, and returns it to the browser.`, 3);
    await step(`<strong style="color:var(--signal)">Resolved.</strong> Browser can now open a TCP/QUIC connection to the returned IP.`, 1);
  }
  document.getElementById('dnsRun').addEventListener('click',()=>resolve(false));
  document.getElementById('dnsRunCached').addEventListener('click',()=>resolve(true));
  resolve(false);
};

/* --- Routing / Dijkstra simulator --- */
TOOLS.routesim = function(){
  const el = document.getElementById('tool-routesim'); if(!el) return;
  const nodes = [
    {id:'A',x:70,y:150},{id:'B',x:220,y:60},{id:'C',x:220,y:240},
    {id:'D',x:380,y:150},{id:'E',x:540,y:60},{id:'F',x:540,y:240},{id:'G',x:690,y:150},
  ];
  const edges = [['A','B',4],['A','C',2],['B','D',5],['C','D',1],['B','E',10],['D','E',3],['D','F',6],['C','F',8],['E','G',4],['F','G',2]];
  el.innerHTML = `<div class="tool">
    <div class="tool-head"><span class="ic">&#9679;</span><h3>ROUTING SIMULATOR &mdash; DIJKSTRA SHORTEST PATH</h3></div>
    <div class="field-row">
      <div class="field"><label>Source</label><select id="rsFrom">${nodes.map(n=>`<option>${n.id}</option>`).join('')}</select></div>
      <div class="field"><label>Destination</label><select id="rsTo">${nodes.map((n,i)=>`<option ${i===nodes.length-1?'selected':''}>${n.id}</option>`).join('')}</select></div>
      <div class="field" style="flex:0"><label>&nbsp;</label><button class="btn primary sm" id="rsRun">Compute shortest path</button></div>
    </div>
    <canvas id="rsCanvas" height="300"></canvas>
    <div class="sim-log" id="rsLog"></div>
  </div>`;
  function draw(highlightPath){
    const cv = document.getElementById('rsCanvas'); const ctx = cv.getContext('2d');
    const w = cv.clientWidth||760; cv.width=w; cv.height=300;
    const scale = w/760;
    ctx.clearRect(0,0,w,300);
    const pos = {}; nodes.forEach(n=> pos[n.id]=[n.x*scale, n.y+10]);
    const pathSet = new Set();
    if(highlightPath) for(let i=0;i<highlightPath.length-1;i++) pathSet.add(highlightPath[i]+highlightPath[i+1]);
    edges.forEach(([a,b,w2])=>{
      const on = pathSet.has(a+b)||pathSet.has(b+a);
      ctx.strokeStyle = on? '#3DDC97':'#1E2830'; ctx.lineWidth = on?3:1.5;
      ctx.beginPath(); ctx.moveTo(...pos[a]); ctx.lineTo(...pos[b]); ctx.stroke();
      const mx=(pos[a][0]+pos[b][0])/2, my=(pos[a][1]+pos[b][1])/2;
      ctx.fillStyle= on? '#3DDC97':'#5C6B76'; ctx.font='11px JetBrains Mono'; ctx.fillText(w2, mx, my-4);
    });
    nodes.forEach(n=>{
      const [x,y]=pos[n.id]; const on = highlightPath && highlightPath.includes(n.id);
      ctx.beginPath(); ctx.arc(x,y,16,0,7);
      ctx.fillStyle = on? '#3DDC97':'#141B23'; ctx.fill();
      ctx.strokeStyle = on? '#3DDC97':'#1E2830'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle = on? '#00160E':'#E4EAEE'; ctx.font='bold 13px JetBrains Mono'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(n.id, x, y);
    });
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function dijkstra(src,dst){
    const dist={}, prev={}, visited=new Set();
    nodes.forEach(n=>dist[n.id]=Infinity); dist[src]=0;
    const log=[];
    while(visited.size<nodes.length){
      let u=null,best=Infinity;
      nodes.forEach(n=>{ if(!visited.has(n.id) && dist[n.id]<best){ best=dist[n.id]; u=n.id; } });
      if(u===null) break;
      visited.add(u);
      log.push(`Visit <strong>${u}</strong> (dist=${dist[u]===Infinity?'&infin;':dist[u]})`);
      edges.forEach(([a,b,w2])=>{
        let x=null,y=null;
        if(a===u){x=a;y=b;} else if(b===u){x=b;y=a;}
        if(x===null) return;
        if(dist[x]+w2 < dist[y]){ dist[y]=dist[x]+w2; prev[y]=x; log.push(`&nbsp;&nbsp;relax ${y} via ${u} &rarr; new dist ${dist[y]}`); }
      });
    }
    const path=[]; let cur=dst;
    if(dist[dst]===Infinity) return {path:null,dist:Infinity,log};
    while(cur){ path.unshift(cur); cur = prev[cur]; }
    return {path,dist:dist[dst],log};
  }
  function run(){
    const src = document.getElementById('rsFrom').value, dst = document.getElementById('rsTo').value;
    const r = dijkstra(src,dst);
    draw(r.path);
    const logEl = document.getElementById('rsLog');
    logEl.innerHTML = r.path
      ? `<div><span class="t">&gt;</span>Shortest path <strong style="color:var(--signal)">${r.path.join(' &rarr; ')}</strong>, total cost <strong>${r.dist}</strong></div>` + r.log.map(m=>`<div><span class="t">&middot;</span>${m}</div>`).join('')
      : `<div>No path exists between ${src} and ${dst}.</div>`;
  }
  document.getElementById('rsRun').addEventListener('click',run);
  draw(null); run();
};

  body.innerHTML = PKT_SAMPLES.map(p=>`<tr data-i="${p.no}"><td>${p.no}</td><td>${p.t}</td><td>${p.src}</td><td>${p.dst}</td><td>${p.proto}</td><td>${p.len}</td><td>${p.info}</td></tr>`).join('');
  body.querySelectorAll('tr').forEach(tr=>tr.addEventListener('click',()=>{
    body.querySelectorAll('tr').forEach(x=>x.classList.remove('sel')); tr.classList.add('sel');
    const p = PKT_SAMPLES[+tr.dataset.i-1];
    document.getElementById('pvDecode').innerHTML = p.layers.map(l=>`<div class="lyr">&#9656; ${l}</div>`).join('');
  }));
};
