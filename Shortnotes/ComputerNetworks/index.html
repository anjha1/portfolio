function startQuiz(diff){
  const pool = QLIST[diff]||[];
  quizSession = { diff, qs: pool, i:0, correct:0 };
  renderQuizQ();
}
function renderQuizQ(){
  const area = document.getElementById('qzArea'); if(!area) return;
  const s = quizSession;
  if(s.i >= s.qs.length){
    STATE.quizStats.attempts++; STATE.quizStats.correct+=s.correct; STATE.quizStats.total+=s.qs.length;
    STATE.quizStats.byTopic[s.diff] = STATE.quizStats.byTopic[s.diff]||{c:0,t:0};
    STATE.quizStats.byTopic[s.diff].c+=s.correct; STATE.quizStats.byTopic[s.diff].t+=s.qs.length;
    saveState();
    area.innerHTML = `<div class="callout"><span class="lbl">RESULT</span>Scored <strong>${s.correct}/${s.qs.length}</strong> on ${s.diff}.</div>
      <button class="btn primary sm" id="qzAgain">Try again</button>`;
    document.getElementById('qzAgain').addEventListener('click',()=>startQuiz(s.diff));
    updateSidebarProgress();
    return;
  }
  const q = s.qs[s.i];
  area.innerHTML = `<div class="quiz-meta"><span>Question ${s.i+1} / ${s.qs.length}</span><span>Score ${s.correct}</span></div>
   <p style="color:var(--text)">${q.q}</p>
   ${q.opts.map((o,idx)=>`<button class="quiz-opt" data-idx="${idx}">${o}</button>`).join('')}
   <div id="qzExp" style="display:none" class="callout" style="margin-top:10px"></div>
   <button class="btn sm" id="qzNext" style="display:none;margin-top:10px">Next &rarr;</button>`;
  area.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.disabled) return;
      area.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
      const idx = +btn.dataset.idx;
      if(idx===q.a){ btn.classList.add('right'); s.correct++; } else { btn.classList.add('wrong'); area.querySelectorAll('.quiz-opt')[q.a].classList.add('right'); }
      const exp = document.getElementById('qzExp'); exp.style.display='block'; exp.innerHTML = `<span class="lbl">EXPLANATION</span>${q.exp}`;
      document.getElementById('qzNext').style.display='inline-flex';
    });
  });
  document.getElementById('qzNext').addEventListener('click',()=>{ s.i++; renderQuizQ(); });
}

/* ---------------- 7. Notes / Bookmarks / Progress rail ---------------- */
function openNotesPanel(){
  const rail = document.getElementById('rightRail'); const content = document.getElementById('railContent');
  content.innerHTML = `<div class="eyebrow">Notes</div>
    <div class="notes-list">
      <textarea id="noteInput" placeholder="Write a note for ${currentChapter?CH[currentChapter].title:'this session'}&hellip;"></textarea>
      <button class="btn primary sm" id="noteAdd">Add note</button>
      <div id="noteList" style="margin-top:14px"></div>
    </div>`;
  function renderList(){
    document.getElementById('noteList').innerHTML = STATE.notes.slice().reverse().map((n,ri)=>{
      const i = STATE.notes.length-1-ri;
      return `<div class="note-card"><div class="meta"><span>${n.chapter||'General'}</span><span>${new Date(n.t).toLocaleDateString()}</span></div><p>${esc(n.text)}</p><button class="btn sm ghost" data-del="${i}" style="margin-top:6px;padding:3px 8px">Delete</button></div>`;
    }).join('') || `<p style="color:var(--text-faint)">No notes yet.</p>`;
    document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{ STATE.notes.splice(+b.dataset.del,1); saveState(); renderList(); updateSidebarProgress(); }));
  }
  document.getElementById('noteAdd').addEventListener('click',()=>{
    const t = document.getElementById('noteInput').value.trim(); if(!t) return;
    STATE.notes.push({text:t, chapter: currentChapter? CH[currentChapter].title : null, t: Date.now()});
    saveState(); document.getElementById('noteInput').value=''; renderList(); updateSidebarProgress();
  });
  renderList();
  document.getElementById('rightRail').classList.add('open');
}
function openBookmarksPanel(){
  const rail = document.getElementById('rightRail'); const content = document.getElementById('railContent');
  const ids = Object.keys(STATE.bookmarks).filter(k=>STATE.bookmarks[k] && CH[k]);
  content.innerHTML = `<div class="eyebrow">Bookmarks</div>` + (ids.length? ids.map(id=>`<div class="card" style="margin-bottom:8px;cursor:pointer" data-go="${id}"><b style="color:var(--signal)">${CH[id].num}</b> ${CH[id].title}</div>`).join('') : `<p style="color:var(--text-faint)">Nothing bookmarked yet &mdash; use the &#9734; button on any chapter.</p>`);
  content.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{ navigate(el.dataset.go); rail.classList.remove('open'); }));
  rail.classList.add('open');
}
function openProgressPanel(){
  const rail = document.getElementById('rightRail'); const content = document.getElementById('railContent');
  const refItems = GROUPS.find(g=>g.g.includes('Reference')).items;
  const total = Object.keys(CH).length - refItems.length;
  const doneN = Object.keys(STATE.done).filter(k=>STATE.done[k] && CH[k] && !refItems.includes(k)).length;
  content.innerHTML = `<div class="eyebrow">Your progress</div>
   <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:16px">
     <div class="card stat"><div class="v signal">${Math.round(doneN/Math.max(total,1)*100)}%</div><div class="l">Overall</div></div>
     <div class="card stat"><div class="v">${STATE.streak.count||0}</div><div class="l">Day streak</div></div>
   </div>
   <div class="eyebrow">By group</div>
   ${GROUPS.filter(g=>!g.g.includes('Reference')).map(g=>{
      const d = g.items.filter(id=>STATE.done[id]).length;
      const pct = Math.round(d/g.items.length*100);
      return `<div style="margin-bottom:10px"><div class="pct-row" style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text-dim)"><span>${g.g.replace(/&middot;.*/,'')}</span><span>${d}/${g.items.length}</span></div><div class="pbar"><span style="width:${pct}%"></span></div></div>`;
   }).join('')}
   <div class="eyebrow" style="margin-top:16px">Quiz accuracy by level</div>
   ${Object.keys(STATE.quizStats.byTopic).length? Object.entries(STATE.quizStats.byTopic).map(([k,v])=>`<div class="out-cell" style="margin-bottom:6px"><div class="k">${k}</div><div class="v">${v.t?Math.round(v.c/v.t*100):0}% (${v.c}/${v.t})</div></div>`).join('') : `<p style="color:var(--text-faint)">Take a quiz to see stats here.</p>`}
  `;
  rail.classList.add('open');
}

/* ---------------- 8. Command palette ---------------- */
function buildCmdIndex(){
  const idx = [];
  Object.values(CH).forEach(c=> idx.push({type:'Chapter', label:`${c.num} ${c.title}`, action:()=>navigate(c.id)}));
  GLOSSARY.forEach(g=> idx.push({type:'Term', label:g[0]+' — '+g[2], action:()=>{ navigate('glossary'); setTimeout(()=>{ const s=document.getElementById('glSearch'); if(s){ s.value=g[0]; s.dispatchEvent(new Event('input')); } },50); }}));
  idx.push({type:'Tool', label:'Open subnet calculator', action:()=>navigate('subnetting')});
  idx.push({type:'Tool', label:'Open packet visualizer', action:()=>navigate('pktviewer')});
  idx.push({type:'Tool', label:'Open routing simulator', action:()=>navigate('routing')});
  idx.push({type:'Tool', label:'Open TCP congestion simulator', action:()=>navigate('tcp')});
  idx.push({type:'Tool', label:'Open DNS simulator', action:()=>navigate('dns')});
  idx.push({type:'Tool', label:'Open quiz', action:openQuizModal});
  idx.push({type:'Tool', label:'Open glossary', action:()=>navigate('glossary')});
  idx.push({type:'Tool', label:'Open compare mode', action:()=>navigate('compare')});
  idx.push({type:'Tool', label:'Open labs', action:()=>navigate('labs')});
  idx.push({type:'Command', label:'Toggle theme', action:toggleTheme});
  idx.push({type:'Command', label:'Show progress', action:openProgressPanel});
  return idx;
}
let CMD_INDEX = [];
let cmdSelIdx = 0;
function openCmdk(){
  CMD_INDEX = CMD_INDEX.length? CMD_INDEX : buildCmdIndex();
  document.getElementById('cmdkBackdrop').classList.add('show');
  const input = document.getElementById('cmdkInput'); input.value=''; input.focus();
  renderCmdk('');
}
function closeCmdk(){ document.getElementById('cmdkBackdrop').classList.remove('show'); }
function renderCmdk(q){
  const list = document.getElementById('cmdkList');
  q = q.toLowerCase();
  const results = (q? CMD_INDEX.filter(x=>x.label.toLowerCase().includes(q)) : CMD_INDEX.filter(x=>x.type==='Tool'||x.type==='Command')).slice(0,40);
  cmdSelIdx = 0;
  list.innerHTML = results.map((r,i)=>`<div class="cmdk-item${i===0?' sel':''}" data-i="${i}"><span>${r.label}</span><span class="k">${r.type}</span></div>`).join('') || `<div style="padding:14px;color:var(--text-faint);font-family:var(--mono);font-size:12.5px">No results.</div>`;
  list.querySelectorAll('.cmdk-item').forEach(el=>el.addEventListener('click',()=>{ results[+el.dataset.i].action(); closeCmdk(); }));
  list.__results = results;
}
function cmdkMove(dir){
  const list = document.getElementById('cmdkList'); const items = [...list.querySelectorAll('.cmdk-item')];
  if(!items.length) return;
  items[cmdSelIdx]?.classList.remove('sel');
  cmdSelIdx = (cmdSelIdx+dir+items.length)%items.length;
  items[cmdSelIdx].classList.add('sel');
  items[cmdSelIdx].scrollIntoView({block:'nearest'});
}
function cmdkActivate(){
  const list = document.getElementById('cmdkList'); const results = list.__results||[];
  if(results[cmdSelIdx]){ results[cmdSelIdx].action(); closeCmdk(); }
}

/* ---------------- 9. calculators dock panel ---------------- */
function openCalcPanel(){
  const rail = document.getElementById('rightRail'); const content = document.getElementById('railContent');
  content.innerHTML = `<div class="eyebrow">Quick calculators</div>
   <h4 style="margin-bottom:6px">Latency</h4>
   <div class="field-row"><div class="field"><label>Distance (km)</label><input id="cLatDist" value="2000"></div><div class="field"><label>Medium speed (km/s)</label><input id="cLatSpeed" value="200000"></div></div>
   <div class="out-grid" id="cLatOut" style="margin-bottom:16px"></div>
   <h4 style="margin-bottom:6px">Throughput</h4>
   <div class="field-row"><div class="field"><label>Data (MB)</label><input id="cThData" value="50"></div><div class="field"><label>Time (s)</label><input id="cThTime" value="4"></div></div>
   <div class="out-grid" id="cThOut" style="margin-bottom:16px"></div>
   <h4 style="margin-bottom:6px">Binary &harr; Decimal IPv4 octet</h4>
   <div class="field-row"><div class="field"><label>Decimal (0-255)</label><input id="cBinDec" value="192"></div></div>
   <div class="out-grid" id="cBinOut"></div>`;
  function upd(){
    const d=parseFloat(document.getElementById('cLatDist').value)||0, sp=parseFloat(document.getElementById('cLatSpeed').value)||1;
    document.getElementById('cLatOut').innerHTML = `<div class="out-cell"><div class="k">Propagation delay</div><div class="v">${(d/sp*1000).toFixed(2)} ms</div></div>`;
    const md=parseFloat(document.getElementById('cThData').value)||0, mt=parseFloat(document.getElementById('cThTime').value)||1;
    document.getElementById('cThOut').innerHTML = `<div class="out-cell"><div class="k">Throughput</div><div class="v">${(md*8/mt).toFixed(2)} Mbps</div></div>`;
    const bd = Math.max(0,Math.min(255,parseInt(document.getElementById('cBinDec').value)||0));
    document.getElementById('cBinOut').innerHTML = `<div class="out-cell"><div class="k">Binary</div><div class="v">${bd.toString(2).padStart(8,'0')}</div></div>`;
  }
  ['cLatDist','cLatSpeed','cThData','cThTime','cBinDec'].forEach(id=>document.getElementById(id).addEventListener('input',upd));
  upd();
  rail.classList.add('open');
}

/* ---------------- 10. theme, mode, bootstrap ---------------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', STATE.theme); }
function toggleTheme(){ STATE.theme = STATE.theme==='dark'?'light':'dark'; saveState(); applyTheme(); }
function applyMode(){
  document.documentElement.setAttribute('data-mode', STATE.mode);
  document.querySelectorAll('#modeSwitch button').forEach(b=> b.classList.toggle('active', b.dataset.mode===STATE.mode));
}
function setMode(m){ STATE.mode = m; saveState(); applyMode(); toast('Mode: '+m[0].toUpperCase()+m.slice(1)); }

function initApp(){
  applyTheme(); applyMode();

  document.getElementById('btnTheme').addEventListener('click',toggleTheme);
  document.getElementById('modeSwitch').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.mode); });

  document.getElementById('btnSearch').addEventListener('click',openCmdk);
  document.getElementById('btnBookmarks').addEventListener('click',openBookmarksPanel);
  document.getElementById('btnNotes').addEventListener('click',openNotesPanel);
  document.getElementById('btnProgress').addEventListener('click',openProgressPanel);
  document.getElementById('railClose').addEventListener('click',()=>document.getElementById('rightRail').classList.remove('open'));

  document.getElementById('dockQuiz').addEventListener('click',openQuizModal);
  document.getElementById('dockCalc').addEventListener('click',openCalcPanel);
  document.getElementById('dockTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

  document.getElementById('btnMenu').addEventListener('click',()=>{ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('show'); });
  document.getElementById('scrim').addEventListener('click',()=>{ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); document.getElementById('rightRail').classList.remove('open'); });

  document.getElementById('sbSearch').addEventListener('input',e=>buildSidebar(e.target.value));

  document.getElementById('cmdkBackdrop').addEventListener('click',e=>{ if(e.target.id==='cmdkBackdrop') closeCmdk(); });
  document.getElementById('cmdkInput').addEventListener('input',e=>renderCmdk(e.target.value));
  document.getElementById('cmdkInput').addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); cmdkMove(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cmdkMove(-1); }
    else if(e.key==='Enter'){ e.preventDefault(); cmdkActivate(); }
    else if(e.key==='Escape'){ closeCmdk(); }
  });

  document.addEventListener('keydown',e=>{
    const tag = (e.target.tagName||'').toLowerCase();
    const typing = tag==='input'||tag==='textarea'||tag==='select';
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); return; }
    if(typing) return;
    if(e.key.toLowerCase()==='q'){ openQuizModal(); }
    else if(e.key.toLowerCase()==='n'){ openNotesPanel(); }
    else if((e.ctrlKey||e.metaKey) && e.key==='b'){ e.preventDefault(); if(currentChapter) toggleBookmark(currentChapter); }
    else if((e.ctrlKey||e.metaKey) && e.key==='/'){ e.preventDefault(); openCmdk(); }
  });

  window.addEventListener('hashchange',()=>{ const id = location.hash.slice(1); if(id && CH[id]) renderChapter(id); else renderHome(); });

  const initId = location.hash.slice(1);
  buildSidebar('');
  if(initId && CH[initId]) renderChapter(initId); else renderHome();
}
document.addEventListener('DOMContentLoaded', initApp);
</script>
